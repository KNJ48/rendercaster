<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WebRTC Caster v14</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #101114;
  color: #eee;
  font-family: system-ui, sans-serif;
}

main {
  max-width: 900px;
  margin: auto;
}

section {
  background: #1b1d22;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
  margin: 16px 0;
}

h1 {
  margin-bottom: 5px;
}

input, select, button {
  font: inherit;
  padding: 11px;
  border-radius: 8px;
}

input, select {
  background: #292c33;
  color: white;
  border: 1px solid #555;
  width: 100%;
}

select {
  margin: 8px 0 16px;
}

button {
  border: none;
  background: #2868d8;
  color: white;
  cursor: pointer;
  margin: 4px;
}

button:hover {
  filter: brightness(1.15);
}

button:disabled {
  opacity: .5;
  cursor: default;
}

#sendButton {
  background: #16834b;
}

#stopButton {
  background: #b83232;
}

#fullscreen {
  background: #7544c7;
}

#status, .info {
  white-space: pre-wrap;
  background: #20232a;
  border-radius: 8px;
  padding: 14px;
  margin-top: 12px;
  font-family: monospace;
  line-height: 1.6;
}

#status {
  color: #90d8ff;
}

.info {
  color: #ccc;
  font-size: 13px;
}

label {
  display: block;
  margin-top: 10px;
}

video {
  width: 100%;
  max-height: 75vh;
  background: black;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 8px;
}

video:fullscreen {
  width: 100vw;
  height: 100vh;
  max-height: none;
  border-radius: 0;
  margin: 0;
}

small {
  color: #aaa;
}
</style>
</head>

<body>

<main>

<h1>WebRTC Caster v14</h1>
<small>Adaptive Streaming + Worker Edition</small>

<div id="status">
初期化中...
</div>

<section>
  <h2>ルーム</h2>
  <input id="room" value="1111" maxlength="32">
</section>

<section>
  <h2>送信</h2>

  <button id="sendButton">🖥 画面を送信</button>
  <button id="stopButton">■ 停止</button>

  <div id="senderInfo" class="info">未送信</div>
</section>

<section>
  <h2>配信設定</h2>

  <label>映像処理方式</label>
  <select id="renderMode">
    <option value="standard">標準WebRTC</option>
    <option value="worker" selected>
      VideoFrame Worker（実験）
    </option>
  </select>

  <label>最大画質</label>
  <select id="quality">
    <option value="360">360p</option>
    <option value="480">480p</option>
    <option value="720" selected>720p</option>
    <option value="1080">1080p</option>
    <option value="native">元画質</option>
  </select>

  <label>FPS</label>
  <select id="fpsMode">
    <option value="auto">自動調整</option>
    <option value="15">15 FPS</option>
    <option value="30">30 FPS</option>
    <option value="60">60 FPS</option>
    <option value="uncapped" selected>制限なし</option>
  </select>

  <label>品質優先度</label>
  <select id="priority">
    <option value="maintain-resolution">
      解像度優先
    </option>
    <option value="maintain-framerate">
      FPS優先
    </option>
    <option value="balanced" selected>
      バランス
    </option>
  </select>

  <label>コーデック</label>
  <select id="codec">
    <option value="auto">ブラウザ自動選択</option>
    <option value="h264">H.264優先</option>
  </select>

  <label>映像の種類</label>
  <select id="contentHint">
    <option value="motion" selected>動き優先</option>
    <option value="detail">細部優先</option>
    <option value="text">文字中心</option>
  </select>

  <button id="applySettings">設定を適用</button>

  <div id="settingsInfo" class="info">設定待機中</div>

  <small>
    映像処理方式とコーデックは次の接続から適用されます。
    画質・FPS・品質優先度は配信中も変更できます。
  </small>
</section>

<section>
  <h2>送信統計</h2>
  <div id="senderStats" class="info">
    接続端末なし
  </div>
</section>

<section>
  <h2>受信</h2>

  <button id="receiveButton">📺 画面を受信</button>
  <button id="fullscreen">⛶ 全画面</button>
  <button id="muteButton">🔊 音声ON</button>

  <video id="video" autoplay playsinline></video>

  <div id="receiverStats" class="info">未接続</div>
</section>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const video = $("video");

let socket = null;
let role = null;

let sourceStream = null;
let sendStream = null;
let workerController = null;
let receiverPeer = null;

const senderPeers = new Map();
const senderICE = new Map();
let receiverICE = [];

const senderHistory = new Map();
let receiverHistory = null;

const peerQuality = new Map();

let currentFPS = 60;
let statsBusy = false;
let settingsBusy = false;
let starting = false;
let stopping = false;

const MAX_BITRATE = 20_000_000;

const QUALITY_STEPS = [
  240, 360, 480, 540, 720, 1080, 1440, 2160
];

function status(text) {
  $("status").textContent = text;
  console.log("[Caster]", text);
}

window.addEventListener("error", event => {
  status("JavaScriptエラー:\n" + event.message);
});

window.addEventListener("unhandledrejection", event => {
  status(
    "非同期エラー:\n" +
    String(event.reason?.message || event.reason)
  );
});

function getRoom() {
  const value = $("room").value.trim();

  if (!/^[A-Za-z0-9_-]{1,32}$/.test(value)) {
    throw new Error("ルームIDが不正です");
  }

  return value;
}

function signal(data) {
  if (socket?.readyState !== WebSocket.OPEN) {
    throw new Error("WebSocket未接続");
  }

  socket.send(JSON.stringify(data));
}

function createPeer() {
  return new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ]
  });
}

// ==================================================
// SETTINGS
// ==================================================

function maxQuality() {
  const value = $("quality").value;

  return value === "native"
    ? Infinity
    : Number(value);
}

function selectedFPS() {
  const value = $("fpsMode").value;

  if (value === "uncapped") return null;
  if (value === "auto") return currentFPS;

  return Number(value);
}

function effectiveQuality(id) {
  const max = maxQuality();

  if ($("priority").value !== "maintain-framerate") {
    return max;
  }

  return Math.min(
    max,
    peerQuality.get(id)?.height ?? max
  );
}

function updateSettingsInfo() {
  $("settingsInfo").textContent =
    "方式: " + $("renderMode").value +
    "\n画質上限: " + $("quality").value +
    "\nFPS上限: " + (selectedFPS() ?? "なし") +
    "\n優先度: " + $("priority").value +
    "\nCodec: " + $("codec").value +
    "\n最大帯域: 20Mbps / 受信者";
}

function preferH264(pc) {
  const transceiver = pc.getTransceivers()
    .find(t => t.sender.track?.kind === "video");

  if (!transceiver) return;

  const caps = RTCRtpSender.getCapabilities("video");

  if (!caps) return;

  const h264 = caps.codecs.filter(
    c => c.mimeType.toLowerCase() === "video/h264"
  );

  const other = caps.codecs.filter(
    c => c.mimeType.toLowerCase() !== "video/h264"
  );

  if (!h264.length) return;

  try {
    transceiver.setCodecPreferences([
      ...h264,
      ...other
    ]);
  } catch (error) {
    console.warn("H264:", error);
  }
}

async function configureSender(sender, id) {
  if (sender.track?.kind !== "video") return;

  const source = sender.track.getSettings();

  const width = source.width || 1280;
  const height = source.height || 720;

  const target = effectiveQuality(id);

  let scale = 1;

  if (Number.isFinite(target)) {
    scale = Math.max(
      1,
      height / target,
      width / (target * 16 / 9)
    );
  }

  const params = sender.getParameters();

  if (!params.encodings?.length) {
    params.encodings = [{}];
  }

  const encoding = params.encodings[0];

  encoding.scaleResolutionDownBy = scale;
  encoding.maxBitrate = MAX_BITRATE;

  const fps = selectedFPS();

  if (fps === null) {
    delete encoding.maxFramerate;
  } else {
    encoding.maxFramerate = fps;
  }

  params.degradationPreference = $("priority").value;

  await sender.setParameters(params);
}

async function configurePeer(id) {
  const pc = senderPeers.get(id);
  if (!pc) return;

  for (const sender of pc.getSenders()) {
    if (sender.track?.kind === "video") {
      await configureSender(sender, id);
    }
  }
}

async function applySettings() {
  if (settingsBusy) return;

  settingsBusy = true;
  $("applySettings").disabled = true;

  try {
    currentFPS = 60;

    const now = Date.now();

    for (const id of senderPeers.keys()) {
      peerQuality.set(id, {
        height: maxQuality(),
        bad: 0,
        good: 0,
        lastChange: now,
        baseline: null,
        ineffective: false,
        pendingEvaluation: null
      });
    }

    const track = sendStream?.getVideoTracks()[0];

    if (track) {
      track.contentHint = $("contentHint").value;
    }

    const errors = [];

    for (const id of senderPeers.keys()) {
      try {
        await configurePeer(id);
      } catch (error) {
        errors.push(error.message);
      }
    }

    updateSettingsInfo();

    status(
      errors.length
        ? "一部の設定に失敗:\n" + errors.join("\n")
        : "配信設定を更新しました"
    );

  } finally {
    settingsBusy = false;
    $("applySettings").disabled = false;
  }
}

// ==================================================
// WORKER
// ==================================================

async function createWorkerStream(source) {
  const sourceTrack = source.getVideoTracks()[0];

  if (
    typeof MediaStreamTrackProcessor === "undefined" ||
    typeof MediaStreamTrackGenerator === "undefined" ||
    typeof VideoFrame === "undefined"
  ) {
    throw new Error("Worker映像API非対応");
  }

  const settings = sourceTrack.getSettings();

  // Worker側では元映像サイズを維持する。
  // 解像度変更はWebRTC側で行う。
  const width = settings.width || 1280;
  const height = settings.height || 720;

  const worker = new Worker("/video-worker.js");

  const processor = new MediaStreamTrackProcessor({
    track: sourceTrack
  });

  const generator = new MediaStreamTrackGenerator({
    kind: "video"
  });

  const reader = processor.readable.getReader();
  const writer = generator.writable.getWriter();

  let running = true;
  let busy = false;

  let fps = 0;
  let dropped = 0;

  let resolveReady;
  let rejectReady;

  const readyPromise = new Promise((resolve, reject) => {
    resolveReady = resolve;
    rejectReady = reject;
  });

  const timeout = setTimeout(() => {
    rejectReady(new Error("Worker起動タイムアウト"));
  }, 10000);

  const output = new MediaStream([generator]);

  for (const track of source.getAudioTracks()) {
    output.addTrack(track);
  }

  const controller = {
    stream: output,

    getStats() {
      return { fps, dropped };
    },

    async stop() {
      if (!running) return;

      running = false;

      // 停止待ちで固まらないよう、まずWorkerを終了
      worker.terminate();

      try {
        await reader.cancel();
      } catch {}

      try {
        await writer.abort();
      } catch {}

      try {
        reader.releaseLock();
      } catch {}

      try {
        writer.releaseLock();
      } catch {}

      try {
        generator.stop();
      } catch {}
    }
  };

  worker.onmessage = async event => {
    const msg = event.data;

    if (msg.type === "ready") {
      clearTimeout(timeout);
      resolveReady();
      return;
    }

    if (msg.type === "stats") {
      fps = msg.fps;
      return;
    }

    if (msg.type === "frame") {
      try {
        if (running) {
          await writer.write(msg.frame);
        }
      } catch (error) {
        if (running) console.warn(error);
      } finally {
        msg.frame.close();
        busy = false;
      }
      return;
    }

    if (msg.type === "frame-error") {
      console.warn(msg.message);
      dropped++;
      busy = false;
      return;
    }

    if (msg.type === "error") {
      clearTimeout(timeout);
      rejectReady(new Error(msg.message));
    }
  };

  worker.onerror = error => {
    clearTimeout(timeout);
    rejectReady(
      new Error(error.message || "Worker error")
    );
  };

  worker.postMessage({
    type: "init",
    width,
    height
  });

  try {
    await readyPromise;
  } catch (error) {
    await controller.stop();
    throw error;
  }

  async function processLoop() {
    try {
      while (running) {
        const { value: frame, done } = await reader.read();

        if (done) break;

        if (!running || busy) {
          frame.close();
          dropped++;
          continue;
        }

        busy = true;

        try {
          worker.postMessage({
            type: "frame",
            frame
          }, [frame]);
        } catch (error) {
          busy = false;
          frame.close();
          throw error;
        }
      }
    } catch (error) {
      if (running) {
        console.error(error);
        status("Worker処理エラー: " + error.message);
      }
    }
  }

  processLoop();

  return controller;
}

// ==================================================
// WEBSOCKET
// ==================================================

function connectSocket() {
  return new Promise((resolve, reject) => {
    const protocol =
      location.protocol === "https:" ? "wss:" : "ws:";

    const ws = new WebSocket(
      protocol + "//" + location.host + "/signal"
    );

    socket = ws;

    ws.onopen = resolve;

    ws.onerror = () => {
      reject(new Error("WebSocket接続失敗"));
    };

    ws.onclose = () => {
      if (socket === ws && role) {
        status("シグナリング接続が切断されました");
      }
    };

    ws.onmessage = async event => {
      try {
        await handleSignal(JSON.parse(event.data));
      } catch (error) {
        console.error(error);
        status("通信エラー: " + error.message);
      }
    };
  });
}

// ==================================================
// SENDER PEER
// ==================================================

async function createSenderPeer(id) {
  if (senderPeers.has(id) || !sendStream) return;

  const pc = createPeer();
  senderPeers.set(id, pc);

  peerQuality.set(id, {
    height: maxQuality(),
    bad: 0,
    good: 0,
    lastChange: Date.now(),
    baseline: null,
    ineffective: false,
    pendingEvaluation: null
  });

  pc.onicecandidate = event => {
    if (
      event.candidate &&
      socket?.readyState === WebSocket.OPEN
    ) {
      signal({
        type: "ice",
        receiverId: id,
        candidate: event.candidate
      });
    }
  };

  try {
    for (const track of sendStream.getTracks()) {
      const sender = pc.addTrack(track, sendStream);

      if (track.kind === "video") {
        try {
          await configureSender(sender, id);
        } catch (error) {
          console.warn("Video settings:", error);
        }
      }
    }

    if ($("codec").value === "h264") {
      preferH264(pc);
    }

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    signal({
      type: "offer",
      receiverId: id,
      sdp: pc.localDescription
    });

  } catch (error) {
    pc.close();
    senderPeers.delete(id);
    peerQuality.delete(id);
    throw error;
  }
}

// ==================================================
// SIGNALING
// ==================================================

async function handleSignal(msg) {
  if (msg.type === "error") {
    status("サーバーエラー: " + msg.message);
    return;
  }

  if (msg.type === "sender-ready") {
    status("送信準備完了。受信者を待っています");
    return;
  }

  if (msg.type === "receiver-ready") {
    status(
      msg.senderOnline
        ? "送信者を発見。接続しています..."
        : "送信者を待っています..."
    );
    return;
  }

  if (msg.type === "receiver-joined" && role === "sender") {
    await createSenderPeer(msg.receiverId);
    return;
  }

  if (msg.type === "receiver-left" && role === "sender") {
    senderPeers.get(msg.receiverId)?.close();
    senderPeers.delete(msg.receiverId);
    senderICE.delete(msg.receiverId);
    senderHistory.delete(msg.receiverId);
    peerQuality.delete(msg.receiverId);
    return;
  }

  if (msg.type === "sender-left") {
    receiverPeer?.close();
    receiverPeer = null;
    receiverICE = [];
    receiverHistory = null;
    video.srcObject = null;
    status("送信者が退出しました");
    return;
  }

  if (msg.type === "answer" && role === "sender") {
    const pc = senderPeers.get(msg.receiverId);

    if (!pc || pc.signalingState !== "have-local-offer") {
      return;
    }

    await pc.setRemoteDescription(msg.sdp);

    for (const ice of senderICE.get(msg.receiverId) || []) {
      await pc.addIceCandidate(ice);
    }

    senderICE.delete(msg.receiverId);
    return;
  }

  if (msg.type === "offer" && role === "receiver") {
    receiverPeer?.close();

    const pc = createPeer();
    receiverPeer = pc;
    receiverHistory = null;

    pc.ontrack = event => {
      if (event.streams[0]) {
        video.srcObject = event.streams[0];
      } else {
        const media = video.srcObject || new MediaStream();
        media.addTrack(event.track);
        video.srcObject = media;
      }

      video.play().catch(console.warn);
    };

    pc.onicecandidate = event => {
      if (
        event.candidate &&
        socket?.readyState === WebSocket.OPEN
      ) {
        signal({
          type: "ice",
          candidate: event.candidate
        });
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc !== receiverPeer) return;

      if (pc.connectionState === "connected") {
        status("接続成功！ 映像受信中");
      }

      if (pc.connectionState === "failed") {
        status("WebRTC接続失敗");
      }
    };

    await pc.setRemoteDescription(msg.sdp);

    for (const ice of receiverICE) {
      await pc.addIceCandidate(ice);
    }

    receiverICE = [];

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    signal({
      type: "answer",
      sdp: pc.localDescription
    });

    return;
  }

  if (msg.type === "ice") {
    if (role === "sender") {
      const pc = senderPeers.get(msg.receiverId);
      if (!pc) return;

      if (pc.remoteDescription) {
        await pc.addIceCandidate(msg.candidate);
      } else {
        if (!senderICE.has(msg.receiverId)) {
          senderICE.set(msg.receiverId, []);
        }

        senderICE.get(msg.receiverId)
          .push(msg.candidate);
      }
    } else {
      if (receiverPeer?.remoteDescription) {
        await receiverPeer.addIceCandidate(msg.candidate);
      } else {
        receiverICE.push(msg.candidate);
      }
    }
  }
}

// ==================================================
// START / STOP
// ==================================================

async function stop(show = true) {
  if (stopping) return;
  stopping = true;

  try {
    role = null;

    for (const pc of senderPeers.values()) {
      pc.close();
    }

    senderPeers.clear();
    senderICE.clear();
    senderHistory.clear();
    peerQuality.clear();

    receiverPeer?.close();
    receiverPeer = null;
    receiverICE = [];
    receiverHistory = null;

    const ws = socket;
    socket = null;
    ws?.close();

    if (workerController) {
      await workerController.stop();
      workerController = null;
    }

    sourceStream?.getTracks().forEach(track => {
      track.onended = null;
      track.stop();
    });

    sourceStream = null;
    sendStream = null;
    video.srcObject = null;

    if (show) status("停止しました");
  } finally {
    stopping = false;
  }
}

$("sendButton").addEventListener("click", async () => {
  if (starting || role) return;

  starting = true;
  $("sendButton").disabled = true;

  try {
    const room = getRoom();

    status("共有する画面を選択してください...");

    sourceStream =
      await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: true
      });

    sendStream = sourceStream;

    if ($("renderMode").value === "worker") {
      try {
        status("Worker起動中...");

        workerController =
          await createWorkerStream(sourceStream);

        sendStream = workerController.stream;

        status("Worker起動成功");
      } catch (error) {
        console.warn("Worker fallback:", error);

        workerController = null;
        sendStream = sourceStream;

        status(
          "Worker非対応のため標準方式を使用\n" +
          error.message
        );
      }
    }

    const track = sendStream.getVideoTracks()[0];

    if (track) {
      track.contentHint = $("contentHint").value;
    }

    const sourceTrack = sourceStream.getVideoTracks()[0];

    if (sourceTrack) {
      sourceTrack.onended = () => stop();
    }

    role = "sender";

    await connectSocket();

    signal({
      type: "sender-join",
      room
    });

  } catch (error) {
    status("送信エラー: " + error.message);
    await stop(false);
  } finally {
    starting = false;
    $("sendButton").disabled = false;
  }
});

$("receiveButton").addEventListener("click", async () => {
  if (role) return;

  try {
    const room = getRoom();

    role = "receiver";

    await connectSocket();

    signal({
      type: "receiver-join",
      room
    });

    status("受信準備完了");
  } catch (error) {
    status("受信エラー: " + error.message);
    await stop(false);
  }
});

$("stopButton").addEventListener("click", () => stop());

$("applySettings").addEventListener("click", () => {
  applySettings().catch(error => {
    status("設定エラー: " + error.message);
  });
});

// ==================================================
// FULLSCREEN / AUDIO
// ==================================================

$("fullscreen").addEventListener("click", async () => {
  try {
    if (!video.srcObject) {
      throw new Error("映像がありません");
    }

    if (video.requestFullscreen) {
      await video.requestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    }
  } catch (error) {
    status("全画面エラー: " + error.message);
  }
});

$("muteButton").addEventListener("click", () => {
  video.muted = !video.muted;

  $("muteButton").textContent =
    video.muted ? "🔇 ミュート中" : "🔊 音声ON";
});

// ==================================================
// STATS
// ==================================================

function findVideo(stats, type) {
  for (const report of stats.values()) {
    if (
      report.type === type &&
      (report.kind === "video" || report.mediaType === "video")
    ) {
      return report;
    }
  }

  return null;
}

function calculateMbps(report, old, direction) {
  if (!old) return null;

  const bytes = direction === "send"
    ? report.bytesSent
    : report.bytesReceived;

  const seconds = (report.timestamp - old.time) / 1000;

  if (seconds <= 0 || bytes == null) return null;

  return Math.max(
    0,
    (bytes - old.bytes) * 8 / seconds / 1e6
  );
}

async function updateSenderStats() {
  const lines = [];
  const reports = [];

  let index = 1;

  for (const [id, pc] of senderPeers) {
    if (pc.signalingState === "closed") continue;

    try {
      const stats = await pc.getStats();
      const report = findVideo(stats, "outbound-rtp");

      if (!report) continue;

      const mbps = calculateMbps(
        report,
        senderHistory.get(id),
        "send"
      );

      senderHistory.set(id, {
        bytes: report.bytesSent || 0,
        time: report.timestamp
      });

      reports.push({ id, report });

      const q = peerQuality.get(id);

      lines.push(
        "端末 " + index +
        "\n解像度: " +
        (report.frameWidth ?? "?") + "×" +
        (report.frameHeight ?? "?") +
        "\nFPS: " + (report.framesPerSecond ?? "?") +
        "\n速度: " +
        (mbps === null ? "計測中" : mbps.toFixed(2) + " Mbps") +
        "\nCodec: " +
        (stats.get(report.codecId)?.mimeType || "?") +
        "\n自動画質目標: " +
        (q?.height === Infinity
          ? "元画質"
          : (q?.height ?? "?") + "p") +
        "\n自動調整: " +
        (q?.ineffective ? "効果なし・停止" : "有効") +
        "\n状態: " + pc.connectionState
      );

      index++;
    } catch (error) {
      console.warn(error);
    }
  }

  $("senderStats").textContent =
    lines.join("\n\n") || "接続端末なし";

  return reports;
}

async function updateReceiverStats() {
  if (!receiverPeer || receiverPeer.signalingState === "closed") {
    $("receiverStats").textContent = "未接続";
    return;
  }

  const stats = await receiverPeer.getStats();
  const report = findVideo(stats, "inbound-rtp");

  if (!report) return;

  const mbps = calculateMbps(
    report,
    receiverHistory,
    "receive"
  );

  receiverHistory = {
    bytes: report.bytesReceived || 0,
    time: report.timestamp
  };

  $("receiverStats").textContent =
    "実測受信" +
    "\n解像度: " +
    (report.frameWidth ?? video.videoWidth ?? "?") +
    "×" +
    (report.frameHeight ?? video.videoHeight ?? "?") +
    "\nFPS: " + (report.framesPerSecond ?? "?") +
    "\n速度: " +
    (mbps === null ? "計測中" : mbps.toFixed(2) + " Mbps") +
    "\nCodec: " +
    (stats.get(report.codecId)?.mimeType || "?") +
    "\nパケットロス: " + (report.packetsLost ?? "?");
}

// ==================================================
// ADAPTIVE QUALITY
// ==================================================

function lowerQuality(height) {
  if (height === Infinity) return 1080;

  const steps = QUALITY_STEPS.filter(q => q < height);

  return steps.length ? steps[steps.length - 1] : height;
}

function raiseQuality(height, max) {
  const steps = QUALITY_STEPS.filter(
    q => q > height && q <= max
  );

  return steps.length ? steps[0] : height;
}

async function adaptiveQuality(reports) {
  if (
    role !== "sender" ||
    $("priority").value !== "maintain-framerate" ||
    settingsBusy
  ) return;

  const targetFPS = selectedFPS();
  if (!targetFPS) return;

  const now = Date.now();

  for (const { id, report } of reports) {
    const state = peerQuality.get(id);
    const pc = senderPeers.get(id);

    if (
      !state ||
      !pc ||
      state.ineffective ||
      pc.connectionState !== "connected"
    ) continue;

    const fps = report.framesPerSecond;

    if (!Number.isFinite(fps) || fps <= 0) continue;

    // 前回の解像度変更の効果を評価
    if (state.pendingEvaluation) {
      const evaluation = state.pendingEvaluation;

      if (now - evaluation.startedAt >= 6000) {
        const improvement = fps - evaluation.previousFPS;

        // 3FPS未満の改善なら解像度変更は効果が薄い
        if (improvement < 3) {
          state.ineffective = true;
          state.height = maxQuality();

          try {
            await configurePeer(id);
          } catch (error) {
            console.warn(error);
          }

          console.log(
            "自動画質調整停止：FPS改善なし",
            id,
            improvement
          );
        }

        state.pendingEvaluation = null;
        state.lastChange = now;
      }

      continue;
    }

    if (now - state.lastChange < 5000) continue;

    if (fps < targetFPS * 0.9) {
      state.bad++;
      state.good = 0;
    } else if (fps >= targetFPS * 0.98) {
      state.good++;
      state.bad = 0;
    } else {
      state.bad = 0;
      state.good = 0;
    }

    let next = state.height;
    let lowering = false;

    if (state.bad >= 3) {
      next = lowerQuality(state.height);
      lowering = true;
      state.bad = 0;
    }

    if (state.good >= 10) {
      next = raiseQuality(state.height, maxQuality());
      state.good = 0;
    }

    if (next === state.height) continue;

    const previous = state.height;

    state.height = next;
    state.lastChange = now;

    try {
      await configurePeer(id);

      if (lowering) {
        state.pendingEvaluation = {
          previousFPS: fps,
          startedAt: now
        };
      }
    } catch (error) {
      state.height = previous;
      console.warn(error);
    }
  }
}

// ==================================================
// AUTO FPS
// ==================================================

let autoBad = 0;
let autoGood = 0;
let lastFPSChange = 0;

async function autoFPS(reports) {
  if (
    role !== "sender" ||
    $("fpsMode").value !== "auto" ||
    $("priority").value === "maintain-framerate" ||
    settingsBusy ||
    !reports.length
  ) return;

  const now = Date.now();

  if (now - lastFPSChange < 10000) return;

  const reasons = reports.map(
    x => x.report.qualityLimitationReason
  );

  if (!reasons.some(x => typeof x === "string")) return;

  if (reasons.some(x => x === "cpu" || x === "bandwidth")) {
    autoBad++;
    autoGood = 0;
  } else if (reasons.every(x => x === "none")) {
    autoGood++;
    autoBad = 0;
  }

  let next = currentFPS;

  if (autoBad >= 5) {
    next = currentFPS > 45 ? 45 :
           currentFPS > 30 ? 30 :
           currentFPS > 20 ? 20 : 15;

    autoBad = 0;
  }

  if (autoGood >= 15) {
    next = currentFPS < 20 ? 20 :
           currentFPS < 30 ? 30 :
           currentFPS < 45 ? 45 : 60;

    autoGood = 0;
  }

  if (next === currentFPS) return;

  const previous = currentFPS;
  currentFPS = next;
  lastFPSChange = now;

  try {
    for (const id of senderPeers.keys()) {
      await configurePeer(id);
    }

    updateSettingsInfo();
  } catch (error) {
    currentFPS = previous;
    console.warn(error);
  }
}

// ==================================================
// TIMER
// ==================================================

setInterval(async () => {
  if (statsBusy) return;

  statsBusy = true;

  try {
    const reports = await updateSenderStats();

    await updateReceiverStats();

    await adaptiveQuality(reports);
    await autoFPS(reports);

    if (role === "sender") {
      let info =
        "方式: " +
        (workerController ? "VideoFrame Worker" : "標準WebRTC");

      if (workerController) {
        const stats = workerController.getStats();

        info +=
          "\nWorker処理FPS: " + stats.fps +
          "\n破棄フレーム: " + stats.dropped;
      }

      info +=
        "\n接続台数: " +
        [...senderPeers.values()].filter(
          pc => pc.connectionState === "connected"
        ).length;

      $("senderInfo").textContent = info;
    }

  } catch (error) {
    console.warn(error);
  } finally {
    statsBusy = false;
  }
}, 1000);

updateSettingsInfo();
status("準備完了");

</script>
