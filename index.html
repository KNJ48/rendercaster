<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WebRTC Caster v15 - 120FPS TEST</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #101820;
    color: white;
    font-family: sans-serif;
}

h1 {
    color: #43d9ff;
}

h2 {
    margin-top: 25px;
}

.panel {
    background: #1b2936;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

input, button, select {
    padding: 12px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    margin: 5px;
}

input {
    background: white;
    color: black;
}

button {
    background: #00aaff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0088cc;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.stop {
    background: #e54848;
}

video {
    width: 100%;
    max-height: 65vh;
    background: black;
    border-radius: 10px;
}

.stats {
    background: #09131d;
    padding: 15px;
    border-radius: 8px;
    white-space: pre-line;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.8;
}

.status {
    color: #55ff99;
    font-weight: bold;
}

.hidden {
    display: none;
}

small {
    color: #aaa;
}

</style>
</head>

<body>

<h1>🚀 WebRTC Caster v15</h1>

<p>ブラウザ標準WebRTC / 最大120FPSテスト</p>

<div class="panel">

<h2>接続設定</h2>

<label>ルームID</label>

<input
    id="roomId"
    value="1234"
    placeholder="ルームID"
>

<br>

<label>モード</label>

<select id="role">
    <option value="sender">送信側</option>
    <option value="receiver">受信側</option>
</select>

<br>

<label>キャプチャFPS</label>

<select id="captureFPS">
    <option value="30">30 FPS</option>
    <option value="60">60 FPS</option>
    <option value="120" selected>120 FPS（テスト）</option>
</select>

<br>

<label>
    <input type="checkbox" id="shareAudio" checked>
    音声も共有する
</label>

<br>

<button id="startButton">開始</button>

<button id="stopButton" class="stop" disabled>
    停止
</button>

<p>
状態：
<span id="status" class="status">準備完了</span>
</p>

</div>

<div class="panel">

<h2>映像</h2>

<video
    id="video"
    autoplay
    playsinline
    muted
></video>

<br>

<button id="fullscreenButton">
    全画面表示
</button>

<button id="muteButton">
    ミュート解除
</button>

</div>

<div class="panel">

<h2>📊 実測統計</h2>

<div id="stats" class="stats">
まだ配信していません
</div>

</div>

<div class="panel">

<h2>テスト内容</h2>

<p>
今回のモードでは、Canvas・Worker・VideoFrame加工を使用しません。
</p>

<p>
WebRTCのFPS・ビットレート・解像度を
setParameters() で制限することもありません。
</p>

<small>
120FPSは希望値です。実際のFPSはブラウザや共有対象によって変わります。
</small>

</div>

<script>

"use strict";

// ==============================
// 基本設定
// ==============================

const $ = id => document.getElementById(id);

const video = $("video");

const statusElement = $("status");

const statsElement = $("stats");

const startButton = $("startButton");

const stopButton = $("stopButton");

const roleSelect = $("role");

const captureFPSSelect = $("captureFPS");

const roomInput = $("roomId");

const shareAudioInput = $("shareAudio");

let ws = null;

let localStream = null;

let role = null;

let roomId = null;

let running = false;

let statsTimer = null;

let sessionId = 0;

// 送信側：受信者ごとのPeerConnection
const peers = new Map();

// 受信側：送信者とのPeerConnection
let receiverPeer = null;

// ICE Candidate一時保存
const pendingIce = new Map();

// ビットレート計測用
const previousStats = new Map();

const rtcConfig = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        },
        {
            urls: "stun:stun1.l.google.com:19302"
        }
    ]
};


// ==============================
// 状態表示
// ==============================

function setStatus(text) {
    statusElement.textContent = text;
}

function send(data) {

    if (ws?.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
    }
}


// ==============================
// 開始
// ==============================

startButton.addEventListener("click", start);

async function start() {

    if (running) return;

    role = roleSelect.value;

    roomId = roomInput.value.trim();

    if (!roomId) {
        alert("ルームIDを入力してください");
        return;
    }

    running = true;

    const currentSession = ++sessionId;

    startButton.disabled = true;
    stopButton.disabled = false;

    roleSelect.disabled = true;
    roomInput.disabled = true;

    captureFPSSelect.disabled = true;

    shareAudioInput.disabled = true;

    try {

        if (role === "sender") {

            setStatus("画面キャプチャを開始しています...");

            const fps = Number(captureFPSSelect.value);

            localStream = await navigator.mediaDevices.getDisplayMedia({

                video: {
                    frameRate: {
                        ideal: fps
                    },
                    width: {
                        ideal: 1920
                    },
                    height: {
                        ideal: 1080
                    }
                },

                audio: shareAudioInput.checked

            });

            if (currentSession !== sessionId) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
                return;
            }

            const track = localStream.getVideoTracks()[0];

            if ("contentHint" in track) {
                track.contentHint = "motion";
            }

            console.log("Capture settings:", track.getSettings());

            track.addEventListener("ended", () => {
                stop();
            });

            video.srcObject = localStream;
            video.muted = true;

        } else {

            video.muted = true;
        }

        setStatus("シグナリングサーバーに接続中...");

        await connectWebSocket();

        if (currentSession !== sessionId) return;

        statsTimer = setInterval(updateStats, 1000);

    } catch (err) {

        console.error(err);

        alert("開始失敗: " + err.message);

        stop();
    }
}


// ==============================
// WebSocket接続
// ==============================

function connectWebSocket() {

    return new Promise((resolve, reject) => {

        const protocol =
            location.protocol === "https:" ? "wss:" : "ws:";

        const socket = new WebSocket(
            `${protocol}//${location.host}/signal`
        );

        ws = socket;

        socket.onopen = () => {

            send({
                type: "join",
                roomId,
                role
            });

            resolve();
        };

        socket.onerror = () => {
            reject(new Error("WebSocket接続エラー"));
        };

        socket.onclose = () => {

            if (running) {
                setStatus("サーバーとの接続が切断されました");
                stop();
            }
        };

        socket.onmessage = async event => {

            let data;

            try {
                data = JSON.parse(event.data);
            } catch {
                return;
            }

            try {
                await handleSignal(data);
            } catch (err) {
                console.error("Signal error:", err);
                setStatus("接続処理エラー: " + err.message);
            }
        };
    });
}


// ==============================
// シグナリング処理
// ==============================

async function handleSignal(data) {

    switch (data.type) {

        case "joined":

            setStatus(
                role === "sender"
                    ? "送信準備完了・受信者待機中"
                    : "受信準備完了・送信者待機中"
            );

            break;

        case "receiver-joined":

            if (role === "sender") {
                await createSenderPeer(data.receiverId);
            }

            break;

        case "receiver-left":

            closeSenderPeer(data.receiverId);

            break;

        case "sender-left":

            closeReceiverPeer();

            setStatus("送信者が退出しました");

            break;

        case "sender-ready":

            if (role === "receiver") {
                setStatus("送信者を検出・接続待機中");
            }

            break;

        case "offer":

            if (role === "receiver") {
                await handleOffer(data);
            }

            break;

        case "answer":

            if (role === "sender") {
                await handleAnswer(data);
            }

            break;

        case "ice":

            await handleIce(data);

            break;

        case "error":

            alert(data.message);

            stop();

            break;
    }
}


// ==============================
// PeerConnection生成
// ==============================

function createPeerConnection() {

    const pc = new RTCPeerConnection(rtcConfig);

    pc.onconnectionstatechange = () => {

        console.log("Connection:", pc.connectionState);

        if (pc.connectionState === "connected") {
            setStatus("WebRTC接続成功！");
        }

        if (pc.connectionState === "failed") {
            setStatus("WebRTC接続失敗");
        }
    };

    return pc;
}


// ==============================
// 送信側
// ==============================

async function createSenderPeer(receiverId) {

    if (!running || !localStream) return;

    closeSenderPeer(receiverId);

    const pc = createPeerConnection();

    peers.set(receiverId, pc);

    pendingIce.set(receiverId, []);

    pc.onicecandidate = event => {

        if (event.candidate) {

            send({
                type: "ice",
                receiverId,
                candidate: event.candidate
            });
        }
    };

    // ブラウザ標準のWebRTCへ直接追加
    // Canvas・Worker・setParametersは使用しない

    for (const track of localStream.getTracks()) {

        pc.addTrack(track, localStream);
    }

    const offer = await pc.createOffer();

    await pc.setLocalDescription(offer);

    send({
        type: "offer",
        receiverId,
        sdp: pc.localDescription
    });

    setStatus("受信者と接続中...");
}

function closeSenderPeer(receiverId) {

    const pc = peers.get(receiverId);

    if (pc) {
        pc.close();
    }

    peers.delete(receiverId);

    pendingIce.delete(receiverId);

    previousStats.delete(receiverId);
}

async function handleAnswer(data) {

    const pc = peers.get(data.receiverId);

    if (!pc || pc.signalingState !== "have-local-offer") {
        return;
    }

    await pc.setRemoteDescription(data.sdp);

    await flushIce(data.receiverId, pc);
}


// ==============================
// 受信側
// ==============================

async function handleOffer(data) {

    closeReceiverPeer();

    const pc = createPeerConnection();

    receiverPeer = pc;

    pendingIce.set("receiver", []);

    pc.onicecandidate = event => {

        if (event.candidate) {

            send({
                type: "ice",
                candidate: event.candidate
            });
        }
    };

    pc.ontrack = event => {

        if (event.streams?.[0]) {

            video.srcObject = event.streams[0];

        } else {

            let stream = video.srcObject;

            if (!(stream instanceof MediaStream)) {
                stream = new MediaStream();
                video.srcObject = stream;
            }

            stream.addTrack(event.track);
        }

        video.play().catch(console.warn);
    };

    await pc.setRemoteDescription(data.sdp);

    await flushIce("receiver", pc);

    const answer = await pc.createAnswer();

    await pc.setLocalDescription(answer);

    send({
        type: "answer",
        sdp: pc.localDescription
    });

    setStatus("映像を受信中...");
}

function closeReceiverPeer() {

    if (receiverPeer) {
        receiverPeer.close();
    }

    receiverPeer = null;

    pendingIce.delete("receiver");

    previousStats.delete("receiver");

    video.srcObject = null;
}


// ==============================
// ICE Candidate
// ==============================

async function handleIce(data) {

    const key =
        role === "sender"
            ? data.receiverId
            : "receiver";

    const pc =
        role === "sender"
            ? peers.get(key)
            : receiverPeer;

    if (!pc) return;

    if (pc.remoteDescription) {

        await pc.addIceCandidate(data.candidate);

    } else {

        if (!pendingIce.has(key)) {
            pendingIce.set(key, []);
        }

        pendingIce.get(key).push(data.candidate);
    }
}

async function flushIce(key, pc) {

    const candidates = pendingIce.get(key) || [];

    pendingIce.set(key, []);

    for (const candidate of candidates) {

        try {
            await pc.addIceCandidate(candidate);
        } catch (err) {
            console.warn("ICE candidate error:", err);
        }
    }
}


// ==============================
// 統計
// ==============================

async function updateStats() {

    if (!running) return;

    const lines = [];

    if (role === "sender") {

        const track = localStream?.getVideoTracks()[0];

        if (track) {

            const settings = track.getSettings();

            lines.push("【画面キャプチャ設定】");

            lines.push(
                `解像度: ${settings.width || "?"}×${settings.height || "?"}`
            );

            lines.push(
                `設定FPS: ${settings.frameRate ?? "不明"}`
            );

            lines.push(
                `希望FPS: ${captureFPSSelect.value}`
            );

            lines.push(
                `contentHint: ${track.contentHint || "なし"}`
            );

            lines.push("");

            lines.push(
                "※設定FPSは実際の出力FPSとは異なる場合があります"
            );

            lines.push("");
        }

        lines.push(`接続受信者数: ${peers.size}`);

        for (const [id, pc] of peers) {

            lines.push("");

            lines.push(`【送信先 ${id.slice(0, 8)}】`);

            lines.push(`接続状態: ${pc.connectionState}`);

            await collectStats(pc, "outbound-rtp", id, lines);
        }

    } else {

        if (receiverPeer) {

            lines.push("【受信統計】");

            lines.push(
                `接続状態: ${receiverPeer.connectionState}`
            );

            await collectStats(
                receiverPeer,
                "inbound-rtp",
                "receiver",
                lines
            );

        } else {

            lines.push("送信者を待っています...");
        }
    }

    statsElement.textContent = lines.join("\n");
}

async function collectStats(pc, type, key, lines) {

    if (pc.signalingState === "closed") return;

    const report = await pc.getStats();

    let found = false;

    report.forEach(stat => {

        if (
            stat.type !== type ||
            stat.kind !== "video"
        ) {
            return;
        }

        found = true;

        const codec = report.get(stat.codecId);

        const previous = previousStats.get(key);

        const bytes =
            type === "outbound-rtp"
                ? stat.bytesSent
                : stat.bytesReceived;

        let mbps = 0;

        if (
            previous &&
            previous.statId === stat.id &&
            typeof bytes === "number"
        ) {

            const seconds =
                (stat.timestamp - previous.time) / 1000;

            if (seconds > 0) {

                mbps =
                    ((bytes - previous.bytes) * 8) /
                    seconds /
                    1000000;
            }
        }

        previousStats.set(key, {
            statId: stat.id,
            bytes,
            time: stat.timestamp
        });

        lines.push(
            `解像度: ${stat.frameWidth || "?"}×${stat.frameHeight || "?"}`
        );

        lines.push(
            `FPS: ${stat.framesPerSecond ?? "不明"}`
        );

        lines.push(
            `速度: ${mbps.toFixed(2)} Mbps`
        );

        lines.push(
            `Codec: ${codec?.mimeType || "不明"}`
        );

        if (type === "outbound-rtp") {

            lines.push(
                `送信フレーム累計: ${stat.framesEncoded ?? "不明"}`
            );

            lines.push(
                `品質制限理由: ${stat.qualityLimitationReason || "不明"}`
            );

        } else {

            lines.push(
                `受信フレーム累計: ${stat.framesReceived ?? "不明"}`
            );

            lines.push(
                `デコードフレーム累計: ${stat.framesDecoded ?? "不明"}`
            );

            lines.push(
                `パケットロス: ${stat.packetsLost ?? "不明"}`
            );
        }
    });

    if (!found) {
        lines.push("映像統計を取得中...");
    }
}


// ==============================
// 全画面表示
// ==============================

$("fullscreenButton").addEventListener("click", async () => {

    try {

        if (!document.fullscreenElement) {
            await video.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }

    } catch (err) {
        console.error(err);
    }
});


// ==============================
// ミュート
// ==============================

$("muteButton").addEventListener("click", () => {

    video.muted = !video.muted;

    $("muteButton").textContent =
        video.muted
            ? "ミュート解除"
            : "ミュート";
});


// ==============================
// 停止
// ==============================

stopButton.addEventListener("click", stop);

function stop() {

    ++sessionId;

    running = false;

    if (statsTimer) {
        clearInterval(statsTimer);
    }

    statsTimer = null;

    for (const id of [...peers.keys()]) {
        closeSenderPeer(id);
    }

    closeReceiverPeer();

    if (localStream) {

        for (const track of localStream.getTracks()) {
            track.stop();
        }

        localStream = null;
    }

    if (ws) {

        if (ws.readyState === WebSocket.OPEN) {
            send({ type: "leave" });
        }

        ws.close();
        ws = null;
    }

    pendingIce.clear();

    previousStats.clear();

    video.srcObject = null;

    video.muted = true;

    $("muteButton").textContent = "ミュート解除";

    startButton.disabled = false;

    stopButton.disabled = true;

    roleSelect.disabled = false;

    roomInput.disabled = false;

    captureFPSSelect.disabled = false;

    shareAudioInput.disabled = false;

    statsElement.textContent = "停止しました";

    setStatus("停止しました");
}

</script>

</body>
</html>
