<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebRTC Caster v21</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101114;
  color: #eee;
  font-family: system-ui, sans-serif;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin-bottom: 4px;
}

.subtitle {
  color: #999;
  margin-top: 0;
}

section {
  background: #1b1d22;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
  margin: 16px 0;
}

h2 {
  margin-top: 0;
  font-size: 19px;
}

label {
  display: block;
  margin: 12px 0;
}

input,
select,
textarea {
  display: block;
  width: 100%;
  background: #111318;
  color: white;
  border: 1px solid #444;
  border-radius: 7px;
  padding: 10px;
  margin-top: 6px;
  font: inherit;
}

textarea {
  resize: vertical;
  min-height: 65px;
}

button {
  border: none;
  border-radius: 8px;
  color: white;
  padding: 11px 16px;
  margin: 5px 5px 5px 0;
  cursor: pointer;
  background: #35598a;
  font: inherit;
}

button:hover {
  filter: brightness(1.15);
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

#sendButton {
  background: #16834b;
}

#stopButton {
  background: #b83232;
}

#fullscreen {
  background: #7544c7;
}

#applyButton {
  background: #a36a18;
}

video {
  width: 100%;
  background: black;
  border-radius: 8px;
  max-height: 65vh;
}

#localVideo {
  max-height: 300px;
}

pre {
  background: #101114;
  border: 1px solid #303238;
  padding: 14px;
  border-radius: 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

.status {
  padding: 12px;
  border-radius: 8px;
  background: #252a31;
  margin: 12px 0;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.row > * {
  flex: 1;
  min-width: 150px;
}

.checkbox {
  display: flex;
  gap: 10px;
  align-items: center;
}

.checkbox input {
  width: auto;
  margin: 0;
}

.room-card {
  background: #111318;
  border: 1px solid #383b43;
  border-radius: 10px;
  padding: 15px;
  margin: 12px 0;
}

.room-title {
  font-size: 19px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.room-name {
  color: #bbb;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.room-memo {
  color: #aaa;
  margin-top: 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.room-watch {
  background: #16834b;
  margin-top: 12px;
}

.small {
  color: #999;
  font-size: 13px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>
<main>

<h1>📡 WebRTC Caster v21</h1>
<p class="subtitle">Live Room Directory Edition</p>

<div id="status" class="status">接続準備中...</div>

<section>
  <h2>🖥 画面を送信</h2>

  <label>
    ルームID
    <input id="roomId" maxlength="100" value="I">
  </label>

  <label>
    配信者名
    <input id="senderName" maxlength="80" value="ゲスト">
  </label>

  <label>
    メモ（任意）
    <textarea id="roomMemo" maxlength="300"></textarea>
  </label>

  <button id="sendButton">🖥 画面を送信</button>
  <button id="stopButton" disabled>■ 停止</button>

  <p class="small">
    配信者名とメモは配信中でも変更できます。
  </p>

  <div id="sendInfo" class="small"></div>
</section>

<section>
  <h2>👁 送信プレビュー</h2>
  <video id="localVideo" autoplay muted playsinline></video>
</section>

<section>
  <h2>⚙ 配信設定</h2>

  <div class="row">
    <label>
      最大画質
      <select id="resolution">
        <option value="360">360p</option>
        <option value="480">480p</option>
        <option value="720" selected>720p</option>
        <option value="1080">1080p</option>
        <option value="native">元画質</option>
      </select>
    </label>

    <label>
      FPS
      <select id="fps">
        <option value="auto">自動</option>
        <option value="15">15</option>
        <option value="30" selected>30</option>
        <option value="60">60</option>
        <option value="120">120（実験）</option>
        <option value="browser">制限なし</option>
      </select>
    </label>
  </div>

  <div class="row">
    <label>
      品質優先度
      <select id="priority">
        <option value="maintain-resolution" selected>解像度優先</option>
        <option value="maintain-framerate">FPS優先</option>
        <option value="balanced">バランス</option>
      </select>
    </label>

    <label>
      コーデック
      <select id="codec">
        <option value="auto">ブラウザ自動</option>
        <option value="h264" selected>H.264優先</option>
        <option value="vp8">VP8優先</option>
      </select>
    </label>
  </div>

  <div class="row">
    <label>
      映像の種類
      <select id="hint">
        <option value="motion" selected>動き重視</option>
        <option value="text">文字重視</option>
        <option value="detail">細部重視</option>
      </select>
    </label>

    <label>
      ビットレート
      <select id="bitrate">
        <option value="20000000" selected>最大20Mbps</option>
        <option value="auto">ブラウザ自動</option>
      </select>
    </label>
  </div>

  <label class="checkbox">
    <input type="checkbox" id="audioShare" checked>
    音声共有
  </label>

  <label class="checkbox">
    <input type="checkbox" id="preview">
    送信プレビューを表示
  </label>

  <button id="applyButton" disabled>
    🔄 設定を適用・再接続
  </button>

  <p class="small">
    配信中の設定変更ではWebRTC接続のみ作り直します。
    画面共有とルームは維持されます。
  </p>
</section>

<section>
  <h2>📊 送信統計</h2>
  <pre id="senderStats">未配信</pre>
</section>

<section>
  <h2>📺 画面を受信</h2>

  <button id="receiveButton">📺 画面を受信</button>
  <button id="leaveButton" disabled>■ 受信停止</button>
  <button id="fullscreen">⛶ 全画面</button>
  <button id="muteButton">🔇 ミュート中</button>

  <video id="remoteVideo" autoplay playsinline muted></video>
</section>

<section>
  <h2>📊 受信統計</h2>
  <pre id="receiverStats">未接続</pre>
</section>

<section>
  <h2>🔧 接続監視</h2>
  <pre id="connectionStats">準備中</pre>
</section>

<section>
  <h2>📡 配信中のルーム一覧</h2>

  <p id="roomCount" class="small">
    読み込み中...
  </p>

  <div id="roomList"></div>

  <p class="small">
    配信ルームはリアルタイムで自動更新されます。
  </p>
</section>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const MAX_BITRATE = 20_000_000;
const DISCONNECT_TIMEOUT = 8000;
const RESTART_COOLDOWN = 15000;

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ]
};

let ws = null;

let role = null;
let currentRoom = null;

let localStream = null;
let appliedSettings = null;

let receiverPeer = null;
let receiverGeneration = null;
let receiverHistory = null;

let generationCounter = 0;

const peers = new Map();
const senderHistory = new Map();

const pendingSenderICE = new Map();
const pendingReceiverICE = new Map();

let activeRoomList = [];
let suggestedRoom = "I";

let lastReceiverRestart = 0;
let receiverDisconnectedAt = 0;

function status(message) {
  $("status").textContent = message;
}

function signal(data) {
  if (ws?.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

function connectWS() {
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";

  ws = new WebSocket(`${protocol}//${location.host}/signal`);

  ws.onopen = () => {
    status("シグナリング接続完了");
  };

  ws.onclose = () => {
    status("サーバーとの接続が切断されました");

    stopLocal(false);
    stopReceiver(false);
  };

  ws.onerror = () => {
    status("WebSocketエラー");
  };

  ws.onmessage = async event => {
    let data;

    try {
      data = JSON.parse(event.data);
    } catch {
      return;
    }

    try {
      await handleSignal(data);
    } catch (error) {
      console.error(error);
      status(`通信処理エラー: ${error.message}`);
    }
  };
}

function readSettings() {
  return {
    resolution: $("resolution").value,
    fps: $("fps").value,
    priority: $("priority").value,
    codec: $("codec").value,
    hint: $("hint").value,
    bitrate: $("bitrate").value,
    audio: $("audioShare").checked,
    preview: $("preview").checked
  };
}

function captureFPS(settings) {
  if (settings.fps === "auto" || settings.fps === "browser") {
    return 60;
  }

  return Number(settings.fps);
}

function resolutionHeight(settings) {
  if (settings.resolution === "native") return null;
  return Number(settings.resolution);
}

function updatePreview() {
  const enabled = $("preview").checked;

  $("localVideo").style.display = enabled ? "block" : "none";

  if (enabled && localStream) {
    $("localVideo").srcObject = localStream;
  } else {
    $("localVideo").srcObject = null;
  }
}

function updateButtons() {
  const sending = role === "sender";
  const receiving = role === "receiver";

  $("sendButton").disabled = sending;
  $("stopButton").disabled = !sending;
  $("applyButton").disabled = !sending;

  $("receiveButton").disabled = receiving;
  $("leaveButton").disabled = !receiving;

  $("roomId").disabled = sending || receiving;
}

function setCodecPreference(transceiver, codec) {
  if (codec === "auto") return;

  const capabilities = RTCRtpSender.getCapabilities?.("video");
  if (!capabilities) return;

  const preferred = [];
  const others = [];

  for (const item of capabilities.codecs) {
    const mime = item.mimeType.toLowerCase();

    const match =
      codec === "h264"
        ? mime === "video/h264"
        : mime === "video/vp8";

    if (match) {
      preferred.push(item);
    } else {
      others.push(item);
    }
  }

  if (preferred.length) {
    transceiver.setCodecPreferences([...preferred, ...others]);
  }
}

async function configureSender(sender, settings, track) {
  const params = sender.getParameters();

  if (!params.encodings?.length) {
    params.encodings = [{}];
  }

  const encoding = params.encodings[0];

  encoding.scaleResolutionDownBy = 1;

  if (settings.bitrate !== "auto") {
    encoding.maxBitrate = Math.min(
      Number(settings.bitrate),
      MAX_BITRATE
    );
  }

  if (
    settings.fps !== "auto" &&
    settings.fps !== "browser"
  ) {
    encoding.maxFramerate = Number(settings.fps);
  }

  params.degradationPreference = settings.priority;

  try {
    await sender.setParameters(params);
  } catch (error) {
    console.warn("setParameters:", error);
  }

  track.contentHint = settings.hint;
}

async function applyCaptureConstraints(settings) {
  const track = localStream?.getVideoTracks()[0];
  if (!track) return;

  track.contentHint = settings.hint;

  const constraints = {
    frameRate: {
      ideal: captureFPS(settings)
    }
  };

  const height = resolutionHeight(settings);

  if (height) {
    constraints.height = {
      ideal: height
    };

    constraints.width = {
      ideal: Math.round(height * 16 / 9)
    };
  }

  try {
    await track.applyConstraints(constraints);
  } catch (error) {
    console.warn("applyConstraints:", error);
  }
}

function closeSenderPeer(receiverId) {
  const entry = peers.get(receiverId);

  if (entry) {
    entry.pc.onicecandidate = null;
    entry.pc.close();
    peers.delete(receiverId);
  }

  senderHistory.delete(receiverId);
  pendingSenderICE.delete(receiverId);
}

async function makeOffer(receiverId) {
  if (role !== "sender" || !localStream) return;

  closeSenderPeer(receiverId);

  const pc = new RTCPeerConnection(rtcConfig);
  const generation = ++generationCounter;

  const entry = {
    pc,
    generation,
    disconnectedAt: 0,
    lastRestart: Date.now()
  };

  peers.set(receiverId, entry);

  pc.onicecandidate = event => {
    if (!event.candidate) return;
    if (peers.get(receiverId) !== entry) return;

    signal({
      type: "ice",
      receiverId,
      generation,
      candidate: event.candidate
    });
  };

  pc.onconnectionstatechange = () => {
    if (peers.get(receiverId) !== entry) return;

    if (pc.connectionState === "connected") {
      entry.disconnectedAt = 0;
    }
  };

  for (const track of localStream.getTracks()) {
    if (track.kind === "video") {
      const transceiver = pc.addTransceiver(track, {
        direction: "sendonly",
        streams: [localStream]
      });

      setCodecPreference(
        transceiver,
        appliedSettings.codec
      );

      await configureSender(
        transceiver.sender,
        appliedSettings,
        track
      );
    } else {
      pc.addTrack(track, localStream);
    }
  }

  const offer = await pc.createOffer();

  await pc.setLocalDescription(offer);

  if (peers.get(receiverId) !== entry) return;

  signal({
    type: "offer",
    receiverId,
    generation,
    sdp: pc.localDescription
  });
}

async function startSender() {
  if (role) {
    status("先に現在の送受信を停止してください");
    return;
  }

  const room = $("roomId").value;

  if (!room.trim()) {
    status("ルームIDを入力してください");
    return;
  }

  const settings = readSettings();

  try {
    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: {
          ideal: captureFPS(settings)
        }
      },
      audio: settings.audio
    });

    role = "sender";
    currentRoom = room;
    appliedSettings = settings;

    await applyCaptureConstraints(settings);

    const track = localStream.getVideoTracks()[0];

    track.onended = () => {
      stopLocal(true);
    };

    updatePreview();
    updateButtons();

    signal({
      type: "join",
      role: "sender",
      room,
      name: $("senderName").value,
      memo: $("roomMemo").value
    });

    status(`配信開始準備中: ${room}`);
  } catch (error) {
    status(`画面共有エラー: ${error.message}`);
  }
}

function stopLocal(sendLeave = true) {
  if (role !== "sender") return;

  for (const receiverId of [...peers.keys()]) {
    closeSenderPeer(receiverId);
  }

  if (localStream) {
    for (const track of localStream.getTracks()) {
      track.stop();
    }
  }

  localStream = null;
  appliedSettings = null;

  $("localVideo").srcObject = null;
  $("senderStats").textContent = "未配信";
  $("sendInfo").textContent = "";

  role = null;
  currentRoom = null;

  if (sendLeave) {
    signal({ type: "leave" });
  }

  updateButtons();
  status("配信を停止しました");
}

async function applySettings() {
  if (role !== "sender" || !localStream) return;

  status("配信設定を適用中...");

  const settings = readSettings();

  await applyCaptureConstraints(settings);

  appliedSettings = settings;

  updatePreview();

  for (const receiverId of [...peers.keys()]) {
    await makeOffer(receiverId);
  }

  status("設定を適用しました。受信側は自動再接続します");
}

function stopReceiver(sendLeave = true) {
  if (role !== "receiver") return;

  if (receiverPeer) {
    receiverPeer.close();
    receiverPeer = null;
  }

  receiverGeneration = null;
  receiverHistory = null;

  pendingReceiverICE.clear();

  $("remoteVideo").srcObject = null;
  $("receiverStats").textContent = "未接続";

  role = null;
  currentRoom = null;

  if (sendLeave) {
    signal({ type: "leave" });
  }

  updateButtons();
  status("受信を停止しました");
}

function startReceiver(room = $("roomId").value) {
  if (!room.trim()) {
    status("ルームIDを入力してください");
    return;
  }

  if (role === "sender") {
    status("配信中は受信に切り替えられません");
    return;
  }

  if (role === "receiver") {
    stopReceiver(true);
  }

  $("roomId").value = room;

  role = "receiver";
  currentRoom = room;

  updateButtons();

  signal({
    type: "join",
    role: "receiver",
    room
  });

  status(`受信待機中: ${room}`);
}

async function handleOffer(data) {
  if (role !== "receiver") return;

  if (receiverPeer) {
    receiverPeer.close();
  }

  const pc = new RTCPeerConnection(rtcConfig);

  receiverPeer = pc;
  receiverGeneration = data.generation;
  receiverHistory = null;

  receiverDisconnectedAt = 0;

  pc.ontrack = event => {
    if (receiverPeer !== pc) return;

    const stream = event.streams[0] ||
      new MediaStream([event.track]);

    $("remoteVideo").srcObject = stream;

    $("remoteVideo").play().catch(() => {});
  };

  pc.onicecandidate = event => {
    if (!event.candidate) return;
    if (receiverPeer !== pc) return;

    signal({
      type: "ice",
      generation: data.generation,
      candidate: event.candidate
    });
  };

  pc.onconnectionstatechange = () => {
    if (receiverPeer !== pc) return;

    if (pc.connectionState === "connected") {
      receiverDisconnectedAt = 0;
      status(`受信接続完了: ${currentRoom}`);
    }
  };

  await pc.setRemoteDescription(data.sdp);

  const answer = await pc.createAnswer();

  await pc.setLocalDescription(answer);

  if (receiverPeer !== pc) return;

  signal({
    type: "answer",
    generation: data.generation,
    sdp: pc.localDescription
  });

  await flushReceiverICE(data.generation);
}

async function flushReceiverICE(generation) {
  const list = pendingReceiverICE.get(generation) || [];

  pendingReceiverICE.delete(generation);

  for (const candidate of list) {
    try {
      await receiverPeer?.addIceCandidate(candidate);
    } catch (error) {
      console.warn(error);
    }
  }
}

async function handleSignal(data) {
  switch (data.type) {
    case "room-list":
      activeRoomList = data.rooms || [];
      suggestedRoom = data.suggestedRoom || "I";

      renderRooms();

      if (!role && !$("roomId").dataset.edited) {
        $("roomId").value = suggestedRoom;
      }
      break;

    case "joined":
      status(`${data.role === "sender" ? "配信" : "受信"}ルーム参加: ${data.room}`);
      break;

    case "receiver-joined":
      if (role === "sender") {
        await makeOffer(data.receiverId);
      }
      break;

    case "receiver-left":
      closeSenderPeer(data.receiverId);
      break;

    case "sender-ready":
      status("配信者に接続中...");
      break;

    case "sender-left":
      if (role === "receiver") {
        if (receiverPeer) {
          receiverPeer.close();
          receiverPeer = null;
        }

        $("remoteVideo").srcObject = null;
        status("配信が終了しました");
      }
      break;

    case "offer":
      await handleOffer(data);
      break;

    case "answer": {
      const entry = peers.get(data.receiverId);

      if (
        entry &&
        entry.generation === data.generation
      ) {
        await entry.pc.setRemoteDescription(data.sdp);
      }
      break;
    }

    case "ice":
      if (role === "sender") {
        const entry = peers.get(data.receiverId);

        if (
          entry &&
          entry.generation === data.generation
        ) {
          if (entry.pc.remoteDescription) {
            await entry.pc.addIceCandidate(data.candidate);
          } else {
            const key = data.receiverId;

            if (!pendingSenderICE.has(key)) {
              pendingSenderICE.set(key, []);
            }

            pendingSenderICE.get(key).push(data);
          }
        }
      } else if (role === "receiver") {
        if (data.generation === receiverGeneration) {
          if (receiverPeer?.remoteDescription) {
            await receiverPeer.addIceCandidate(data.candidate);
          } else {
            if (!pendingReceiverICE.has(data.generation)) {
              pendingReceiverICE.set(data.generation, []);
            }

            pendingReceiverICE.get(data.generation).push(data.candidate);
          }
        } else if (
          receiverGeneration === null ||
          data.generation > receiverGeneration
        ) {
          if (!pendingReceiverICE.has(data.generation)) {
            pendingReceiverICE.set(data.generation, []);
          }

          pendingReceiverICE.get(data.generation).push(data.candidate);
        }
      }
      break;

    case "restart-request":
      if (role === "sender") {
        const entry = peers.get(data.receiverId);

        if (
          entry &&
          entry.generation === data.generation
        ) {
          await makeOffer(data.receiverId);
        }
      }
      break;

    case "error":
      status(`エラー: ${data.message}`);
      break;
  }
}

function renderRooms() {
  const container = $("roomList");

  container.replaceChildren();

  $("roomCount").textContent =
    `現在 ${activeRoomList.length} 件の配信があります`;

  if (!activeRoomList.length) {
    const p = document.createElement("p");
    p.className = "small";
    p.textContent = "現在配信中のルームはありません。";

    container.appendChild(p);
    return;
  }

  for (const room of activeRoomList) {
    const card = document.createElement("div");
    card.className = "room-card";

    const title = document.createElement("div");
    title.className = "room-title";
    title.textContent = `🟢 ${room.id}`;

    const name = document.createElement("div");
    name.className = "room-name";
    name.textContent = `配信者：${room.name}`;

    card.append(title, name);

    if (room.memo) {
      const memo = document.createElement("div");
      memo.className = "room-memo";
      memo.textContent = room.memo;
      card.appendChild(memo);
    }

    const button = document.createElement("button");
    button.className = "room-watch";
    button.textContent = "📺 視聴";

    button.onclick = () => {
      startReceiver(room.id);

      $("remoteVideo").scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    };

    card.appendChild(button);
    container.appendChild(card);
  }
}

function updateRoomMetadata() {
  if (role !== "sender") return;

  signal({
    type: "update-room",
    name: $("senderName").value,
    memo: $("roomMemo").value
  });
}

function codecName(report, reports) {
  const codec = reports.get(report.codecId);
  return codec?.mimeType || "?";
}

function getSelectedPair(reports) {
  for (const report of reports.values()) {
    if (
      report.type === "candidate-pair" &&
      report.nominated &&
      report.state === "succeeded"
    ) {
      return report;
    }
  }

  return null;
}

function fpsDelta(report, history, key) {
  const now = report.timestamp;
  const count = report[key];

  if (typeof count !== "number") {
    return "?";
  }

  const previous = history?.[key];

  history[key] = {
    count,
    timestamp: now
  };

  if (!previous) return "?";

  const seconds = (now - previous.timestamp) / 1000;

  if (seconds <= 0) return "?";

  return ((count - previous.count) / seconds).toFixed(1);
}

async function updateSenderStats() {
  if (role !== "sender" || !localStream) return;

  const track = localStream.getVideoTracks()[0];
  const settings = track.getSettings();

  let text =
`【キャプチャ】
解像度: ${settings.width}×${settings.height}
設定FPS: ${settings.frameRate || "?"}
contentHint: ${track.contentHint}
トラック状態: ${track.readyState}
`;

  for (const [id, entry] of peers) {
    try {
      const reports = await entry.pc.getStats();

      let outbound = null;

      for (const report of reports.values()) {
        if (
          report.type === "outbound-rtp" &&
          report.kind === "video"
        ) {
          outbound = report;
          break;
        }
      }

      if (!outbound) continue;

      let history = senderHistory.get(id);

      if (!history) {
        history = {};
        senderHistory.set(id, history);
      }

      const encodedFPS = fpsDelta(
        outbound,
        history,
        "framesEncoded"
      );

      const pair = getSelectedPair(reports);

      let localType = "?";
      let protocol = "?";

      if (pair) {
        const candidate = reports.get(pair.localCandidateId);

        localType = candidate?.candidateType || "?";
        protocol = candidate?.protocol || "?";
      }

      text +=
`
【送信先 ${id.slice(0, 8)}】
状態: ${entry.pc.connectionState}
解像度: ${outbound.frameWidth || "?"}×${outbound.frameHeight || "?"}
Codec: ${codecName(outbound, reports)}
WebRTC FPS: ${outbound.framesPerSecond ?? "?"}
実測エンコードFPS: ${encodedFPS}
通信速度: ${((outbound.bytesSent || 0) / 125000).toFixed(2)} MB累計
品質制限: ${outbound.qualityLimitationReason || "?"}
通信: ${localType} / ${protocol}
`;
    } catch (error) {
      console.warn(error);
    }
  }

  $("senderStats").textContent = text;
}

async function updateReceiverStats() {
  if (role !== "receiver" || !receiverPeer) return;

  try {
    const reports = await receiverPeer.getStats();

    let inbound = null;

    for (const report of reports.values()) {
      if (
        report.type === "inbound-rtp" &&
        report.kind === "video"
      ) {
        inbound = report;
        break;
      }
    }

    if (!inbound) return;

    if (!receiverHistory) receiverHistory = {};

    const receivedFPS = fpsDelta(
      inbound,
      receiverHistory,
      "framesReceived"
    );

    const decodedFPS = fpsDelta(
      inbound,
      receiverHistory,
      "framesDecoded"
    );

    const pair = getSelectedPair(reports);

    let localType = "?";
    let protocol = "?";

    if (pair) {
      const candidate = reports.get(pair.localCandidateId);

      localType = candidate?.candidateType || "?";
      protocol = candidate?.protocol || "?";
    }

    $("receiverStats").textContent =
`【実測受信】
状態: ${receiverPeer.connectionState}
解像度: ${inbound.frameWidth || "?"}×${inbound.frameHeight || "?"}
Codec: ${codecName(inbound, reports)}
WebRTC FPS: ${inbound.framesPerSecond ?? "?"}
実測受信FPS: ${receivedFPS}
実測デコードFPS: ${decodedFPS}
破棄フレーム: ${inbound.framesDropped ?? "?"}
パケットロス: ${inbound.packetsLost ?? "?"}
通信: ${localType} / ${protocol}
`;
  } catch (error) {
    console.warn(error);
  }
}

function watchdog() {
  const now = Date.now();

  if (role === "sender") {
    for (const [id, entry] of peers) {
      const state = entry.pc.connectionState;

      if (state === "connected") {
        entry.disconnectedAt = 0;
        continue;
      }

      if (state === "failed" || state === "disconnected") {
        if (!entry.disconnectedAt) {
          entry.disconnectedAt = now;
        }

        if (
          now - entry.disconnectedAt > DISCONNECT_TIMEOUT &&
          now - entry.lastRestart > RESTART_COOLDOWN
        ) {
          makeOffer(id).catch(console.error);
        }
      }
    }
  }

  if (role === "receiver" && receiverPeer) {
    const state = receiverPeer.connectionState;

    if (state === "connected") {
      receiverDisconnectedAt = 0;
    } else if (
      state === "failed" ||
      state === "disconnected"
    ) {
      if (!receiverDisconnectedAt) {
        receiverDisconnectedAt = now;
      }

      if (
        now - receiverDisconnectedAt > DISCONNECT_TIMEOUT &&
        now - lastReceiverRestart > RESTART_COOLDOWN
      ) {
        lastReceiverRestart = now;

        signal({
          type: "restart-request",
          generation: receiverGeneration
        });
      }
    }
  }

  $("connectionStats").textContent =
`WebSocket: ${ws?.readyState === WebSocket.OPEN ? "connected" : "disconnected"}
動作モード: ${role || "待機"}
ルーム: ${currentRoom || "-"}
送信接続数: ${peers.size}
受信接続状態: ${receiverPeer?.connectionState || "-"}
`;
}

$("roomId").addEventListener("input", () => {
  $("roomId").dataset.edited = "1";
});

$("senderName").addEventListener("input", updateRoomMetadata);
$("roomMemo").addEventListener("input", updateRoomMetadata);

$("sendButton").onclick = startSender;
$("stopButton").onclick = () => stopLocal(true);

$("receiveButton").onclick = () => startReceiver();

$("leaveButton").onclick = () => stopReceiver(true);

$("applyButton").onclick = applySettings;

$("preview").onchange = updatePreview;

$("fullscreen").onclick = () => {
  $("remoteVideo").requestFullscreen?.();
};

$("muteButton").onclick = () => {
  const video = $("remoteVideo");

  video.muted = !video.muted;

  $("muteButton").textContent =
    video.muted ? "🔇 ミュート中" : "🔊 音声ON";
};

connectWS();
updateButtons();
updatePreview();

setInterval(updateSenderStats, 1000);
setInterval(updateReceiverStats, 1000);
setInterval(watchdog, 1000);

</script>
