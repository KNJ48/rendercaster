<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebRTC Caster v8</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #101114;
  color: #eee;
  font-family: system-ui, sans-serif;
}

main {
  max-width: 900px;
  margin: auto;
}

section {
  background: #1b1d22;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
  margin: 16px 0;
}

input, select, button {
  font: inherit;
  padding: 11px;
  border-radius: 8px;
}

input, select {
  background: #292c33;
  color: white;
  border: 1px solid #555;
  width: 100%;
}

select {
  margin: 8px 0 16px;
}

button {
  border: 0;
  background: #2868d8;
  color: white;
  cursor: pointer;
  margin: 4px;
}

button:hover {
  filter: brightness(1.15);
}

button:disabled {
  opacity: .5;
}

#sendButton {
  background: #16834b;
}

#stopButton {
  background: #b83232;
}

#fullscreen {
  background: #7544c7;
}

#status, .info {
  white-space: pre-wrap;
  background: #20232a;
  border-radius: 8px;
  padding: 14px;
  margin-top: 12px;
  font-family: monospace;
  line-height: 1.6;
}

#status {
  color: #90d8ff;
}

.info {
  color: #ccc;
  font-size: 13px;
}

label {
  display: block;
}

video {
  width: 100%;
  max-height: 75vh;
  background: black;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 8px;
}

video:fullscreen {
  width: 100vw;
  height: 100vh;
  max-height: none;
  margin: 0;
  border-radius: 0;
}

small {
  color: #aaa;
}
</style>
</head>

<body>
<main>

<h1>WebRTC Caster v8</h1>
<small>FPS-Based Adaptive Quality Edition</small>

<div id="status">準備完了</div>

<section>
  <h2>ルーム</h2>
  <input id="room" value="1111" maxlength="32">
</section>

<section>
  <h2>画面を送信</h2>

  <button id="sendButton">🖥 画面を送信</button>
  <button id="stopButton">■ 停止</button>

  <div id="senderInfo" class="info">未送信</div>
</section>

<section>
  <h2>配信設定</h2>

  <label>最大画質</label>
  <select id="quality">
    <option value="360">360p</option>
    <option value="480">480p</option>
    <option value="720" selected>720p</option>
    <option value="1080">1080p</option>
    <option value="native">元画質</option>
  </select>

  <label>FPS</label>
  <select id="fpsMode">
    <option value="auto">自動調整</option>
    <option value="15">15 FPS</option>
    <option value="30">30 FPS</option>
    <option value="60" selected>60 FPS</option>
    <option value="browser">ブラウザ任せ</option>
  </select>

  <label>品質優先度</label>
  <select id="priority">
    <option value="maintain-resolution">
      解像度優先
    </option>
    <option value="maintain-framerate" selected>
      FPS優先
    </option>
    <option value="balanced">
      バランス
    </option>
  </select>

  <button id="applySettings">設定を適用</button>

  <div id="settingsInfo" class="info">設定待機中</div>

  <small>
    FPS優先モードでは、実測FPSが目標を下回ると
    自動で解像度を下げます。
  </small>
</section>

<section>
  <h2>送信統計</h2>
  <div id="senderStats" class="info">接続端末なし</div>
</section>

<section>
  <h2>画面を受信</h2>

  <button id="receiveButton">📺 画面を受信</button>
  <button id="fullscreen">⛶ 全画面</button>
  <button id="muteButton">🔊 音声ON</button>

  <video id="video" autoplay playsinline></video>

  <div id="receiverStats" class="info">未接続</div>
</section>

</main>

<script>

// ==================================================
// STATE
// ==================================================

const $ = id => document.getElementById(id);

let socket = null;
let mode = null;
let localStream = null;
let receiverPeer = null;

const senderPeers = new Map();
const peerQuality = new Map();

const pendingSenderICE = new Map();
let pendingReceiverICE = [];

const senderHistory = new Map();
let receiverHistory = null;

let currentFPS = 60;
let settingsBusy = false;
let statsBusy = false;

const MAX_BITRATE = 20_000_000;

const video = $("video");

const QUALITY_STEPS = [
  240, 360, 480, 540, 720, 1080, 1440, 2160
];

// ==================================================
// BASIC
// ==================================================

function status(text) {
  console.log(text);
  $("status").textContent = text;
}

function room() {
  const value = $("room").value.trim();

  if (!/^[A-Za-z0-9_-]{1,32}$/.test(value)) {
    throw new Error("ルームIDが不正です");
  }

  return value;
}

function signal(data) {
  if (socket?.readyState !== WebSocket.OPEN) {
    throw new Error("WebSocket未接続");
  }

  socket.send(JSON.stringify(data));
}

function createPeer() {
  return new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ]
  });
}

// ==================================================
// H.264 PRIORITY
// ==================================================

function preferH264(pc) {

  const transceiver = pc.getTransceivers()
    .find(t => t.sender.track?.kind === "video");

  if (!transceiver) return;

  const capabilities =
    RTCRtpSender.getCapabilities("video");

  if (!capabilities) return;

  const codecs = capabilities.codecs;

  const h264 = codecs.filter(
    c => c.mimeType.toLowerCase() === "video/h264"
  );

  const others = codecs.filter(
    c => c.mimeType.toLowerCase() !== "video/h264"
  );

  if (!h264.length) return;

  try {
    transceiver.setCodecPreferences([
      ...h264,
      ...others
    ]);
  } catch (e) {
    console.warn("H264 preference:", e);
  }
}

// ==================================================
// SETTINGS
// ==================================================

function maxQuality() {
  const value = $("quality").value;
  return value === "native" ? Infinity : Number(value);
}

function selectedFPS() {
  const value = $("fpsMode").value;

  if (value === "browser") return null;
  if (value === "auto") return currentFPS;

  return Number(value);
}

function effectiveQuality(receiverId) {

  const max = maxQuality();

  if ($("priority").value !== "maintain-framerate") {
    return max;
  }

  return Math.min(
    max,
    peerQuality.get(receiverId)?.height ?? max
  );
}

function updateSettingsInfo() {

  $("settingsInfo").textContent =
    "画質上限: " +
    $("quality").selectedOptions[0].text +
    "\nFPS目標: " +
    (selectedFPS() ?? "ブラウザ任せ") +
    "\n最大帯域: 20Mbps / 受信者" +
    "\n優先度: " +
    $("priority").selectedOptions[0].text +
    "\nCodec優先: H.264" +
    "\n画質調整基準: 実測FPS";
}

// ==================================================
// VIDEO PARAMETERS
// ==================================================

async function configureSender(sender, receiverId) {

  if (sender.track?.kind !== "video") return;

  const track = sender.track;
  const source = track.getSettings();

  const sourceWidth = source.width || 1280;
  const sourceHeight = source.height || 720;

  const targetHeight = effectiveQuality(receiverId);

  let scale = 1;

  if (Number.isFinite(targetHeight)) {
    scale = Math.max(
      1,
      sourceHeight / targetHeight,
      sourceWidth / (targetHeight * 16 / 9)
    );
  }

  const params = sender.getParameters();

  if (!params.encodings?.length) {
    params.encodings = [{}];
  }

  const encoding = params.encodings[0];

  encoding.scaleResolutionDownBy = scale;
  encoding.maxBitrate = MAX_BITRATE;

  const fps = selectedFPS();

  if (fps === null) {
    delete encoding.maxFramerate;
  } else {
    encoding.maxFramerate = fps;
  }

  params.degradationPreference = $("priority").value;

  await sender.setParameters(params);
}

async function configurePeer(receiverId) {

  const pc = senderPeers.get(receiverId);
  if (!pc) return;

  for (const sender of pc.getSenders()) {
    if (sender.track?.kind === "video") {
      await configureSender(sender, receiverId);
    }
  }
}

async function applySettings() {

  if (settingsBusy) return;

  settingsBusy = true;
  $("applySettings").disabled = true;

  try {

    currentFPS = 60;

    for (const id of senderPeers.keys()) {
      peerQuality.set(id, {
        height: maxQuality(),
        bad: 0,
        good: 0,
        lastChange: Date.now()
      });
    }

    const errors = [];

    for (const id of senderPeers.keys()) {
      try {
        await configurePeer(id);
      } catch (e) {
        errors.push(e.message);
      }
    }

    updateSettingsInfo();

    status(
      errors.length
        ? "一部設定変更に失敗:\n" + errors.join("\n")
        : "配信設定を更新しました"
    );

  } finally {
    settingsBusy = false;
    $("applySettings").disabled = false;
  }
}

// ==================================================
// WEBSOCKET
// ==================================================

function connectSocket() {

  return new Promise((resolve, reject) => {

    const protocol =
      location.protocol === "https:" ? "wss:" : "ws:";

    socket = new WebSocket(
      protocol + "//" + location.host + "/signal"
    );

    socket.onopen = resolve;

    socket.onerror = () => {
      reject(new Error("WebSocket接続失敗"));
    };

    socket.onclose = () => {
      if (mode) {
        status("シグナリング接続が切れました");
      }
    };

    socket.onmessage = async event => {
      try {
        await handleSignal(JSON.parse(event.data));
      } catch (e) {
        console.error(e);
        status("通信エラー:\n" + e.message);
      }
    };
  });
}

// ==================================================
// SENDER PEER
// ==================================================

async function createSenderPeer(receiverId) {

  if (senderPeers.has(receiverId) || !localStream) return;

  const pc = createPeer();

  senderPeers.set(receiverId, pc);

  peerQuality.set(receiverId, {
    height: maxQuality(),
    bad: 0,
    good: 0,
    lastChange: Date.now()
  });

  pc.onicecandidate = event => {
    if (event.candidate && socket?.readyState === WebSocket.OPEN) {
      signal({
        type: "ice",
        receiverId,
        candidate: event.candidate
      });
    }
  };

  pc.onconnectionstatechange = updateSenderInfo;

  try {

    for (const track of localStream.getTracks()) {

      const sender = pc.addTrack(track, localStream);

      if (track.kind === "video") {
        try {
          await configureSender(sender, receiverId);
        } catch (e) {
          console.warn("Video settings:", e);
        }
      }
    }

    preferH264(pc);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    signal({
      type: "offer",
      receiverId,
      sdp: pc.localDescription
    });

    updateSenderInfo();

  } catch (e) {
    pc.close();
    senderPeers.delete(receiverId);
    peerQuality.delete(receiverId);
    throw e;
  }
}

function updateSenderInfo() {

  let connected = 0;

  for (const pc of senderPeers.values()) {
    if (pc.connectionState === "connected") connected++;
  }

  $("senderInfo").textContent =
    "接続中: " + connected +
    "台\nPeer数: " + senderPeers.size +
    "\n音声: " +
    (localStream?.getAudioTracks().length ? "あり" : "なし");
}

// ==================================================
// SIGNAL
// ==================================================

async function handleSignal(msg) {

  if (msg.type === "error") {
    status("サーバーエラー: " + msg.message);
    return;
  }

  if (msg.type === "sender-ready") {
    status("送信準備完了。受信者を待っています。");
    return;
  }

  if (msg.type === "receiver-joined" && mode === "sender") {
    await createSenderPeer(msg.receiverId);
    return;
  }

  if (msg.type === "receiver-left" && mode === "sender") {

    senderPeers.get(msg.receiverId)?.close();

    senderPeers.delete(msg.receiverId);
    peerQuality.delete(msg.receiverId);
    pendingSenderICE.delete(msg.receiverId);
    senderHistory.delete(msg.receiverId);

    updateSenderInfo();
    return;
  }

  if (msg.type === "answer" && mode === "sender") {

    const pc = senderPeers.get(msg.receiverId);

    if (!pc || pc.signalingState !== "have-local-offer") {
      return;
    }

    await pc.setRemoteDescription(msg.sdp);

    const pending =
      pendingSenderICE.get(msg.receiverId) || [];

    for (const candidate of pending) {
      await pc.addIceCandidate(candidate);
    }

    pendingSenderICE.delete(msg.receiverId);
    return;
  }

  if (msg.type === "receiver-ready") {
    status(
      msg.senderOnline
        ? "送信者を発見。接続しています..."
        : "送信者を待っています..."
    );
    return;
  }

  if (msg.type === "sender-left") {

    receiverPeer?.close();
    receiverPeer = null;

    video.srcObject = null;
    pendingReceiverICE = [];
    receiverHistory = null;

    status("送信者が退出しました");
    return;
  }

  if (msg.type === "offer" && mode === "receiver") {

    receiverPeer?.close();
    receiverHistory = null;

    const pc = createPeer();
    receiverPeer = pc;

    pc.ontrack = event => {

      if (event.streams[0]) {
        video.srcObject = event.streams[0];
      } else {
        const media = video.srcObject || new MediaStream();
        media.addTrack(event.track);
        video.srcObject = media;
      }

      video.play().catch(console.warn);
    };

    pc.onicecandidate = event => {
      if (event.candidate && socket?.readyState === WebSocket.OPEN) {
        signal({
          type: "ice",
          candidate: event.candidate
        });
      }
    };

    pc.onconnectionstatechange = () => {

      if (pc !== receiverPeer) return;

      if (pc.connectionState === "connected") {
        status("接続成功！ 映像受信中");
      }

      if (pc.connectionState === "failed") {
        status("WebRTC接続失敗");
      }
    };

    await pc.setRemoteDescription(msg.sdp);

    for (const candidate of pendingReceiverICE) {
      await pc.addIceCandidate(candidate);
    }

    pendingReceiverICE = [];

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    signal({
      type: "answer",
      sdp: pc.localDescription
    });

    return;
  }

  if (msg.type === "ice") {

    if (mode === "sender") {

      const pc = senderPeers.get(msg.receiverId);
      if (!pc) return;

      if (pc.remoteDescription) {
        await pc.addIceCandidate(msg.candidate);
      } else {

        if (!pendingSenderICE.has(msg.receiverId)) {
          pendingSenderICE.set(msg.receiverId, []);
        }

        pendingSenderICE.get(msg.receiverId)
          .push(msg.candidate);
      }

    } else if (mode === "receiver") {

      if (receiverPeer?.remoteDescription) {
        await receiverPeer.addIceCandidate(msg.candidate);
      } else {
        pendingReceiverICE.push(msg.candidate);
      }
    }
  }
}

// ==================================================
// START / STOP
// ==================================================

$("sendButton").onclick = async () => {

  if (mode) {
    status("既に送信または受信を開始しています");
    return;
  }

  try {

    const roomId = room();

    status("共有画面を選択してください...");

    localStream =
      await navigator.mediaDevices.getDisplayMedia({
        video: {
          frameRate: {
            ideal: 60,
            max: 60
          }
        },
        audio: true
      });

    mode = "sender";

    const track = localStream.getVideoTracks()[0];

    if (track) {
      track.contentHint = "detail";
      track.onended = () => stop();
    }

    updateSettingsInfo();

    await connectSocket();

    signal({
      type: "sender-join",
      room: roomId
    });

  } catch (e) {
    status("送信エラー:\n" + e.message);
    stop(false);
  }
};

function stop(showStatus = true) {

  for (const pc of senderPeers.values()) {
    pc.close();
  }

  senderPeers.clear();
  peerQuality.clear();
  pendingSenderICE.clear();
  senderHistory.clear();

  receiverPeer?.close();
  receiverPeer = null;
  receiverHistory = null;
  pendingReceiverICE = [];

  socket?.close();
  socket = null;

  localStream?.getTracks().forEach(track => {
    track.onended = null;
    track.stop();
  });

  localStream = null;
  mode = null;

  video.srcObject = null;

  if (showStatus) status("停止しました");

  updateSenderInfo();
}

$("stopButton").onclick = () => stop();

$("receiveButton").onclick = async () => {

  if (mode) {
    status("既に送信または受信を開始しています");
    return;
  }

  try {

    const roomId = room();

    mode = "receiver";
    status("受信準備中...");

    await connectSocket();

    signal({
      type: "receiver-join",
      room: roomId
    });

  } catch (e) {
    status("受信エラー:\n" + e.message);
    stop(false);
  }
};

$("applySettings").onclick = () => {
  applySettings().catch(e => {
    status("設定エラー:\n" + e.message);
  });
};

// ==================================================
// FULLSCREEN / AUDIO
// ==================================================

$("fullscreen").onclick = async () => {

  try {
    if (!video.srcObject) {
      throw new Error("映像がありません");
    }

    if (video.requestFullscreen) {
      await video.requestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    }

  } catch (e) {
    status("全画面エラー:\n" + e.message);
  }
};

$("muteButton").onclick = () => {

  video.muted = !video.muted;

  $("muteButton").textContent =
    video.muted ? "🔇 ミュート中" : "🔊 音声ON";
};

// ==================================================
// STATS
// ==================================================

function videoReport(stats, type) {

  for (const report of stats.values()) {

    if (
      report.type === type &&
      (report.kind === "video" || report.mediaType === "video") &&
      !report.isRemote
    ) {
      return report;
    }
  }

  return null;
}

function bitrate(report, old, direction) {

  if (!old) return null;

  const bytes =
    direction === "send"
      ? report.bytesSent
      : report.bytesReceived;

  const seconds =
    (report.timestamp - old.time) / 1000;

  if (seconds <= 0) return null;

  return Math.max(
    0,
    (bytes - old.bytes) * 8 / seconds / 1_000_000
  );
}

function codecName(stats, report) {
  return stats.get(report.codecId)?.mimeType || "?";
}

async function updateSenderStats() {

  const lines = [];
  const reports = [];

  let index = 1;

  for (const [id, pc] of senderPeers) {

    if (pc.signalingState === "closed") continue;

    try {

      const stats = await pc.getStats();
      const report = videoReport(stats, "outbound-rtp");

      if (!report) continue;

      const old = senderHistory.get(id);
      const mbps = bitrate(report, old, "send");

      senderHistory.set(id, {
        bytes: report.bytesSent || 0,
        time: report.timestamp
      });

      reports.push({ id, report });

      const quality = peerQuality.get(id);

      lines.push(
        "端末 " + index +
        "\n解像度: " +
        (report.frameWidth ?? "?") + "×" +
        (report.frameHeight ?? "?") +
        "\nFPS: " + (report.framesPerSecond ?? "?") +
        "\n速度: " +
        (mbps === null ? "計測中" : mbps.toFixed(2) + " Mbps") +
        "\nCodec: " + codecName(stats, report) +
        "\n制限原因: " +
        (report.qualityLimitationReason || "不明") +
        "\n自動画質目標: " +
        (quality?.height === Infinity
          ? "元画質"
          : (quality?.height ?? "?") + "p") +
        "\n状態: " + pc.connectionState
      );

      index++;

    } catch (e) {
      console.warn("Sender stats:", e);
    }
  }

  $("senderStats").textContent =
    lines.join("\n\n") || "接続端末なし";

  return reports;
}

async function updateReceiverStats() {

  if (!receiverPeer ||
      receiverPeer.signalingState === "closed") {
    $("receiverStats").textContent = "未接続";
    return;
  }

  try {

    const stats = await receiverPeer.getStats();
    const report = videoReport(stats, "inbound-rtp");

    if (!report) return;

    const mbps = bitrate(report, receiverHistory, "receive");

    receiverHistory = {
      bytes: report.bytesReceived || 0,
      time: report.timestamp
    };

    $("receiverStats").textContent =
      "実測受信" +
      "\n解像度: " +
      (report.frameWidth || video.videoWidth || "?") +
      "×" +
      (report.frameHeight || video.videoHeight || "?") +
      "\nFPS: " + (report.framesPerSecond ?? "?") +
      "\n速度: " +
      (mbps === null ? "計測中" : mbps.toFixed(2) + " Mbps") +
      "\nCodec: " + codecName(stats, report) +
      "\nパケットロス累計: " +
      (report.packetsLost ?? "?");

  } catch (e) {
    console.warn("Receiver stats:", e);
  }
}

// ==================================================
// FPS-BASED ADAPTIVE QUALITY
// ==================================================

function lowerQuality(height) {

  if (height === Infinity) {
    return 1080;
  }

  const lower = QUALITY_STEPS.filter(q => q < height);

  return lower.length
    ? lower[lower.length - 1]
    : height;
}

function raiseQuality(height, max) {

  const higher = QUALITY_STEPS.filter(
    q => q > height && q <= max
  );

  return higher.length
    ? higher[0]
    : height;
}

async function adaptiveQuality(reports) {

  if (
    mode !== "sender" ||
    $("priority").value !== "maintain-framerate" ||
    settingsBusy
  ) {
    return;
  }

  const targetFPS = selectedFPS();

  if (!targetFPS) return;

  const now = Date.now();

  for (const { id, report } of reports) {

    const state = peerQuality.get(id);
    const pc = senderPeers.get(id);

    if (
      !state ||
      !pc ||
      pc.connectionState !== "connected"
    ) {
      continue;
    }

    const actualFPS = report.framesPerSecond;

    if (
      typeof actualFPS !== "number" ||
      !Number.isFinite(actualFPS) ||
      actualFPS <= 0
    ) {
      continue;
    }

    // 設定変更直後は5秒待機
    if (now - state.lastChange < 5000) {
      continue;
    }

    let next = state.height;

    // ----------------------------------
    // 目標FPSの90%未満
    // ----------------------------------

    if (actualFPS < targetFPS * 0.90) {

      state.bad++;
      state.good = 0;

      // 3回連続で低FPSなら解像度を下げる
      if (state.bad >= 3) {

        next = lowerQuality(state.height);

        state.bad = 0;
      }
    }

    // ----------------------------------
    // 目標FPSの98%以上
    // ----------------------------------

    else if (actualFPS >= targetFPS * 0.98) {

      state.good++;
      state.bad = 0;

      // 10回連続で良好なら解像度を上げる
      if (state.good >= 10) {

        next = raiseQuality(
          state.height,
          maxQuality()
        );

        state.good = 0;
      }
    }

    else {
      state.bad = 0;
      state.good = 0;
    }

    if (next === state.height) continue;

    const previous = state.height;

    state.height = next;
    state.lastChange = now;

    try {

      await configurePeer(id);

      console.log(
        "FPS Adaptive:",
        id,
        previous,
        "→",
        next,
        "FPS:",
        actualFPS
      );

    } catch (e) {

      state.height = previous;

      console.warn("Adaptive quality:", e);
    }
  }
}

// ==================================================
// AUTO FPS
// ==================================================

let autoBad = 0;
let autoGood = 0;
let lastFPSChange = 0;

async function autoFPS(reports) {

  if (
    mode !== "sender" ||
    $("fpsMode").value !== "auto" ||
    settingsBusy ||
    reports.length === 0
  ) {
    return;
  }

  const now = Date.now();

  if (now - lastFPSChange < 10000) return;

  // FPS優先＋自動FPSでは、
  // まず画質を下げるためFPS上限は維持する。
  if ($("priority").value === "maintain-framerate") {
    return;
  }

  const reasons = reports.map(x =>
    x.report.qualityLimitationReason
  );

  if (!reasons.some(x => typeof x === "string")) {
    return;
  }

  const limited = reasons.some(x =>
    x === "cpu" || x === "bandwidth"
  );

  if (limited) {
    autoBad++;
    autoGood = 0;
  } else if (reasons.every(x => x === "none")) {
    autoGood++;
    autoBad = 0;
  }

  let next = currentFPS;

  if (autoBad >= 5) {
    next =
      currentFPS > 45 ? 45 :
      currentFPS > 30 ? 30 :
      currentFPS > 20 ? 20 : 15;

    autoBad = 0;
  }

  if (autoGood >= 15) {
    next =
      currentFPS < 20 ? 20 :
      currentFPS < 30 ? 30 :
      currentFPS < 45 ? 45 : 60;

    autoGood = 0;
  }

  if (next === currentFPS) return;

  const previous = currentFPS;

  currentFPS = next;
  lastFPSChange = now;

  try {

    for (const id of senderPeers.keys()) {
      await configurePeer(id);
    }

    updateSettingsInfo();

  } catch (e) {

    currentFPS = previous;

    console.warn("Auto FPS:", e);
  }
}

// ==================================================
// TIMER
// ==================================================

setInterval(async () => {

  if (statsBusy) return;
  statsBusy = true;

  try {

    const reports = await updateSenderStats();

    await updateReceiverStats();

    await adaptiveQuality(reports);
    await autoFPS(reports);

  } catch (e) {
    console.warn(e);
  } finally {
    statsBusy = false;
  }

}, 1000);

updateSettingsInfo();

</script>
