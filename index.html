<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WebRTC Caster v18</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #101114;
  color: #eee;
  font-family: system-ui, sans-serif;
}

main {
  max-width: 900px;
  margin: auto;
}

h1 {
  margin-bottom: 5px;
}

h2 {
  margin-top: 0;
}

section {
  background: #1b1d22;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
  margin: 16px 0;
}

input, select, button {
  font: inherit;
  padding: 11px;
  border-radius: 8px;
}

input, select {
  background: #292c33;
  color: white;
  border: 1px solid #555;
}

input[type="text"], select {
  width: 100%;
}

select {
  margin: 8px 0 16px;
}

button {
  border: 0;
  background: #2868d8;
  color: white;
  cursor: pointer;
  margin: 4px;
}

button:hover {
  filter: brightness(1.15);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#sendButton {
  background: #16834b;
}

#stopButton {
  background: #b83232;
}

#fullscreen {
  background: #7544c7;
}

#status, .info {
  white-space: pre-wrap;
  background: #20232a;
  border-radius: 8px;
  padding: 14px;
  margin-top: 12px;
  font-family: monospace;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

#status {
  color: #90d8ff;
}

.info {
  color: #ccc;
  font-size: 13px;
}

label {
  display: block;
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0;
}

.checkbox input {
  width: 18px;
  height: 18px;
}

video {
  width: 100%;
  max-height: 75vh;
  background: black;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 8px;
}

video:fullscreen {
  width: 100vw;
  height: 100vh;
  max-height: none;
  margin: 0;
  border-radius: 0;
  object-fit: contain;
}

small {
  color: #aaa;
}

.subtitle {
  color: #aaa;
}

.hidden {
  display: none !important;
}

.notice {
  color: #e9c87a;
  font-size: 13px;
  margin-top: 12px;
}

#previewVideo {
  max-height: 300px;
}

@media(max-width:600px) {
  body {
    padding: 10px;
  }

  section {
    padding: 15px;
  }

  button {
    margin: 4px 2px;
  }
}
</style>
</head>

<body>

<main>

<h1>WebRTC Caster v18</h1>
<small class="subtitle">
Classic UI × Optimized WebRTC
</small>

<div id="status">準備完了</div>

<section>
  <h2>ルーム</h2>

  <input
    id="room"
    type="text"
    value="1111"
    maxlength="32"
    placeholder="ルームID"
  >
</section>

<section>
  <h2>画面を送信</h2>

  <button id="sendButton">
    🖥 画面を送信
  </button>

  <button id="stopButton">
    ■ 停止
  </button>

  <div id="senderInfo" class="info">
    未送信
  </div>

  <video
    id="previewVideo"
    autoplay
    playsinline
    muted
    class="hidden"
  ></video>
</section>

<section>
  <h2>配信設定</h2>

  <label>最大画質</label>

  <select id="quality">
    <option value="360">360p</option>
    <option value="480">480p</option>
    <option value="720" selected>720p</option>
    <option value="1080">1080p</option>
    <option value="native">元画質</option>
  </select>

  <label>FPS</label>

  <select id="fpsMode">
    <option value="auto">自動調整</option>
    <option value="15">15 FPS</option>
    <option value="30" selected>30 FPS</option>
    <option value="60">60 FPS</option>
    <option value="120">120 FPS（実験）</option>
    <option value="browser">ブラウザ任せ</option>
  </select>

  <label>品質優先度</label>

  <select id="priority">
    <option value="maintain-resolution" selected>
      解像度優先
    </option>

    <option value="maintain-framerate">
      FPS優先
    </option>

    <option value="balanced">
      バランス
    </option>
  </select>

  <label>コーデック</label>

  <select id="codecMode">
    <option value="auto">ブラウザ自動</option>
    <option value="h264" selected>H.264優先</option>
    <option value="vp8">VP8優先</option>
  </select>

  <label>ビットレート</label>

  <select id="bitrateMode">
    <option value="auto">ブラウザ自動</option>
    <option value="20000000" selected>
      最大20Mbps
    </option>
  </select>

  <label class="checkbox">
    <input
      type="checkbox"
      id="shareAudio"
      checked
    >
    音声を共有
  </label>

  <label class="checkbox">
    <input
      type="checkbox"
      id="showPreview"
    >
    送信側プレビューを表示
  </label>

  <button id="applySettings">
    設定を適用
  </button>

  <div id="settingsInfo" class="info">
    設定待機中
  </div>

  <div class="notice">
    画質・FPS・品質優先度・ビットレートは配信中に変更できます。
    コーデック変更は再接続後に反映されます。
  </div>
</section>

<section>
  <h2>送信統計</h2>

  <div id="senderStats" class="info">
    接続端末なし
  </div>
</section>

<section>
  <h2>画面を受信</h2>

  <button id="receiveButton">
    📺 画面を受信
  </button>

  <button id="fullscreen">
    ⛶ 全画面
  </button>

  <button id="muteButton">
    🔇 ミュート中
  </button>

  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>

  <div id="receiverStats" class="info">
    未接続
  </div>
</section>

<section>
  <h2>システム情報</h2>

  <div class="info">
映像処理：ブラウザ標準WebRTC
Canvas：不使用
Worker：不使用
通信方式：WebRTC P2P
シグナリング：WebSocket
最大帯域：20Mbps / 受信者（設定時）
  </div>

  <small>
    FPSや画質は端末性能・共有対象・通信状況によって変化します。
  </small>
</section>

</main>

<script>
"use strict";

// ==================================================
// BASIC STATE
// ==================================================

const $ = id => document.getElementById(id);

const video = $("video");
const previewVideo = $("previewVideo");

const senderPeers = new Map();
const pendingICE = new Map();
const senderHistory = new Map();
const peerQuality = new Map();

let receiverPeer = null;
let receiverHistory = null;
let pendingReceiverICE = [];

let socket = null;
let localStream = null;

let mode = null;
let running = false;
let sessionId = 0;

let statsBusy = false;
let settingsBusy = false;

const MAX_BITRATE = 20_000_000;

const QUALITY_STEPS = [
  240, 360, 480, 540,
  720, 1080, 1440, 2160
];

const rtcConfig = {
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    },
    {
      urls: "stun:stun1.l.google.com:19302"
    }
  ]
};

// ==================================================
// BASIC FUNCTIONS
// ==================================================

function status(text) {
  console.log(text);
  $("status").textContent = text;
}

function room() {
  const value = $("room").value.trim();

  if (!/^[A-Za-z0-9_-]{1,32}$/.test(value)) {
    throw new Error(
      "ルームIDは英数字・_・-で1～32文字にしてください"
    );
  }

  return value;
}

function signal(data) {
  if (socket?.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify(data));
  }
}

function createPeer() {
  return new RTCPeerConnection(rtcConfig);
}

function fmt(value, digits = 1) {
  if (
    value === null ||
    value === undefined ||
    !Number.isFinite(value)
  ) {
    return "計測中";
  }

  return value.toFixed(digits);
}

function rate(current, previous, seconds) {
  if (
    typeof current !== "number" ||
    typeof previous !== "number" ||
    seconds <= 0
  ) {
    return null;
  }

  const difference = current - previous;

  return difference >= 0
    ? difference / seconds
    : null;
}

// ==================================================
// SETTINGS
// ==================================================

function maxQuality() {
  return $("quality").value === "native"
    ? Infinity
    : Number($("quality").value);
}

function selectedFPS() {
  const value = $("fpsMode").value;

  if (
    value === "browser" ||
    value === "auto"
  ) {
    return null;
  }

  return Number(value);
}

function requestedCaptureFPS() {
  const fps = selectedFPS();

  return fps === null ? 60 : fps;
}

function updateSettingsInfo() {
  $("settingsInfo").textContent =
    "最大画質: " +
    $("quality").selectedOptions[0].text +
    "\nFPS: " +
    $("fpsMode").selectedOptions[0].text +
    "\n品質優先: " +
    $("priority").selectedOptions[0].text +
    "\nコーデック: " +
    $("codecMode").selectedOptions[0].text +
    "\nビットレート: " +
    $("bitrateMode").selectedOptions[0].text +
    "\n映像処理: ブラウザ標準";
}

// ==================================================
// CODEC
// ==================================================

function applyCodecPreferences(pc) {
  const mode = $("codecMode").value;

  if (mode === "auto") return;

  const transceiver =
    pc.getTransceivers().find(t =>
      t.sender.track?.kind === "video"
    );

  if (!transceiver?.setCodecPreferences) {
    return;
  }

  const capabilities =
    RTCRtpSender.getCapabilities?.("video");

  if (!capabilities?.codecs) return;

  const mime =
    mode === "h264"
      ? "video/h264"
      : "video/vp8";

  const preferred = capabilities.codecs.filter(c =>
    c.mimeType.toLowerCase() === mime
  );

  if (!preferred.length) {
    console.warn("Codec unsupported:", mime);
    return;
  }

  const others = capabilities.codecs.filter(c =>
    c.mimeType.toLowerCase() !== mime
  );

  try {
    transceiver.setCodecPreferences([
      ...preferred,
      ...others
    ]);
  } catch (err) {
    console.warn("Codec preference:", err);
  }
}

// ==================================================
// PREVIEW
// ==================================================

function updatePreview() {
  const show =
    running &&
    mode === "sender" &&
    $("showPreview").checked &&
    !!localStream;

  if (show) {
    previewVideo.classList.remove("hidden");

    if (previewVideo.srcObject !== localStream) {
      previewVideo.srcObject = localStream;
    }

    previewVideo.play().catch(console.warn);
  } else {
    previewVideo.pause();
    previewVideo.srcObject = null;
    previewVideo.classList.add("hidden");
  }
}

$("showPreview").addEventListener(
  "change",
  updatePreview
);

// ==================================================
// SENDER PARAMETERS
// ==================================================

function getPeerTargetHeight(id) {
  const maximum = maxQuality();

  if ($("priority").value !== "maintain-framerate") {
    return maximum;
  }

  const state = peerQuality.get(id);

  return Math.min(
    maximum,
    state?.height ?? maximum
  );
}

async function configureSender(sender, id) {
  if (sender.track?.kind !== "video") return;

  const settings = sender.track.getSettings();

  const width = settings.width || 1280;
  const height = settings.height || 720;

  const targetHeight = getPeerTargetHeight(id);

  let scale = 1;

  if (Number.isFinite(targetHeight)) {
    scale = Math.max(
      1,
      height / targetHeight,
      width / (targetHeight * 16 / 9)
    );
  }

  const params = sender.getParameters();

  if (!params.encodings?.length) {
    params.encodings = [{}];
  }

  const encoding = params.encodings[0];

  encoding.scaleResolutionDownBy = scale;

  if ($("bitrateMode").value === "auto") {
    delete encoding.maxBitrate;
  } else {
    encoding.maxBitrate = MAX_BITRATE;
  }

  const fps = selectedFPS();

  if (fps === null) {
    delete encoding.maxFramerate;
  } else {
    encoding.maxFramerate = fps;
  }

  params.degradationPreference =
    $("priority").value;

  await sender.setParameters(params);
}

async function configurePeer(id) {
  const pc = senderPeers.get(id);

  if (!pc) return;

  for (const sender of pc.getSenders()) {
    if (sender.track?.kind === "video") {
      await configureSender(sender, id);
    }
  }
}

function createQualityState() {
  return {
    height: maxQuality(),
    lastChange: Date.now(),
    pendingTest: null,
    disabled: false
  };
}

async function applySettings() {
  if (settingsBusy) return;

  settingsBusy = true;
  $("applySettings").disabled = true;

  try {
    for (const id of senderPeers.keys()) {
      peerQuality.set(id, createQualityState());
    }

    const errors = [];

    for (const id of senderPeers.keys()) {
      try {
        await configurePeer(id);
      } catch (err) {
        errors.push(err.message);
      }
    }

    updateSettingsInfo();

    status(
      errors.length
        ? "一部の設定変更に失敗:\n" +
          errors.join("\n")
        : "配信設定を更新しました"
    );

  } finally {
    settingsBusy = false;
    $("applySettings").disabled = false;
  }
}

$("applySettings").addEventListener(
  "click",
  () => {
    applySettings().catch(err => {
      console.error(err);
      status("設定エラー: " + err.message);
    });
  }
);

// ==================================================
// WEBSOCKET
// ==================================================

function connectSocket() {
  return new Promise((resolve, reject) => {
    const protocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    const ws = new WebSocket(
      `${protocol}//${location.host}/signal`
    );

    socket = ws;

    let settled = false;

    ws.onopen = () => {
      if (socket !== ws || !running) {
        ws.close();
        return;
      }

      settled = true;
      resolve();
    };

    ws.onerror = () => {
      if (!settled) {
        settled = true;
        reject(new Error("WebSocket接続失敗"));
      }
    };

    ws.onclose = () => {
      if (!settled) {
        settled = true;
        reject(new Error("WebSocket接続終了"));
      }

      if (socket === ws && running) {
        stop();
        status("サーバーとの接続が切れました");
      }
    };

    ws.onmessage = async event => {
      if (!running || socket !== ws) return;

      try {
        await handleSignal(JSON.parse(event.data));
      } catch (err) {
        console.error(err);
        status("通信エラー: " + err.message);
      }
    };
  });
}

// ==================================================
// SENDER PEER
// ==================================================

async function createSenderPeer(id) {
  if (!running || !localStream) return;

  closeSenderPeer(id);

  const pc = createPeer();

  senderPeers.set(id, pc);
  peerQuality.set(id, createQualityState());
  pendingICE.set(id, []);

  pc.onicecandidate = event => {
    if (event.candidate) {
      signal({
        type: "ice",
        receiverId: id,
        candidate: event.candidate
      });
    }
  };

  pc.onconnectionstatechange = () => {
    updateSenderInfo();

    if (pc.connectionState === "connected") {
      status("受信端末と接続しました");
    }
  };

  try {
    for (const track of localStream.getTracks()) {
      const sender = pc.addTrack(
        track,
        localStream
      );

      if (track.kind === "video") {
        try {
          await configureSender(sender, id);
        } catch (err) {
          console.warn("Sender parameters:", err);
        }
      }
    }

    applyCodecPreferences(pc);

    const offer = await pc.createOffer();

    if (!running || senderPeers.get(id) !== pc) {
      return;
    }

    await pc.setLocalDescription(offer);

    signal({
      type: "offer",
      receiverId: id,
      sdp: pc.localDescription
    });

    updateSenderInfo();

  } catch (err) {
    closeSenderPeer(id);
    throw err;
  }
}

function closeSenderPeer(id) {
  senderPeers.get(id)?.close();

  senderPeers.delete(id);
  pendingICE.delete(id);
  senderHistory.delete(id);
  peerQuality.delete(id);

  updateSenderInfo();
}

function updateSenderInfo() {
  let connected = 0;

  for (const pc of senderPeers.values()) {
    if (pc.connectionState === "connected") {
      connected++;
    }
  }

  $("senderInfo").textContent =
    mode === "sender"
      ? "接続中: " + connected + "台" +
        "\nPeer数: " + senderPeers.size +
        "\n音声: " +
        (localStream?.getAudioTracks().length
          ? "あり"
          : "なし")
      : "未送信";
}

// ==================================================
// RECEIVER PEER
// ==================================================

function closeReceiverPeer() {
  receiverPeer?.close();
  receiverPeer = null;

  receiverHistory = null;
  pendingReceiverICE = [];

  video.pause();
  video.srcObject = null;

  $("receiverStats").textContent = "未接続";
}

async function handleOffer(msg) {
  const earlyICE = pendingReceiverICE;

  closeReceiverPeer();

  pendingReceiverICE = earlyICE;

  const pc = createPeer();
  receiverPeer = pc;

  pc.onicecandidate = event => {
    if (event.candidate) {
      signal({
        type: "ice",
        candidate: event.candidate
      });
    }
  };

  pc.ontrack = event => {
    if (pc !== receiverPeer) return;

    if (event.streams?.[0]) {
      video.srcObject = event.streams[0];
    } else {
      let stream = video.srcObject;

      if (!(stream instanceof MediaStream)) {
        stream = new MediaStream();
        video.srcObject = stream;
      }

      if (!stream.getTracks().includes(event.track)) {
        stream.addTrack(event.track);
      }
    }

    video.play().catch(console.warn);
  };

  pc.onconnectionstatechange = () => {
    if (pc !== receiverPeer) return;

    if (pc.connectionState === "connected") {
      status("接続成功！ 映像受信中");
    }

    if (pc.connectionState === "failed") {
      status("WebRTC接続失敗");
    }
  };

  await pc.setRemoteDescription(msg.sdp);

  for (const candidate of pendingReceiverICE) {
    try {
      await pc.addIceCandidate(candidate);
    } catch (err) {
      console.warn("ICE:", err);
    }
  }

  pendingReceiverICE = [];

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  signal({
    type: "answer",
    sdp: pc.localDescription
  });
}

// ==================================================
// SIGNAL HANDLER
// ==================================================

async function handleSignal(msg) {
  switch (msg.type) {
    case "joined":
      status(
        mode === "sender"
          ? "送信準備完了。受信者を待っています。"
          : "受信準備完了。送信者を待っています。"
      );
      break;

    case "sender-ready":
      if (mode === "receiver") {
        status("送信者を検出。接続待機中...");
      }
      break;

    case "receiver-joined":
      if (mode === "sender") {
        await createSenderPeer(msg.receiverId);
      }
      break;

    case "receiver-left":
      if (mode === "sender") {
        closeSenderPeer(msg.receiverId);
      }
      break;

    case "sender-left":
      if (mode === "receiver") {
        closeReceiverPeer();
        status("送信者が退出しました");
      }
      break;

    case "offer":
      if (mode === "receiver") {
        await handleOffer(msg);
      }
      break;

    case "answer":
      if (mode === "sender") {
        const pc = senderPeers.get(msg.receiverId);

        if (
          pc &&
          pc.signalingState === "have-local-offer"
        ) {
          await pc.setRemoteDescription(msg.sdp);

          const candidates =
            pendingICE.get(msg.receiverId) || [];

          pendingICE.set(msg.receiverId, []);

          for (const candidate of candidates) {
            try {
              await pc.addIceCandidate(candidate);
            } catch (err) {
              console.warn("ICE:", err);
            }
          }
        }
      }
      break;

    case "ice":
      await handleICE(msg);
      break;

    case "error":
      status("サーバーエラー: " + msg.message);
      stop(false);
      break;
  }
}

// ==================================================
// ICE
// ==================================================

async function handleICE(msg) {
  if (!msg.candidate) return;

  if (mode === "sender") {
    const id = msg.receiverId;
    const pc = senderPeers.get(id);

    if (!pc) return;

    if (pc.remoteDescription) {
      try {
        await pc.addIceCandidate(msg.candidate);
      } catch (err) {
        console.warn("ICE:", err);
      }
    } else {
      if (!pendingICE.has(id)) {
        pendingICE.set(id, []);
      }

      pendingICE.get(id).push(msg.candidate);
    }

  } else if (mode === "receiver") {
    if (receiverPeer?.remoteDescription) {
      try {
        await receiverPeer.addIceCandidate(
          msg.candidate
        );
      } catch (err) {
        console.warn("ICE:", err);
      }
    } else {
      pendingReceiverICE.push(msg.candidate);
    }
  }
}

// ==================================================
// START SENDER
// ==================================================

$("sendButton").addEventListener(
  "click",
  async () => {
    if (running) {
      status("既に送信または受信しています");
      return;
    }

    let stream = null;

    try {
      const roomId = room();

      running = true;
      mode = "sender";

      const token = ++sessionId;

      $("sendButton").disabled = true;
      $("receiveButton").disabled = true;
      $("room").disabled = true;

      status("共有する画面を選択してください...");

      const fps = requestedCaptureFPS();

      stream =
        await navigator.mediaDevices.getDisplayMedia({
          video: {
            frameRate: {
              ideal: fps
            }
          },
          audio: $("shareAudio").checked
        });

      if (token !== sessionId) {
        stream.getTracks().forEach(t => t.stop());
        return;
      }

      localStream = stream;

      const track = stream.getVideoTracks()[0];

      if (track) {
        track.contentHint = "motion";

        track.addEventListener(
          "ended",
          () => stop(),
          { once: true }
        );
      }

      updatePreview();
      updateSenderInfo();

      await connectSocket();

      if (token !== sessionId) return;

      signal({
        type: "join",
        roomId,
        role: "sender"
      });

    } catch (err) {
      console.error(err);

      if (stream && stream !== localStream) {
        stream.getTracks().forEach(t => t.stop());
      }

      stop(false);
      status("送信エラー:\n" + err.message);
    }
  }
);

// ==================================================
// START RECEIVER
// ==================================================

$("receiveButton").addEventListener(
  "click",
  async () => {
    if (running) {
      status("既に送信または受信しています");
      return;
    }

    try {
      const roomId = room();

      running = true;
      mode = "receiver";

      const token = ++sessionId;

      $("sendButton").disabled = true;
      $("receiveButton").disabled = true;
      $("room").disabled = true;

      status("受信準備中...");

      video.muted = true;

      await connectSocket();

      if (token !== sessionId) return;

      signal({
        type: "join",
        roomId,
        role: "receiver"
      });

    } catch (err) {
      console.error(err);

      stop(false);
      status("受信エラー:\n" + err.message);
    }
  }
);

// ==================================================
// STOP
// ==================================================

function stop(showStatus = true) {
  ++sessionId;

  running = false;

  for (const id of [...senderPeers.keys()]) {
    closeSenderPeer(id);
  }

  closeReceiverPeer();

  socket?.close();
  socket = null;

  if (localStream) {
    localStream.getTracks().forEach(track => {
      track.stop();
    });
  }

  localStream = null;
  mode = null;

  pendingICE.clear();
  senderHistory.clear();
  peerQuality.clear();

  updatePreview();
  updateSenderInfo();

  $("sendButton").disabled = false;
  $("receiveButton").disabled = false;
  $("room").disabled = false;

  video.muted = true;

  $("muteButton").textContent =
    "🔇 ミュート中";

  $("senderStats").textContent =
    "接続端末なし";

  $("receiverStats").textContent =
    "未接続";

  if (showStatus) {
    status("停止しました");
  }
}

$("stopButton").addEventListener(
  "click",
  () => stop()
);

// ==================================================
// FULLSCREEN
// ==================================================

$("fullscreen").addEventListener(
  "click",
  async () => {
    try {
      if (!video.srcObject) {
        throw new Error("受信映像がありません");
      }

      if (!document.fullscreenElement) {
        await video.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }

    } catch (err) {
      status("全画面エラー:\n" + err.message);
    }
  }
);

// ==================================================
// AUDIO
// ==================================================

$("muteButton").addEventListener(
  "click",
  () => {
    video.muted = !video.muted;

    $("muteButton").textContent =
      video.muted
        ? "🔇 ミュート中"
        : "🔊 音声ON";
  }
);

// ==================================================
// STATS HELPERS
// ==================================================

function getVideoReport(stats, type) {
  for (const report of stats.values()) {
    if (
      report.type === type &&
      (
        report.kind === "video" ||
        report.mediaType === "video"
      ) &&
      !report.isRemote
    ) {
      return report;
    }
  }

  return null;
}

function codecName(stats, report) {
  return stats.get(report.codecId)?.mimeType || "不明";
}

function getConnectionInfo(stats) {
  let pair = null;

  for (const report of stats.values()) {
    if (
      report.type === "transport" &&
      report.selectedCandidatePairId
    ) {
      pair = stats.get(
        report.selectedCandidatePairId
      );
      if (pair) break;
    }
  }

  if (!pair) {
    for (const report of stats.values()) {
      if (
        report.type === "candidate-pair" &&
        report.state === "succeeded" &&
        report.nominated
      ) {
        pair = report;
        break;
      }
    }
  }

  if (!pair) return "";

  const local = stats.get(pair.localCandidateId);
  const remote = stats.get(pair.remoteCandidateId);

  const lines = [];

  if (typeof pair.currentRoundTripTime === "number") {
    lines.push(
      "RTT: " +
      fmt(pair.currentRoundTripTime * 1000) +
      " ms"
    );
  }

  if (
    typeof pair.availableOutgoingBitrate === "number"
  ) {
    lines.push(
      "推定送信帯域: " +
      fmt(pair.availableOutgoingBitrate / 1e6, 2) +
      " Mbps"
    );
  }

  if (local) {
    lines.push(
      "通信: " +
      (local.candidateType || "?") +
      " / " +
      (local.protocol || "?")
    );
  }

  if (remote) {
    lines.push(
      "相手候補: " +
      (remote.candidateType || "?")
    );
  }

  return lines.join("\n");
}

// ==================================================
// SENDER STATS
// ==================================================

async function updateSenderStats() {
  if (mode !== "sender") return [];

  const lines = [];
  const reports = [];

  const track = localStream?.getVideoTracks()[0];

  if (track) {
    const settings = track.getSettings();

    lines.push(
      "【キャプチャ】" +
      "\n解像度: " +
      (settings.width || "?") +
      "×" +
      (settings.height || "?") +
      "\n設定FPS: " +
      (settings.frameRate ?? "?") +
      "\ncontentHint: " +
      track.contentHint
    );
  }

  for (const [id, pc] of senderPeers) {
    if (pc.signalingState === "closed") continue;

    try {
      const stats = await pc.getStats();

      const report =
        getVideoReport(stats, "outbound-rtp");

      if (!report) continue;

      const old = senderHistory.get(id);

      const seconds = old
        ? (report.timestamp - old.timestamp) / 1000
        : 0;

      const mbps = old
        ? rate(
            report.bytesSent,
            old.bytes,
            seconds
          )
        : null;

      const encodedFPS = old
        ? rate(
            report.framesEncoded,
            old.framesEncoded,
            seconds
          )
        : null;

      let encodeMs = null;

      if (
        old &&
        typeof report.totalEncodeTime === "number" &&
        typeof old.totalEncodeTime === "number"
      ) {
        const frames =
          report.framesEncoded - old.framesEncoded;

        if (frames > 0) {
          encodeMs =
            (
              report.totalEncodeTime -
              old.totalEncodeTime
            ) * 1000 / frames;
        }
      }

      senderHistory.set(id, {
        id: report.id,
        timestamp: report.timestamp,
        bytes: report.bytesSent,
        framesEncoded: report.framesEncoded,
        totalEncodeTime: report.totalEncodeTime
      });

      const state = peerQuality.get(id);

      lines.push(
        "\n【送信先 " + id.slice(0, 8) + "】" +
        "\n状態: " + pc.connectionState +
        "\n解像度: " +
        (report.frameWidth || "?") +
        "×" +
        (report.frameHeight || "?") +
        "\nCodec: " + codecName(stats, report) +
        "\nWebRTC FPS: " +
        (report.framesPerSecond ?? "?") +
        "\n実測エンコードFPS: " +
        fmt(encodedFPS) +
        "\n通信速度: " +
        fmt(mbps === null ? null : mbps * 8 / 1e6, 2) +
        " Mbps" +
        "\n平均エンコード時間: " +
        fmt(encodeMs, 2) +
        " ms" +
        "\n品質制限理由: " +
        (report.qualityLimitationReason || "不明") +
        "\n自動画質目標: " +
        (
          state?.height === Infinity
            ? "元画質"
            : (state?.height ?? "?") + "p"
        ) +
        (
          state?.disabled
            ? "（自動調整停止）"
            : ""
        ) +
        "\n" +
        getConnectionInfo(stats)
      );

      reports.push({
        id,
        pc,
        report,
        encodedFPS
      });

    } catch (err) {
      console.warn("Sender stats:", err);
    }
  }

  $("senderStats").textContent =
    lines.join("\n") || "接続端末なし";

  return reports;
}

// ==================================================
// RECEIVER STATS
// ==================================================

async function updateReceiverStats() {
  if (
    mode !== "receiver" ||
    !receiverPeer ||
    receiverPeer.signalingState === "closed"
  ) {
    return;
  }

  try {
    const stats = await receiverPeer.getStats();

    const report =
      getVideoReport(stats, "inbound-rtp");

    if (!report) return;

    const old = receiverHistory;

    const seconds = old
      ? (report.timestamp - old.timestamp) / 1000
      : 0;

    const mbps = old
      ? rate(
          report.bytesReceived,
          old.bytes,
          seconds
        )
      : null;

    const receivedFPS = old
      ? rate(
          report.framesReceived,
          old.framesReceived,
          seconds
        )
      : null;

    const decodedFPS = old
      ? rate(
          report.framesDecoded,
          old.framesDecoded,
          seconds
        )
      : null;

    receiverHistory = {
      timestamp: report.timestamp,
      bytes: report.bytesReceived,
      framesReceived: report.framesReceived,
      framesDecoded: report.framesDecoded
    };

    $("receiverStats").textContent =
      "【実測受信】" +
      "\n状態: " + receiverPeer.connectionState +
      "\n解像度: " +
      (report.frameWidth || video.videoWidth || "?") +
      "×" +
      (report.frameHeight || video.videoHeight || "?") +
      "\nCodec: " + codecName(stats, report) +
      "\nWebRTC FPS: " +
      (report.framesPerSecond ?? "?") +
      "\n実測受信FPS: " +
      fmt(receivedFPS) +
      "\n実測デコードFPS: " +
      fmt(decodedFPS) +
      "\n通信速度: " +
      fmt(
        mbps === null ? null : mbps * 8 / 1e6,
        2
      ) +
      " Mbps" +
      "\n破棄フレーム: " +
      (report.framesDropped ?? "?") +
      "\nパケットロス: " +
      (report.packetsLost ?? "?") +
      "\n" +
      getConnectionInfo(stats);

  } catch (err) {
    console.warn("Receiver stats:", err);
  }
}

// ==================================================
// FPS-BASED ADAPTIVE QUALITY
// ==================================================

function lowerQuality(height) {
  if (height === Infinity) {
    return 1080;
  }

  const lower =
    QUALITY_STEPS.filter(q => q < height);

  return lower.length
    ? lower[lower.length - 1]
    : height;
}

async function adaptiveQuality(reports) {
  if (
    mode !== "sender" ||
    settingsBusy ||
    $("priority").value !== "maintain-framerate"
  ) {
    return;
  }

  const targetFPS = selectedFPS();

  if (!targetFPS || targetFPS <= 15) return;

  const now = Date.now();

  for (const item of reports) {
    const {
      id,
      pc,
      encodedFPS
    } = item;

    const state = peerQuality.get(id);

    if (
      !state ||
      state.disabled ||
      pc.connectionState !== "connected" ||
      encodedFPS === null
    ) {
      continue;
    }

    if (state.pendingTest) {
      const test = state.pendingTest;

      if (now - test.start < 6000) {
        continue;
      }

      const improvement =
        encodedFPS - test.beforeFPS;

      state.pendingTest = null;

      if (improvement < 3) {
        state.height = test.previousHeight;
        state.disabled = true;

        try {
          await configurePeer(id);
        } catch (err) {
          console.warn("Quality rollback:", err);
        }

        console.log(
          "画質を下げてもFPS改善なし。自動調整停止:",
          id
        );
      }

      state.lastChange = now;
      continue;
    }

    if (now - state.lastChange < 10000) {
      continue;
    }

    if (encodedFPS >= targetFPS - 5) {
      continue;
    }

    const next = lowerQuality(state.height);

    if (next === state.height) {
      state.disabled = true;
      continue;
    }

    const previousHeight = state.height;

    state.height = next;
    state.lastChange = now;

    try {
      await configurePeer(id);

      state.pendingTest = {
        previousHeight,
        beforeFPS: encodedFPS,
        start: now
      };

    } catch (err) {
      state.height = previousHeight;
      state.disabled = true;

      console.warn("Adaptive quality:", err);
    }
  }
}

// ==================================================
// TIMER
// ==================================================

setInterval(async () => {
  if (!running || statsBusy) return;

  statsBusy = true;

  try {
    if (mode === "sender") {
      const reports = await updateSenderStats();
      await adaptiveQuality(reports);
    }

    if (mode === "receiver") {
      await updateReceiverStats();
    }

  } catch (err) {
    console.warn("Stats:", err);
  } finally {
    statsBusy = false;
  }
}, 1000);

updateSettingsInfo();
