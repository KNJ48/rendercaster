<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRTC Caster v16</title>

<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101820;color:#fff;font-family:Arial,sans-serif}
h1{color:#43d9ff}
h2{color:#a9eaff;margin-top:0}
.panel{background:#1b2936;padding:20px;border-radius:12px;margin:15px 0}
input,button,select{padding:11px;font-size:15px;border-radius:6px;border:0;margin:5px}
input[type=text]{width:180px}
button{background:#009dff;color:white;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.stop{background:#e54848}
video{display:block;width:100%;max-height:70vh;background:black;border-radius:10px;object-fit:contain}
.stats{background:#08131d;padding:18px;border-radius:8px;white-space:pre-wrap;font-family:monospace;line-height:1.8;overflow-wrap:anywhere}
.status{color:#55ff99;font-weight:bold}
.row{margin:10px 0}
label{display:inline-block;min-width:120px}
small{color:#aaa}
</style>
</head>

<body>

<h1>🚀 WebRTC Caster v16</h1>
<p>ブラウザ標準WebRTC / H.264・VP8比較 / 最大120FPSテスト</p>

<div class="panel">
<h2>接続設定</h2>

<div class="row">
<label>ルームID</label>
<input id="roomId" type="text" value="1234">
</div>

<div class="row">
<label>モード</label>
<select id="role">
<option value="sender">送信側</option>
<option value="receiver">受信側</option>
</select>
</div>

<div class="row">
<label>希望解像度</label>
<select id="resolution">
<option value="1280x720" selected>720p</option>
<option value="1920x1080">1080p</option>
<option value="2560x1440">1440p</option>
<option value="3840x2160">4K</option>
</select>
</div>

<div class="row">
<label>希望FPS</label>
<select id="captureFPS">
<option value="30">30FPS</option>
<option value="60">60FPS</option>
<option value="120" selected>120FPS（実験）</option>
</select>
</div>

<div class="row">
<label>コーデック</label>
<select id="codecMode">
<option value="auto">ブラウザ自動</option>
<option value="h264">H.264優先</option>
<option value="vp8">VP8優先</option>
</select>
</div>

<div class="row">
<label><input type="checkbox" id="shareAudio" checked>音声も共有</label>
</div>

<button id="startButton">開始</button>
<button id="stopButton" class="stop" disabled>停止</button>

<p>状態：<span id="status" class="status">準備完了</span></p>
<small>設定変更は停止後に反映されます。</small>
</div>

<div class="panel">
<h2>映像</h2>
<video id="video" autoplay playsinline muted></video>
<br>
<button id="fullscreenButton">全画面表示</button>
<button id="muteButton">ミュート解除</button>
</div>

<div class="panel">
<h2>📊 詳細FPS統計</h2>
<div id="stats" class="stats">待機中...</div>
</div>

<div class="panel">
<h2>テストについて</h2>
<p>Canvas・Workerを使わず、画面キャプチャをWebRTCへ直接渡します。</p>
<p>FPSやビットレートをsetParameters()で制限しません。</p>
<small>120FPSは希望値であり、実際のFPSを保証するものではありません。</small>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const video = $("video");
const peers = new Map();
const pendingIce = new Map();
const previousStats = new Map();

let ws = null;
let localStream = null;
let receiverPeer = null;

let role = null;
let roomId = null;

let running = false;
let sessionId = 0;
let statsTimer = null;
let statsUpdating = false;

const rtcConfig = {
    iceServers: [
        {urls:"stun:stun.l.google.com:19302"},
        {urls:"stun:stun1.l.google.com:19302"}
    ]
};

// =====================================
// 表示FPS計測
// =====================================

let displayFPS = 0;
let displayCounter = 0;
let displayStart = 0;
let displayToken = 0;

function resetDisplayFPS() {
    displayToken++;
    displayFPS = 0;
    displayCounter = 0;
    displayStart = 0;
}

function startDisplayFPS() {
    resetDisplayFPS();

    if (!video.requestVideoFrameCallback) return;

    const token = displayToken;

    function callback(now) {
        if (!running || token !== displayToken) return;

        displayCounter++;

        if (!displayStart) displayStart = now;

        const elapsed = now - displayStart;

        if (elapsed >= 1000) {
            displayFPS = displayCounter * 1000 / elapsed;
            displayCounter = 0;
            displayStart = now;
        }

        video.requestVideoFrameCallback(callback);
    }

    video.requestVideoFrameCallback(callback);
}

function setStatus(text) {
    $("status").textContent = text;
}

function send(data) {
    if (ws?.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
    }
}

// =====================================
// コーデック優先
// =====================================

function applyCodecPreferences(pc, mode) {
    if (mode === "auto") return;

    const transceiver = pc.getTransceivers().find(t =>
        t.sender.track?.kind === "video" ||
        t.receiver.track?.kind === "video"
    );

    if (!transceiver?.setCodecPreferences) return;

    const caps = RTCRtpSender.getCapabilities?.("video");
    if (!caps?.codecs) return;

    const mime = mode === "h264" ? "video/h264" : "video/vp8";

    const preferred = caps.codecs.filter(c =>
        c.mimeType.toLowerCase() === mime
    );

    if (!preferred.length) {
        console.warn("指定コーデック非対応:", mime);
        return;
    }

    const others = caps.codecs.filter(c =>
        c.mimeType.toLowerCase() !== mime
    );

    try {
        transceiver.setCodecPreferences([...preferred, ...others]);
        console.log("Codec priority:", mime);
    } catch(e) {
        console.warn("Codec preference error:", e);
    }
}

// =====================================
// 開始
// =====================================

$("startButton").addEventListener("click", start);

async function start() {
    if (running) return;

    role = $("role").value;
    roomId = $("roomId").value.trim();

    if (!roomId || roomId.length > 64) {
        alert("ルームIDは1～64文字で入力してください");
        return;
    }

    running = true;
    const token = ++sessionId;

    $("startButton").disabled = true;
    $("stopButton").disabled = false;

    for (const id of [
        "role","roomId","resolution",
        "captureFPS","codecMode","shareAudio"
    ]) {
        $(id).disabled = true;
    }

    try {
        if (role === "sender") {
            setStatus("画面共有を開始中...");

            const [width,height] =
                $("resolution").value.split("x").map(Number);

            const fps = Number($("captureFPS").value);

            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: {
                    width:{ideal:width},
                    height:{ideal:height},
                    frameRate:{ideal:fps}
                },
                audio:$("shareAudio").checked
            });

            if (token !== sessionId) {
                stream.getTracks().forEach(t=>t.stop());
                return;
            }

            localStream = stream;

            const track = stream.getVideoTracks()[0];
            if ("contentHint" in track) track.contentHint = "motion";

            console.log("Capture settings:",track.getSettings());

            track.addEventListener("ended",stop,{once:true});

            video.srcObject = stream;
            video.muted = true;
            video.play().catch(console.warn);

            startDisplayFPS();
        } else {
            video.muted = true;
            resetDisplayFPS();
        }

        setStatus("シグナリングサーバー接続中...");
        await connectWebSocket();

        if (token !== sessionId) return;

        statsTimer = setInterval(updateStats,1000);
        updateStats();

    } catch(err) {
        console.error(err);
        alert("開始失敗: "+err.message);
        stop();
    }
}

// =====================================
// WebSocket
// =====================================

function connectWebSocket() {
    return new Promise((resolve,reject)=>{
        const proto = location.protocol==="https:"?"wss:":"ws:";
        const socket = new WebSocket(`${proto}//${location.host}/signal`);
        ws = socket;

        socket.onopen=()=>{
            if (!running || ws!==socket) {
                socket.close();
                reject(new Error("開始処理中断"));
                return;
            }
            send({type:"join",roomId,role});
            resolve();
        };

        socket.onerror=()=>reject(new Error("WebSocket接続エラー"));

        socket.onclose=()=>{
            if (running && ws===socket) {
                setStatus("サーバー切断");
                stop();
            }
        };

        socket.onmessage=async event=>{
            if (!running || ws!==socket) return;
            try {
                await handleSignal(JSON.parse(event.data));
            } catch(err) {
                console.error("Signal error:",err);
                setStatus("接続処理エラー: "+err.message);
            }
        };
    });
}

// =====================================
// シグナリング
// =====================================

async function handleSignal(data) {
    switch(data.type) {
        case "joined":
            setStatus(role==="sender"?"受信者待機中":"送信者待機中");
            break;

        case "receiver-joined":
            if(role==="sender") await createSenderPeer(data.receiverId);
            break;

        case "receiver-left":
            closeSenderPeer(data.receiverId);
            break;

        case "sender-ready":
            if(role==="receiver") setStatus("送信者を検出");
            break;

        case "sender-left":
            closeReceiverPeer();
            setStatus("送信者が退出しました");
            break;

        case "offer":
            if(role==="receiver") await handleOffer(data);
            break;

        case "answer":
            if(role==="sender") await handleAnswer(data);
            break;

        case "ice":
            await handleIce(data);
            break;

        case "error":
            alert(data.message);
            stop();
            break;
    }
}

// =====================================
// PeerConnection
// =====================================

function createPeerConnection() {
    const pc = new RTCPeerConnection(rtcConfig);

    pc.onconnectionstatechange=()=>{
        if(!running) return;

        console.log("Connection:",pc.connectionState);

        if(pc.connectionState==="connected")
            setStatus("WebRTC接続成功！");

        if(pc.connectionState==="failed")
            setStatus("WebRTC接続失敗");
    };

    return pc;
}

// =====================================
// 送信側
// =====================================

async function createSenderPeer(id) {
    if(!running || !localStream) return;

    closeSenderPeer(id);

    const pc=createPeerConnection();
    peers.set(id,pc);
    pendingIce.set(id,[]);

    pc.onicecandidate=e=>{
        if(e.candidate)
            send({type:"ice",receiverId:id,candidate:e.candidate});
    };

    for(const track of localStream.getTracks()) {
        pc.addTrack(track,localStream);
    }

    applyCodecPreferences(pc,$("codecMode").value);

    const offer=await pc.createOffer();

    if(!running || peers.get(id)!==pc) return;

    await pc.setLocalDescription(offer);

    send({type:"offer",receiverId:id,sdp:pc.localDescription});
    setStatus("受信者と接続中...");
}

async function handleAnswer(data) {
    const pc=peers.get(data.receiverId);

    if(!pc || pc.signalingState!=="have-local-offer") return;

    await pc.setRemoteDescription(data.sdp);
    await flushIce(data.receiverId,pc);
}

function closeSenderPeer(id) {
    const pc=peers.get(id);
    if(pc) pc.close();

    peers.delete(id);
    pendingIce.delete(id);
    previousStats.delete(id);
}

// =====================================
// 受信側
// =====================================

async function handleOffer(data) {
    const earlyIce=pendingIce.get("receiver")||[];

    closeReceiverPeer();

    const pc=createPeerConnection();
    receiverPeer=pc;
    pendingIce.set("receiver",earlyIce);

    pc.onicecandidate=e=>{
        if(e.candidate) send({type:"ice",candidate:e.candidate});
    };

    pc.ontrack=e=>{
        if(e.streams?.[0]) {
            video.srcObject=e.streams[0];
        } else {
            let stream=video.srcObject;
            if(!(stream instanceof MediaStream)) {
                stream=new MediaStream();
                video.srcObject=stream;
            }
            if(!stream.getTracks().includes(e.track))
                stream.addTrack(e.track);
        }

        video.play().catch(console.warn);
        startDisplayFPS();
    };

    await pc.setRemoteDescription(data.sdp);
    await flushIce("receiver",pc);

    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);

    send({type:"answer",sdp:pc.localDescription});
    setStatus("映像受信中...");
}

function closeReceiverPeer() {
    if(receiverPeer) receiverPeer.close();
    receiverPeer=null;

    pendingIce.delete("receiver");
    previousStats.delete("receiver");

    resetDisplayFPS();
    video.srcObject=null;
}

// =====================================
// ICE
// =====================================

async function handleIce(data) {
    if(!data.candidate) return;

    const key=role==="sender"?data.receiverId:"receiver";
    const pc=role==="sender"?peers.get(key):receiverPeer;

    if(!pc) {
        if(role==="receiver") {
            if(!pendingIce.has(key)) pendingIce.set(key,[]);
            pendingIce.get(key).push(data.candidate);
        }
        return;
    }

    if(pc.remoteDescription) {
        try {
            await pc.addIceCandidate(data.candidate);
        } catch(e) {
            console.warn("ICE error:",e);
        }
    } else {
        if(!pendingIce.has(key)) pendingIce.set(key,[]);
        pendingIce.get(key).push(data.candidate);
    }
}

async function flushIce(key,pc) {
    const list=pendingIce.get(key)||[];
    pendingIce.set(key,[]);

    for(const candidate of list) {
        try {
            await pc.addIceCandidate(candidate);
        } catch(e) {
            console.warn("ICE error:",e);
        }
    }
}

// =====================================
// 統計
// =====================================

function rate(current,previous,seconds) {
    if(
        typeof current!=="number" ||
        typeof previous!=="number" ||
        seconds<=0
    ) return null;

    const diff=current-previous;
    return diff>=0?diff/seconds:null;
}

function fmt(value,digits=1) {
    return value===null || !Number.isFinite(value)
        ?"計測中"
        :value.toFixed(digits);
}

async function collectStats(pc,type,key,lines) {
    if(pc.signalingState==="closed") return;

    const report=await pc.getStats();

    for(const stat of report.values()) {
        if(stat.type!==type || stat.kind!=="video") continue;

        const codec=report.get(stat.codecId);
        const previous=previousStats.get(key);

        const seconds=previous && previous.id===stat.id
            ?(stat.timestamp-previous.timestamp)/1000
            :0;

        const bytes=type==="outbound-rtp"
            ?stat.bytesSent:stat.bytesReceived;

        const mbps=previous
            ?rate(bytes,previous.bytes,seconds)
            :null;

        const encoded=previous
            ?rate(stat.framesEncoded,previous.framesEncoded,seconds)
            :null;

        const received=previous
            ?rate(stat.framesReceived,previous.framesReceived,seconds)
            :null;

        const decoded=previous
            ?rate(stat.framesDecoded,previous.framesDecoded,seconds)
            :null;

        let encodeMs=null;
        let decodeMs=null;

        if(previous) {
            const ed=stat.framesEncoded-previous.framesEncoded;
            const dd=stat.framesDecoded-previous.framesDecoded;

            if(ed>0 && typeof stat.totalEncodeTime==="number")
                encodeMs=(stat.totalEncodeTime-previous.totalEncodeTime)*1000/ed;

            if(dd>0 && typeof stat.totalDecodeTime==="number")
                decodeMs=(stat.totalDecodeTime-previous.totalDecodeTime)*1000/dd;
        }

        previousStats.set(key,{
            id:stat.id,
            timestamp:stat.timestamp,
            bytes,
            framesEncoded:stat.framesEncoded,
            framesReceived:stat.framesReceived,
            framesDecoded:stat.framesDecoded,
            totalEncodeTime:stat.totalEncodeTime,
            totalDecodeTime:stat.totalDecodeTime
        });

        lines.push(`解像度: ${stat.frameWidth||"?"}×${stat.frameHeight||"?"}`);
        lines.push(`Codec: ${codec?.mimeType||"不明"}`);
        lines.push(`通信速度: ${fmt(mbps===null?null:mbps*8/1000000,2)} Mbps`);
        lines.push(`WebRTC報告FPS: ${stat.framesPerSecond??"不明"}`);

        if(type==="outbound-rtp") {
            lines.push(`実測エンコードFPS: ${fmt(encoded)}`);
            lines.push(`平均エンコード時間: ${fmt(encodeMs,2)} ms`);
            lines.push(`エンコード累計: ${stat.framesEncoded??"不明"}`);
            lines.push(`品質制限理由: ${stat.qualityLimitationReason||"不明"}`);
        } else {
            lines.push(`実測受信FPS: ${fmt(received)}`);
            lines.push(`実測デコードFPS: ${fmt(decoded)}`);
            lines.push(`平均デコード時間: ${fmt(decodeMs,2)} ms`);
            lines.push(`破棄フレーム: ${stat.framesDropped??"不明"}`);
            lines.push(`パケットロス: ${stat.packetsLost??"不明"}`);
            lines.push(`受信累計: ${stat.framesReceived??"不明"}`);
            lines.push(`デコード累計: ${stat.framesDecoded??"不明"}`);
        }
    }
}

async function updateStats() {
    if(!running || statsUpdating) return;
    statsUpdating=true;

    try {
        const lines=[];

        if(role==="sender") {
            const track=localStream?.getVideoTracks()[0];

            if(track) {
                const settings=track.getSettings();

                lines.push("========== キャプチャ ==========");
                lines.push(`解像度: ${settings.width||"?"}×${settings.height||"?"}`);
                lines.push(`希望FPS: ${$("captureFPS").value}`);
                lines.push(`キャプチャ設定FPS: ${settings.frameRate??"不明"}`);
                lines.push(`プレビュー実測FPS: ${fmt(displayFPS)}`);
                lines.push(`contentHint: ${track.contentHint}`);
                lines.push("");
            }

            lines.push("========== WebRTC送信 ==========");
            lines.push(`受信者数: ${peers.size}`);

            for(const [id,pc] of peers) {
                lines.push("");
                lines.push(`送信先: ${id.slice(0,8)}`);
                lines.push(`状態: ${pc.connectionState}`);

                await collectStats(pc,"outbound-rtp",id,lines);
            }

        } else {
            lines.push("========== WebRTC受信 ==========");

            if(receiverPeer) {
                lines.push(`状態: ${receiverPeer.connectionState}`);

                await collectStats(
                    receiverPeer,"inbound-rtp","receiver",lines
                );

                lines.push("");
                lines.push("========== 映像表示 ==========");
                lines.push(`表示実測FPS: ${fmt(displayFPS)}`);

            } else {
                lines.push("送信者を待機中...");
            }
        }

        if(running) $("stats").textContent=lines.join("\n");

    } catch(e) {
        console.warn("Stats error:",e);
    } finally {
        statsUpdating=false;
    }
}

// =====================================
// 全画面・音声
// =====================================

$("fullscreenButton").addEventListener("click",async()=>{
    try {
        if(!document.fullscreenElement)
            await video.requestFullscreen();
        else
            await document.exitFullscreen();
    } catch(e) {
        console.error(e);
    }
});

$("muteButton").addEventListener("click",()=>{
    if(role==="sender" && running) return;

    video.muted=!video.muted;

    $("muteButton").textContent=
        video.muted?"ミュート解除":"ミュート";
});

// =====================================
// 停止
// =====================================

$("stopButton").addEventListener("click",stop);

function stop() {
    ++sessionId;
    running=false;

    if(statsTimer) clearInterval(statsTimer);
    statsTimer=null;

    for(const id of [...peers.keys()])
        closeSenderPeer(id);

    closeReceiverPeer();

    if(localStream) {
        localStream.getTracks().forEach(t=>t.stop());
        localStream=null;
    }

    if(ws) {
        if(ws.readyState===WebSocket.OPEN)
            send({type:"leave"});

        ws.close();
        ws=null;
    }

    pendingIce.clear();
    previousStats.clear();
    resetDisplayFPS();

    video.srcObject=null;
    video.muted=true;

    $("muteButton").textContent="ミュート解除";

    $("startButton").disabled=false;
    $("stopButton").disabled=true;

    for(const id of [
        "role","roomId","resolution",
        "captureFPS","codecMode","shareAudio"
    ]) {
        $(id).disabled=false;
    }

    $("stats").textContent="停止しました";
    setStatus("停止しました");
}
</script>
</body>
</html>
