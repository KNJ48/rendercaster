<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebRTC Caster v11</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #101114;
  color: #eee;
  font-family: system-ui, sans-serif;
}

main {
  max-width: 900px;
  margin: auto;
}

section {
  background: #1b1d22;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
  margin: 16px 0;
}

input, select, button {
  font: inherit;
  padding: 11px;
  border-radius: 8px;
}

input, select {
  background: #292c33;
  color: white;
  border: 1px solid #555;
  width: 100%;
}

select {
  margin: 8px 0 16px;
}

button {
  border: 0;
  background: #2868d8;
  color: white;
  cursor: pointer;
  margin: 4px;
}

button:hover {
  filter: brightness(1.15);
}

#sendButton { background: #16834b; }
#stopButton { background: #b83232; }
#fullscreen { background: #7544c7; }

#status, .info {
  white-space: pre-wrap;
  background: #20232a;
  border-radius: 8px;
  padding: 14px;
  margin-top: 12px;
  font-family: monospace;
  line-height: 1.6;
}

#status { color: #90d8ff; }

video {
  width: 100%;
  max-height: 75vh;
  background: black;
  object-fit: contain;
  margin-top: 15px;
}

video:fullscreen {
  width: 100vw;
  height: 100vh;
  max-height: none;
  margin: 0;
}
</style>
</head>

<body>
<main>

<h1>WebRTC Caster v11</h1>
<p>Background Worker Experiment</p>

<div id="status">準備完了</div>

<section>
  <h2>ルーム</h2>
  <input id="room" value="1111">
</section>

<section>
  <h2>送信</h2>

  <select id="mode">
    <option value="standard">標準WebRTC</option>
    <option value="worker" selected>
      Worker映像処理（実験）
    </option>
  </select>

  <select id="quality">
    <option value="360">360p</option>
    <option value="480">480p</option>
    <option value="720" selected>720p</option>
    <option value="1080">1080p</option>
  </select>

  <button id="sendButton">🖥 画面を送信</button>
  <button id="stopButton">■ 停止</button>

  <div id="senderInfo" class="info">未送信</div>
  <div id="senderStats" class="info">送信統計：未接続</div>
</section>

<section>
  <h2>受信</h2>

  <button id="receiveButton">📺 画面を受信</button>
  <button id="fullscreen">⛶ 全画面</button>
  <button id="muteButton">🔊 音声ON</button>

  <video id="video" autoplay playsinline></video>

  <div id="receiverStats" class="info">未接続</div>
</section>

</main>

<script>

const $ = id => document.getElementById(id);

let socket = null;
let role = null;

let sourceStream = null;
let sendStream = null;
let worker = null;

let receiverPeer = null;

const senderPeers = new Map();
const senderICE = new Map();

let receiverICE = [];

const video = $("video");

function status(text) {
  $("status").textContent = text;
  console.log(text);
}

function getRoom() {
  const value = $("room").value.trim();

  if (!/^[A-Za-z0-9_-]{1,32}$/.test(value)) {
    throw new Error("ルームIDが不正です");
  }

  return value;
}

function signal(data) {
  if (socket?.readyState !== WebSocket.OPEN) {
    throw new Error("WebSocket未接続");
  }

  socket.send(JSON.stringify(data));
}

function createPeer() {
  return new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ]
  });
}

// ================================================
// WORKER
// ================================================

function createWorkerStream(source) {
  return new Promise((resolve, reject) => {
    const sourceTrack = source.getVideoTracks()[0];
    const height = Number($("quality").value);
    const width = Math.round(height * 16 / 9);

    worker = new Worker("/video-worker.js");

    const timeout = setTimeout(() => {
      reject(new Error("Worker起動タイムアウト"));
    }, 10000);

    worker.onmessage = event => {
      const msg = event.data;

      if (msg.type === "ready") {
        clearTimeout(timeout);

        const stream = new MediaStream([msg.track]);

        for (const track of source.getAudioTracks()) {
          stream.addTrack(track);
        }

        resolve(stream);
      }

      if (msg.type === "stats") {
        $("senderInfo").textContent =
          "Worker処理FPS: " + msg.fps;
      }

      if (msg.type === "error") {
        clearTimeout(timeout);
        reject(new Error(msg.message));
      }
    };

    worker.onerror = error => {
      clearTimeout(timeout);
      reject(new Error(error.message));
    };

    worker.postMessage({
      type: "start",
      track: sourceTrack,
      width,
      height
    }, [sourceTrack]);
  });
}

// ================================================
// WEBSOCKET
// ================================================

function connectSocket() {
  return new Promise((resolve, reject) => {
    const protocol =
      location.protocol === "https:" ? "wss:" : "ws:";

    socket = new WebSocket(
      protocol + "//" + location.host + "/signal"
    );

    socket.onopen = resolve;

    socket.onerror = () => {
      reject(new Error("WebSocket接続失敗"));
    };

    socket.onmessage = async event => {
      try {
        await handleSignal(JSON.parse(event.data));
      } catch (error) {
        console.error(error);
        status("通信エラー: " + error.message);
      }
    };
  });
}

// ================================================
// SENDER PEER
// ================================================

async function createSenderPeer(id) {
  if (senderPeers.has(id) || !sendStream) return;

  const pc = createPeer();
  senderPeers.set(id, pc);

  pc.onicecandidate = event => {
    if (event.candidate) {
      signal({
        type: "ice",
        receiverId: id,
        candidate: event.candidate
      });
    }
  };

  for (const track of sendStream.getTracks()) {
    pc.addTrack(track, sendStream);
  }

  const offer = await pc.createOffer();

  await pc.setLocalDescription(offer);

  signal({
    type: "offer",
    receiverId: id,
    sdp: pc.localDescription
  });
}

// ================================================
// SIGNALING
// ================================================

async function handleSignal(msg) {

  if (msg.type === "error") {
    status("サーバーエラー: " + msg.message);
    return;
  }

  if (msg.type === "sender-ready") {
    status("送信準備完了。受信者を待っています");
    return;
  }

  if (msg.type === "receiver-ready") {
    status("受信準備完了。接続待機中");
    return;
  }

  if (msg.type === "receiver-joined" && role === "sender") {
    await createSenderPeer(msg.receiverId);
    return;
  }

  if (msg.type === "receiver-left") {
    senderPeers.get(msg.receiverId)?.close();
    senderPeers.delete(msg.receiverId);
    senderICE.delete(msg.receiverId);
    return;
  }

  if (msg.type === "sender-left") {
    receiverPeer?.close();
    receiverPeer = null;
    video.srcObject = null;
    status("送信者が退出しました");
    return;
  }

  if (msg.type === "answer" && role === "sender") {
    const pc = senderPeers.get(msg.receiverId);
    if (!pc) return;

    await pc.setRemoteDescription(msg.sdp);

    for (const ice of senderICE.get(msg.receiverId) || []) {
      await pc.addIceCandidate(ice);
    }

    senderICE.delete(msg.receiverId);
    return;
  }

  if (msg.type === "offer" && role === "receiver") {
    receiverPeer?.close();

    const pc = createPeer();
    receiverPeer = pc;

    pc.ontrack = event => {
      video.srcObject = event.streams[0];
      video.play().catch(console.warn);
    };

    pc.onicecandidate = event => {
      if (event.candidate) {
        signal({
          type: "ice",
          candidate: event.candidate
        });
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "connected") {
        status("接続成功！ 映像受信中");
      }
    };

    await pc.setRemoteDescription(msg.sdp);

    for (const ice of receiverICE) {
      await pc.addIceCandidate(ice);
    }

    receiverICE = [];

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    signal({
      type: "answer",
      sdp: pc.localDescription
    });

    return;
  }

  if (msg.type === "ice") {
    if (role === "sender") {
      const pc = senderPeers.get(msg.receiverId);
      if (!pc) return;

      if (pc.remoteDescription) {
        await pc.addIceCandidate(msg.candidate);
      } else {
        if (!senderICE.has(msg.receiverId)) {
          senderICE.set(msg.receiverId, []);
        }

        senderICE.get(msg.receiverId).push(msg.candidate);
      }
    } else {
      if (receiverPeer?.remoteDescription) {
        await receiverPeer.addIceCandidate(msg.candidate);
      } else {
        receiverICE.push(msg.candidate);
      }
    }
  }
}

// ================================================
// BUTTONS
// ================================================

$("sendButton").onclick = async () => {
  try {
    if (role) return;

    const room = getRoom();

    status("画面を選択してください");

    sourceStream =
      await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: true
      });

    if ($("mode").value === "worker") {
      status("Workerを起動しています...");

      sendStream = await createWorkerStream(sourceStream);
    } else {
      sendStream = sourceStream;
    }

    role = "sender";

    sourceStream.getVideoTracks()[0].onended = stop;

    await connectSocket();

    signal({
      type: "sender-join",
      room
    });

  } catch (error) {
    status("送信エラー: " + error.message);
    stop(false);
  }
};

$("receiveButton").onclick = async () => {
  try {
    if (role) return;

    role = "receiver";

    const room = getRoom();

    await connectSocket();

    signal({
      type: "receiver-join",
      room
    });

  } catch (error) {
    status("受信エラー: " + error.message);
    stop(false);
  }
};

function stop(show = true) {
  for (const pc of senderPeers.values()) {
    pc.close();
  }

  senderPeers.clear();
  senderICE.clear();

  receiverPeer?.close();
  receiverPeer = null;
  receiverICE = [];

  socket?.close();
  socket = null;

  worker?.postMessage({ type: "stop" });
  worker?.terminate();
  worker = null;

  sendStream?.getVideoTracks().forEach(t => t.stop());
  sourceStream?.getTracks().forEach(t => t.stop());

  sendStream = null;
  sourceStream = null;
  role = null;

  video.srcObject = null;

  if (show) status("停止しました");
}

$("stopButton").onclick = () => stop();

$("fullscreen").onclick = async () => {
  if (!video.srcObject) return;

  if (video.requestFullscreen) {
    await video.requestFullscreen();
  } else if (video.webkitEnterFullscreen) {
    video.webkitEnterFullscreen();
  }
};

$("muteButton").onclick = () => {
  video.muted = !video.muted;

  $("muteButton").textContent =
    video.muted ? "🔇 ミュート中" : "🔊 音声ON";
};

// ================================================
// STATS
// ================================================

let lastSender = new Map();
let lastReceiver = null;
let statsBusy = false;

async function getVideoStats(pc, type) {
  const stats = await pc.getStats();

  for (const report of stats.values()) {
    if (
      report.type === type &&
      report.kind === "video"
    ) {
      return { report, stats };
    }
  }

  return null;
}

function getBitrate(report, old, direction) {
  const bytes = direction === "send"
    ? report.bytesSent
    : report.bytesReceived;

  if (!old) return null;

  const seconds = (report.timestamp - old.time) / 1000;

  if (seconds <= 0) return null;

  return (bytes - old.bytes) * 8 / seconds / 1e6;
}

setInterval(async () => {
  if (statsBusy) return;
  statsBusy = true;

  try {
    const lines = [];

    for (const [id, pc] of senderPeers) {
      if (pc.signalingState === "closed") continue;

      const result = await getVideoStats(pc, "outbound-rtp");

      if (!result) continue;

      const { report, stats } = result;

      const old = lastSender.get(id);
      const mbps = getBitrate(report, old, "send");

      lastSender.set(id, {
        bytes: report.bytesSent,
        time: report.timestamp
      });

      const codec = stats.get(report.codecId);

      lines.push(
        "解像度: " + report.frameWidth +
        "×" + report.frameHeight +
        "\nFPS: " + report.framesPerSecond +
        "\n速度: " +
        (mbps === null ? "計測中" : mbps.toFixed(2) + "Mbps") +
        "\nCodec: " + (codec?.mimeType || "?")
      );
    }

    $("senderStats").textContent =
      lines.join("\n\n") || "未接続";

    if (receiverPeer?.signalingState !== "closed" && receiverPeer) {
      const result =
        await getVideoStats(receiverPeer, "inbound-rtp");

      if (result) {
        const { report, stats } = result;

        const mbps = getBitrate(
          report,
          lastReceiver,
          "receive"
        );

        lastReceiver = {
          bytes: report.bytesReceived,
          time: report.timestamp
        };

        const codec = stats.get(report.codecId);

        $("receiverStats").textContent =
          "解像度: " + report.frameWidth +
          "×" + report.frameHeight +
          "\nFPS: " + report.framesPerSecond +
          "\n速度: " +
          (mbps === null ? "計測中" : mbps.toFixed(2) + "Mbps") +
          "\nCodec: " + (codec?.mimeType || "?");
      }
    }

  } catch (error) {
    console.warn(error);
  } finally {
    statsBusy = false;
  }
}, 1000);

</script>
</body>
</html>
