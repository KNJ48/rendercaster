<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WebRTC Caster v20</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #101114;
  color: #eee;
  font-family: system-ui, sans-serif;
}

main {
  max-width: 900px;
  margin: auto;
}

h1 {
  margin-bottom: 5px;
}

h2 {
  margin-top: 0;
}

section {
  background: #1b1d22;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
  margin: 16px 0;
}

input, select, button {
  font: inherit;
  padding: 11px;
  border-radius: 8px;
}

input, select {
  background: #292c33;
  color: white;
  border: 1px solid #555;
}

input[type="text"], select {
  width: 100%;
}

select {
  margin: 8px 0 16px;
}

button {
  border: 0;
  background: #2868d8;
  color: white;
  cursor: pointer;
  margin: 4px;
}

button:hover {
  filter: brightness(1.15);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#sendButton {
  background: #16834b;
}

#stopButton {
  background: #b83232;
}

#fullscreen {
  background: #7544c7;
}

#status, .info {
  white-space: pre-wrap;
  background: #20232a;
  border-radius: 8px;
  padding: 14px;
  margin-top: 12px;
  font-family: monospace;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

#status {
  color: #90d8ff;
}

.info {
  color: #ccc;
  font-size: 13px;
}

label {
  display: block;
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0;
}

.checkbox input {
  width: 18px;
  height: 18px;
}

video {
  width: 100%;
  max-height: 75vh;
  background: black;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 8px;
}

video:fullscreen {
  width: 100vw;
  height: 100vh;
  max-height: none;
  margin: 0;
  border-radius: 0;
  object-fit: contain;
}

small {
  color: #aaa;
}

.hidden {
  display: none !important;
}

.notice {
  color: #e9c87a;
  font-size: 13px;
  margin-top: 12px;
}

#previewVideo {
  max-height: 300px;
}

@media(max-width:600px) {
  body {
    padding: 10px;
  }

  section {
    padding: 15px;
  }
}
</style>
</head>

<body>

<main>

<h1>WebRTC Caster v20</h1>

<small>
Stable Connection & Auto Recovery Edition
</small>

<div id="status">準備完了</div>

<section>
  <h2>ルーム</h2>

  <input
    id="room"
    type="text"
    value="1111"
    maxlength="32"
  >
</section>

<section>
  <h2>画面を送信</h2>

  <button id="sendButton">
    🖥 画面を送信
  </button>

  <button id="stopButton">
    ■ 停止
  </button>

  <div id="senderInfo" class="info">
    未送信
  </div>

  <video
    id="previewVideo"
    autoplay
    playsinline
    muted
    class="hidden"
  ></video>
</section>

<section>
  <h2>配信設定</h2>

  <label>最大画質</label>

  <select id="quality">
    <option value="360">360p</option>
    <option value="480">480p</option>
    <option value="720" selected>720p</option>
    <option value="1080">1080p</option>
    <option value="native">元画質</option>
  </select>

  <label>FPS</label>

  <select id="fpsMode">
    <option value="auto">ブラウザ自動</option>
    <option value="15">15 FPS</option>
    <option value="30" selected>30 FPS</option>
    <option value="60">60 FPS</option>
    <option value="120">120 FPS（実験）</option>
    <option value="browser">制限なし</option>
  </select>

  <label>品質優先度</label>

  <select id="priority">
    <option value="maintain-resolution" selected>
      解像度優先
    </option>
    <option value="maintain-framerate">
      FPS優先
    </option>
    <option value="balanced">
      バランス
    </option>
  </select>

  <label>コーデック</label>

  <select id="codecMode">
    <option value="auto">ブラウザ自動</option>
    <option value="h264" selected>H.264優先</option>
    <option value="vp8">VP8優先</option>
  </select>

  <label>映像の種類</label>

  <select id="contentHint">
    <option value="motion" selected>
      動き優先
    </option>
    <option value="text">
      文字優先
    </option>
    <option value="detail">
      細部優先
    </option>
  </select>

  <label>ビットレート</label>

  <select id="bitrateMode">
    <option value="auto">ブラウザ自動</option>
    <option value="20000000" selected>
      最大20Mbps
    </option>
  </select>

  <label class="checkbox">
    <input
      type="checkbox"
      id="shareAudio"
      checked
    >
    音声を共有
  </label>

  <label class="checkbox">
    <input
      type="checkbox"
      id="showPreview"
    >
    送信側プレビューを表示
  </label>

  <button id="applySettings">
    🔄 設定を適用・再接続
  </button>

  <div id="settingsInfo" class="info">
    設定待機中
  </div>

  <p class="notice">
    設定変更時は受信側が自動再接続します。
    音声共有設定の変更は次回の画面共有開始時に反映されます。
  </p>
</section>

<section>
  <h2>送信統計</h2>

  <div id="senderStats" class="info">
    接続端末なし
  </div>
</section>

<section>
  <h2>画面を受信</h2>

  <button id="receiveButton">
    📺 画面を受信
  </button>

  <button id="fullscreen">
    ⛶ 全画面
  </button>

  <button id="muteButton">
    🔇 ミュート中
  </button>

  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>

  <div id="receiverStats" class="info">
    未接続
  </div>
</section>

<section>
  <h2>接続監視</h2>

  <div id="healthInfo" class="info">
    監視待機中
  </div>

  <small>
    接続失敗や長時間の切断を検出した場合、
    WebRTC接続の自動復旧を試みます。
    静止画によるフレーム停止だけでは再接続しません。
  </small>
</section>

</main>

<script>
"use strict";

// ==================================================
// STATE
// ==================================================

const $ = id => document.getElementById(id);

const video = $("video");
const previewVideo = $("previewVideo");

const peers = new Map();
const senderHistory = new Map();

const pendingSenderICE = new Map();
const pendingReceiverICE = new Map();

let receiverPeer = null;
let receiverGeneration = null;
let receiverHistory = null;

let socket = null;
let localStream = null;

let mode = null;
let running = false;

let sessionId = 0;
let generationCounter = 0;

let appliedSettings = null;
let applying = false;
let statsBusy = false;

let receiverDisconnectedSince = 0;
let receiverLastRestart = 0;
let receiverConnectedAt = 0;

const MAX_BITRATE = 20_000_000;

const DISCONNECT_TIMEOUT = 8000;
const RESTART_COOLDOWN = 15000;

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ]
};

// ==================================================
// BASIC
// ==================================================

function status(text) {
  console.log(text);
  $("status").textContent = text;
}

function signal(data) {
  if (socket?.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify(data));
    return true;
  }

  return false;
}

function room() {
  const value = $("room").value.trim();

  if (!/^[A-Za-z0-9_-]{1,32}$/.test(value)) {
    throw new Error("ルームIDが無効です");
  }

  return value;
}

function fmt(value, digits = 1) {
  return typeof value === "number" &&
    Number.isFinite(value)
      ? value.toFixed(digits)
      : "計測中";
}

function rate(current, previous, seconds) {
  if (
    typeof current !== "number" ||
    typeof previous !== "number" ||
    seconds <= 0
  ) {
    return null;
  }

  const diff = current - previous;
  return diff >= 0 ? diff / seconds : null;
}

function createPeer() {
  return new RTCPeerConnection(rtcConfig);
}

// ==================================================
// SETTINGS
// ==================================================

function getSettings() {
  return {
    quality: $("quality").value,
    fps: $("fpsMode").value,
    priority: $("priority").value,
    codec: $("codecMode").value,
    hint: $("contentHint").value,
    bitrate: $("bitrateMode").value,
    audio: $("shareAudio").checked
  };
}

function captureFPS(settings) {
  if (
    settings.fps === "auto" ||
    settings.fps === "browser"
  ) {
    return 60;
  }

  return Number(settings.fps);
}

function maxHeight(settings) {
  return settings.quality === "native"
    ? Infinity
    : Number(settings.quality);
}

function updateSettingsInfo() {
  const s = getSettings();

  $("settingsInfo").textContent =
    "画質: " + s.quality +
    "\nFPS: " + s.fps +
    "\n優先度: " + s.priority +
    "\nCodec: " + s.codec +
    "\n映像ヒント: " + s.hint +
    "\n帯域: " +
    (s.bitrate === "auto"
      ? "自動"
      : "最大20Mbps");
}

// ==================================================
// CODEC
// ==================================================

function applyCodec(pc, mode) {
  if (mode === "auto") return;

  const transceiver =
    pc.getTransceivers().find(t =>
      t.sender.track?.kind === "video"
    );

  if (!transceiver?.setCodecPreferences) return;

  const caps =
    RTCRtpSender.getCapabilities?.("video");

  if (!caps?.codecs) return;

  const mime =
    mode === "h264"
      ? "video/h264"
      : "video/vp8";

  const preferred = caps.codecs.filter(c =>
    c.mimeType.toLowerCase() === mime
  );

  if (!preferred.length) return;

  const others = caps.codecs.filter(c =>
    c.mimeType.toLowerCase() !== mime
  );

  transceiver.setCodecPreferences([
    ...preferred,
    ...others
  ]);
}

// ==================================================
// VIDEO PARAMETERS
// ==================================================

async function configureSender(sender, settings) {
  if (sender.track?.kind !== "video") return;

  const source = sender.track.getSettings();

  const width = source.width || 1280;
  const height = source.height || 720;

  const target = maxHeight(settings);

  let scale = 1;

  if (Number.isFinite(target)) {
    scale = Math.max(
      1,
      height / target,
      width / (target * 16 / 9)
    );
  }

  const params = sender.getParameters();

  if (!params.encodings?.length) {
    params.encodings = [{}];
  }

  const encoding = params.encodings[0];

  encoding.scaleResolutionDownBy = scale;

  if (settings.bitrate === "auto") {
    delete encoding.maxBitrate;
  } else {
    encoding.maxBitrate = MAX_BITRATE;
  }

  if (
    settings.fps === "auto" ||
    settings.fps === "browser"
  ) {
    delete encoding.maxFramerate;
  } else {
    encoding.maxFramerate = Number(settings.fps);
  }

  params.degradationPreference =
    settings.priority;

  await sender.setParameters(params);
}

// ==================================================
// CAPTURE CONSTRAINTS
// ==================================================

async function updateCapture(settings) {
  const track = localStream?.getVideoTracks()[0];

  if (!track) return;

  track.contentHint = settings.hint;

  const constraints = {
    frameRate: {
      ideal: captureFPS(settings)
    }
  };

  const height = maxHeight(settings);

  if (Number.isFinite(height)) {
    constraints.width = {
      ideal: Math.round(height * 16 / 9)
    };

    constraints.height = {
      ideal: height
    };
  }

  try {
    await track.applyConstraints(constraints);
  } catch (err) {
    console.warn("Capture constraints:", err);
    status(
      "キャプチャ設定の一部を変更できませんでした。\n" +
      "現在のキャプチャを維持して再接続します。"
    );
  }
}

// ==================================================
// PREVIEW
// ==================================================

function updatePreview() {
  const show =
    running &&
    mode === "sender" &&
    $("showPreview").checked &&
    !!localStream;

  if (show) {
    previewVideo.classList.remove("hidden");
    previewVideo.srcObject = localStream;
    previewVideo.play().catch(console.warn);
  } else {
    previewVideo.pause();
    previewVideo.srcObject = null;
    previewVideo.classList.add("hidden");
  }
}

$("showPreview").addEventListener(
  "change",
  updatePreview
);

// ==================================================
// WEBSOCKET
// ==================================================

function connectSocket() {
  return new Promise((resolve, reject) => {
    const protocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    const ws = new WebSocket(
      `${protocol}//${location.host}/signal`
    );

    socket = ws;
    let settled = false;

    ws.onopen = () => {
      if (!running || socket !== ws) {
        ws.close();

        if (!settled) {
          settled = true;
          reject(new Error("接続中断"));
        }
        return;
      }

      settled = true;
      resolve();
    };

    ws.onerror = () => {
      if (!settled) {
        settled = true;
        reject(new Error("WebSocket接続失敗"));
      }
    };

    ws.onclose = () => {
      if (!settled) {
        settled = true;
        reject(new Error("WebSocket接続終了"));
      }

      if (socket === ws && running) {
        stop(false);
        status("サーバーとの接続が切れました");
      }
    };

    let queue = Promise.resolve();

    ws.onmessage = event => {
      queue = queue.then(async () => {
        if (!running || socket !== ws) return;

        await handleSignal(JSON.parse(event.data));
      }).catch(err => {
        console.error("Signal:", err);

        if (running && socket === ws) {
          status("通信処理エラー: " + err.message);
        }
      });
    };
  });
}

// ==================================================
// SENDER PEER
// ==================================================

function updateSenderInfo() {
  let connected = 0;

  for (const entry of peers.values()) {
    if (entry.pc.connectionState === "connected") {
      connected++;
    }
  }

  $("senderInfo").textContent =
    mode === "sender"
      ? "接続中: " + connected + "台" +
        "\nPeer数: " + peers.size +
        "\n音声: " +
        (localStream?.getAudioTracks().length
          ? "あり"
          : "なし")
      : "未送信";
}

function closeSenderPeer(id) {
  const entry = peers.get(id);

  if (entry) {
    entry.pc.close();
  }

  peers.delete(id);
  pendingSenderICE.delete(id);
  senderHistory.delete(id);

  updateSenderInfo();
}

async function createSenderPeer(id) {
  if (!running || mode !== "sender" || !localStream) {
    return;
  }

  closeSenderPeer(id);

  const pc = createPeer();
  const generation = ++generationCounter;

  const entry = {
    pc,
    generation,
    disconnectedSince: 0,
    lastRestart: Date.now()
  };

  peers.set(id, entry);
  pendingSenderICE.set(id, []);

  pc.onicecandidate = event => {
    if (
      event.candidate &&
      peers.get(id) === entry
    ) {
      signal({
        type: "ice",
        receiverId: id,
        generation,
        candidate: event.candidate
      });
    }
  };

  pc.onconnectionstatechange = () => {
    if (peers.get(id) !== entry) return;

    if (pc.connectionState === "connected") {
      entry.disconnectedSince = 0;
    }

    updateSenderInfo();
  };

  try {
    for (const track of localStream.getTracks()) {
      const sender = pc.addTrack(track, localStream);

      if (track.kind === "video") {
        try {
          await configureSender(
            sender,
            appliedSettings
          );
        } catch (err) {
          console.warn("Sender settings:", err);
        }
      }
    }

    if (!running || peers.get(id) !== entry) return;

    applyCodec(pc, appliedSettings.codec);

    const offer = await pc.createOffer();

    if (!running || peers.get(id) !== entry) return;

    await pc.setLocalDescription(offer);

    if (!running || peers.get(id) !== entry) return;

    signal({
      type: "offer",
      receiverId: id,
      generation,
      sdp: pc.localDescription
    });

  } catch (err) {
    if (peers.get(id) === entry) {
      closeSenderPeer(id);
    }

    throw err;
  }
}

// ==================================================
// RECEIVER PEER
// ==================================================

function closeReceiverPeer(clearPending = true) {
  receiverPeer?.close();

  receiverPeer = null;
  receiverGeneration = null;
  receiverHistory = null;

  receiverDisconnectedSince = 0;
  receiverConnectedAt = 0;

  if (clearPending) {
    pendingReceiverICE.clear();
  }

  video.pause();
  video.srcObject = null;
}

async function handleOffer(msg) {
  const generation = msg.generation;

  if (generation === undefined || generation === null) {
    return;
  }

  status("WebRTC接続中...");

  closeReceiverPeer(false);

  const pc = createPeer();

  receiverPeer = pc;
  receiverGeneration = generation;

  // 古い世代のICEを削除
  for (const key of pendingReceiverICE.keys()) {
    if (key !== generation) {
      pendingReceiverICE.delete(key);
    }
  }

  pc.onicecandidate = event => {
    if (
      event.candidate &&
      receiverPeer === pc
    ) {
      signal({
        type: "ice",
        generation,
        candidate: event.candidate
      });
    }
  };

  pc.ontrack = event => {
    if (receiverPeer !== pc) return;

    if (event.streams?.[0]) {
      video.srcObject = event.streams[0];
    } else {
      let stream = video.srcObject;

      if (!(stream instanceof MediaStream)) {
        stream = new MediaStream();
        video.srcObject = stream;
      }

      if (!stream.getTracks().includes(event.track)) {
        stream.addTrack(event.track);
      }
    }

    video.play().catch(console.warn);
  };

  pc.onconnectionstatechange = () => {
    if (receiverPeer !== pc) return;

    if (pc.connectionState === "connected") {
      receiverDisconnectedSince = 0;
      receiverConnectedAt = Date.now();

      status("接続成功！ 映像受信中");
    }

    if (pc.connectionState === "failed") {
      status("接続異常を検出しました");
    }
  };

  await pc.setRemoteDescription(msg.sdp);

  if (receiverPeer !== pc) return;

  const candidates =
    pendingReceiverICE.get(generation) || [];

  pendingReceiverICE.delete(generation);

  for (const candidate of candidates) {
    try {
      await pc.addIceCandidate(candidate);
    } catch (err) {
      console.warn("ICE:", err);
    }
  }

  const answer = await pc.createAnswer();

  await pc.setLocalDescription(answer);

  if (receiverPeer !== pc) return;

  signal({
    type: "answer",
    generation,
    sdp: pc.localDescription
  });
}

// ==================================================
// ICE
// ==================================================

async function handleICE(msg) {
  if (!msg.candidate) return;

  if (mode === "sender") {
    const id = msg.receiverId;
    const entry = peers.get(id);

    if (!entry) return;

    if (msg.generation !== entry.generation) {
      return;
    }

    const pc = entry.pc;

    if (pc.remoteDescription) {
      try {
        await pc.addIceCandidate(msg.candidate);
      } catch (err) {
        console.warn("ICE:", err);
      }
    } else {
      pendingSenderICE.get(id)?.push(msg.candidate);
    }

  } else if (mode === "receiver") {
    const generation = msg.generation;

    if (
      receiverPeer &&
      generation === receiverGeneration
    ) {
      if (receiverPeer.remoteDescription) {
        try {
          await receiverPeer.addIceCandidate(
            msg.candidate
          );
        } catch (err) {
          console.warn("ICE:", err);
        }
      } else {
        if (!pendingReceiverICE.has(generation)) {
          pendingReceiverICE.set(generation, []);
        }

        pendingReceiverICE.get(generation).push(
          msg.candidate
        );
      }
    } else if (receiverGeneration === null) {
      if (!pendingReceiverICE.has(generation)) {
        pendingReceiverICE.set(generation, []);
      }

      pendingReceiverICE.get(generation).push(
        msg.candidate
      );
    }
  }
}

async function handleAnswer(msg) {
  const entry = peers.get(msg.receiverId);

  if (!entry) return;

  if (msg.generation !== entry.generation) {
    return;
  }

  const pc = entry.pc;

  if (pc.signalingState !== "have-local-offer") {
    return;
  }

  await pc.setRemoteDescription(msg.sdp);

  const candidates =
    pendingSenderICE.get(msg.receiverId) || [];

  pendingSenderICE.set(msg.receiverId, []);

  for (const candidate of candidates) {
    try {
      await pc.addIceCandidate(candidate);
    } catch (err) {
      console.warn("ICE:", err);
    }
  }
}

// ==================================================
// SIGNAL
// ==================================================

async function handleSignal(msg) {
  switch (msg.type) {
    case "joined":
      status(
        mode === "sender"
          ? "送信準備完了。受信者待機中"
          : "受信準備完了。送信者待機中"
      );
      break;

    case "sender-ready":
      if (mode === "receiver") {
        status("送信者を検出しました");
      }
      break;

    case "receiver-joined":
      if (mode === "sender") {
        await createSenderPeer(msg.receiverId);
      }
      break;

    case "receiver-left":
      if (mode === "sender") {
        closeSenderPeer(msg.receiverId);
      }
      break;

    case "sender-left":
      if (mode === "receiver") {
        closeReceiverPeer();
        status("送信者が退出しました");
      }
      break;

    case "offer":
      if (mode === "receiver") {
        await handleOffer(msg);
      }
      break;

    case "answer":
      if (mode === "sender") {
        await handleAnswer(msg);
      }
      break;

    case "ice":
      await handleICE(msg);
      break;

    case "restart-request":
      if (mode === "sender") {
        const entry = peers.get(msg.receiverId);

        if (
          entry &&
          msg.generation === entry.generation
        ) {
          const now = Date.now();

          if (
            now - entry.lastRestart >=
            RESTART_COOLDOWN
          ) {
            await createSenderPeer(msg.receiverId);
          }
        }
      }
      break;

    case "error":
      stop(false);
      status("サーバーエラー: " + msg.message);
      break;
  }
}

// ==================================================
// APPLY SETTINGS
// ==================================================

async function applySettings() {
  if (applying) return;

  applying = true;
  $("applySettings").disabled = true;

  const token = sessionId;

  try {
    const settings = getSettings();

    updateSettingsInfo();

    if (!running || mode !== "sender") {
      appliedSettings = settings;
      status("設定を保存しました");
      return;
    }

    status("キャプチャ設定を変更中...");

    await updateCapture(settings);

    if (
      !running ||
      mode !== "sender" ||
      token !== sessionId
    ) {
      return;
    }

    appliedSettings = settings;

    status("WebRTC接続を再生成中...");

    const ids = [...peers.keys()];

    for (const id of ids) {
      if (
        !running ||
        mode !== "sender" ||
        token !== sessionId
      ) {
        break;
      }

      try {
        await createSenderPeer(id);
      } catch (err) {
        console.error("Reconnect:", err);
      }
    }

    if (running && token === sessionId) {
      status("設定を適用しました");
    }

  } catch (err) {
    console.error(err);
    status("設定変更エラー: " + err.message);

  } finally {
    applying = false;
    $("applySettings").disabled = false;
  }
}

$("applySettings").addEventListener(
  "click",
  applySettings
);

// ==================================================
// START SENDER
// ==================================================

$("sendButton").addEventListener(
  "click",
  async () => {
    if (running) return;

    let stream = null;

    try {
      const roomId = room();

      running = true;
      mode = "sender";

      const token = ++sessionId;

      $("sendButton").disabled = true;
      $("receiveButton").disabled = true;
      $("room").disabled = true;

      appliedSettings = getSettings();

      status("共有画面を選択してください...");

      const constraints = {
        frameRate: {
          ideal: captureFPS(appliedSettings)
        }
      };

      const height = maxHeight(appliedSettings);

      if (Number.isFinite(height)) {
        constraints.width = {
          ideal: Math.round(height * 16 / 9)
        };

        constraints.height = {
          ideal: height
        };
      }

      stream =
        await navigator.mediaDevices.getDisplayMedia({
          video: constraints,
          audio: appliedSettings.audio
        });

      if (token !== sessionId) {
        stream.getTracks().forEach(t => t.stop());
        return;
      }

      localStream = stream;

      const track = stream.getVideoTracks()[0];

      if (track) {
        track.contentHint = appliedSettings.hint;

        track.addEventListener(
          "ended",
          () => stop(),
          { once: true }
        );
      }

      updatePreview();
      updateSenderInfo();

      await connectSocket();

      if (token !== sessionId) return;

      signal({
        type: "join",
        roomId,
        role: "sender"
      });

    } catch (err) {
      console.error(err);

      if (stream && stream !== localStream) {
        stream.getTracks().forEach(t => t.stop());
      }

      stop(false);
      status("送信エラー: " + err.message);
    }
  }
);

// ==================================================
// START RECEIVER
// ==================================================

$("receiveButton").addEventListener(
  "click",
  async () => {
    if (running) return;

    try {
      const roomId = room();

      running = true;
      mode = "receiver";

      const token = ++sessionId;

      $("sendButton").disabled = true;
      $("receiveButton").disabled = true;
      $("room").disabled = true;

      video.muted = true;

      status("受信準備中...");

      await connectSocket();

      if (token !== sessionId) return;

      signal({
        type: "join",
        roomId,
        role: "receiver"
      });

    } catch (err) {
      stop(false);
      status("受信エラー: " + err.message);
    }
  }
);

// ==================================================
// STOP
// ==================================================

function stop(showStatus = true) {
  ++sessionId;

  running = false;

  for (const id of [...peers.keys()]) {
    closeSenderPeer(id);
  }

  closeReceiverPeer();

  if (socket) {
    if (socket.readyState === WebSocket.OPEN) {
      signal({ type: "leave" });
    }

    socket.close();
    socket = null;
  }

  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }

  mode = null;
  appliedSettings = null;

  senderHistory.clear();
  pendingSenderICE.clear();
  pendingReceiverICE.clear();

  updatePreview();
  updateSenderInfo();

  $("sendButton").disabled = false;
  $("receiveButton").disabled = false;
  $("applySettings").disabled = false;
  $("room").disabled = false;

  video.muted = true;

  $("muteButton").textContent = "🔇 ミュート中";

  $("senderStats").textContent = "接続端末なし";
  $("receiverStats").textContent = "未接続";
  $("healthInfo").textContent = "監視待機中";

  if (showStatus) status("停止しました");
}

$("stopButton").addEventListener(
  "click",
  () => stop()
);

// ==================================================
// FULLSCREEN / AUDIO
// ==================================================

$("fullscreen").addEventListener(
  "click",
  async () => {
    try {
      if (!video.srcObject) {
        throw new Error("受信映像がありません");
      }

      if (!document.fullscreenElement) {
        await video.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }

    } catch (err) {
      status("全画面エラー: " + err.message);
    }
  }
);

$("muteButton").addEventListener(
  "click",
  () => {
    video.muted = !video.muted;

    $("muteButton").textContent =
      video.muted
        ? "🔇 ミュート中"
        : "🔊 音声ON";

    if (!video.muted) {
      video.play().catch(console.warn);
    }
  }
);

// ==================================================
// STATS HELPERS
// ==================================================

function videoReport(stats, type) {
  for (const report of stats.values()) {
    if (
      report.type === type &&
      (report.kind === "video" ||
       report.mediaType === "video") &&
      !report.isRemote
    ) {
      return report;
    }
  }

  return null;
}

function codecName(stats, report) {
  return stats.get(report.codecId)?.mimeType || "不明";
}

function connectionInfo(stats) {
  let pair = null;

  for (const report of stats.values()) {
    if (
      report.type === "transport" &&
      report.selectedCandidatePairId
    ) {
      pair = stats.get(report.selectedCandidatePairId);
      if (pair) break;
    }
  }

  if (!pair) {
    for (const report of stats.values()) {
      if (
        report.type === "candidate-pair" &&
        report.state === "succeeded" &&
        report.nominated
      ) {
        pair = report;
        break;
      }
    }
  }

  if (!pair) return "";

  const local = stats.get(pair.localCandidateId);

  const lines = [];

  if (typeof pair.currentRoundTripTime === "number") {
    lines.push(
      "RTT: " +
      fmt(pair.currentRoundTripTime * 1000) +
      " ms"
    );
  }

  if (typeof pair.availableOutgoingBitrate === "number") {
    lines.push(
      "推定送信帯域: " +
      fmt(pair.availableOutgoingBitrate / 1e6, 2) +
      " Mbps"
    );
  }

  if (local) {
    lines.push(
      "通信: " +
      (local.candidateType || "?") +
      " / " +
      (local.protocol || "?")
    );
  }

  return lines.join("\n");
}

// ==================================================
// SENDER STATS
// ==================================================

async function updateSenderStats() {
  if (mode !== "sender") return;

  const lines = [];

  const track = localStream?.getVideoTracks()[0];

  if (track) {
    const settings = track.getSettings();

    lines.push(
      "【キャプチャ】" +
      "\n解像度: " +
      (settings.width || "?") + "×" +
      (settings.height || "?") +
      "\n設定FPS: " +
      (settings.frameRate ?? "?") +
      "\ncontentHint: " +
      track.contentHint +
      "\nトラック状態: " +
      track.readyState
    );
  }

  for (const [id, entry] of peers) {
    const pc = entry.pc;

    if (pc.signalingState === "closed") continue;

    try {
      const stats = await pc.getStats();

      if (peers.get(id) !== entry) continue;

      const report =
        videoReport(stats, "outbound-rtp");

      if (!report) continue;

      const old = senderHistory.get(id);

      const same =
        old &&
        old.generation === entry.generation &&
        old.id === report.id;

      const seconds = same
        ? (report.timestamp - old.timestamp) / 1000
        : 0;

      const mbps = same
        ? rate(report.bytesSent, old.bytes, seconds)
        : null;

      const fps = same
        ? rate(
            report.framesEncoded,
            old.framesEncoded,
            seconds
          )
        : null;

      senderHistory.set(id, {
        generation: entry.generation,
        id: report.id,
        timestamp: report.timestamp,
        bytes: report.bytesSent,
        framesEncoded: report.framesEncoded
      });

      lines.push(
        "\n【送信先 " + id.slice(0, 8) + "】" +
        "\n状態: " + pc.connectionState +
        "\n解像度: " +
        (report.frameWidth || "?") + "×" +
        (report.frameHeight || "?") +
        "\nCodec: " + codecName(stats, report) +
        "\nWebRTC FPS: " +
        (report.framesPerSecond ?? "?") +
        "\n実測エンコードFPS: " +
        fmt(fps) +
        "\n通信速度: " +
        fmt(
          mbps === null ? null : mbps * 8 / 1e6,
          2
        ) +
        " Mbps" +
        "\n品質制限: " +
        (report.qualityLimitationReason || "不明") +
        "\n" +
        connectionInfo(stats)
      );

    } catch (err) {
      console.warn("Sender stats:", err);
    }
  }

  $("senderStats").textContent =
    lines.join("\n") || "接続端末なし";
}

// ==================================================
// RECEIVER STATS
// ==================================================

let lastReceivedFrames = null;
let lastFrameChange = 0;

async function updateReceiverStats() {
  if (
    mode !== "receiver" ||
    !receiverPeer ||
    receiverPeer.signalingState === "closed"
  ) {
    return;
  }

  const pc = receiverPeer;

  try {
    const stats = await pc.getStats();

    if (pc !== receiverPeer) return;

    const report =
      videoReport(stats, "inbound-rtp");

    if (!report) return;

    const old = receiverHistory;

    const same =
      old &&
      old.generation === receiverGeneration &&
      old.id === report.id;

    const seconds = same
      ? (report.timestamp - old.timestamp) / 1000
      : 0;

    const mbps = same
      ? rate(
          report.bytesReceived,
          old.bytes,
          seconds
        )
        : null;

    const receivedFPS = same
      ? rate(
          report.framesReceived,
          old.framesReceived,
          seconds
        )
      : null;

    const decodedFPS = same
      ? rate(
          report.framesDecoded,
          old.framesDecoded,
          seconds
        )
      : null;

    receiverHistory = {
      generation: receiverGeneration,
      id: report.id,
      timestamp: report.timestamp,
      bytes: report.bytesReceived,
      framesReceived: report.framesReceived,
      framesDecoded: report.framesDecoded
    };

    if (lastReceivedFrames !== report.framesReceived) {
      lastReceivedFrames = report.framesReceived;
      lastFrameChange = Date.now();
    }

    const stalledSeconds =
      lastFrameChange
        ? (Date.now() - lastFrameChange) / 1000
        : 0;

    $("receiverStats").textContent =
      "【実測受信】" +
      "\n状態: " + pc.connectionState +
      "\n解像度: " +
      (report.frameWidth || video.videoWidth || "?") +
      "×" +
      (report.frameHeight || video.videoHeight || "?") +
      "\nCodec: " + codecName(stats, report) +
      "\nWebRTC FPS: " +
      (report.framesPerSecond ?? "?") +
      "\n実測受信FPS: " +
      fmt(receivedFPS) +
      "\n実測デコードFPS: " +
      fmt(decodedFPS) +
      "\n通信速度: " +
      fmt(
        mbps === null ? null : mbps * 8 / 1e6,
        2
      ) +
      " Mbps" +
      "\n破棄フレーム: " +
      (report.framesDropped ?? "?") +
      "\nパケットロス: " +
      (report.packetsLost ?? "?") +
      "\nフレーム更新停止: " +
      fmt(stalledSeconds) +
      " 秒" +
      "\n" +
      connectionInfo(stats);

  } catch (err) {
    console.warn("Receiver stats:", err);
  }
}

// ==================================================
// CONNECTION WATCHDOG
// ==================================================

async function watchdog() {
  if (!running || applying) return;

  const now = Date.now();

  if (mode === "sender") {
    for (const [id, entry] of peers) {
      const state = entry.pc.connectionState;

      if (state === "connected") {
        entry.disconnectedSince = 0;
        continue;
      }

      if (
        state !== "failed" &&
        state !== "disconnected"
      ) {
        entry.disconnectedSince = 0;
        continue;
      }

      if (!entry.disconnectedSince) {
        entry.disconnectedSince = now;
      }

      if (
        now - entry.disconnectedSince >=
          DISCONNECT_TIMEOUT &&
        now - entry.lastRestart >=
          RESTART_COOLDOWN
      ) {
        entry.lastRestart = now;

        status("接続異常を検出。自動復旧中...");

        try {
          await createSenderPeer(id);
        } catch (err) {
          console.warn("Auto recovery:", err);
        }
      }
    }
  }

  if (mode === "receiver" && receiverPeer) {
    const state = receiverPeer.connectionState;

    if (state === "connected") {
      receiverDisconnectedSince = 0;
    } else if (
      state === "failed" ||
      state === "disconnected"
    ) {
      if (!receiverDisconnectedSince) {
        receiverDisconnectedSince = now;
      }

      if (
        now - receiverDisconnectedSince >=
          DISCONNECT_TIMEOUT &&
        now - receiverLastRestart >=
          RESTART_COOLDOWN
      ) {
        receiverLastRestart = now;

        status("接続異常を検出。再接続を要求中...");

        signal({
          type: "restart-request",
          generation: receiverGeneration
        });
      }
    } else {
      receiverDisconnectedSince = 0;
    }
  }
}

// ==================================================
// MONITOR
// ==================================================

function updateHealthInfo() {
  if (!running) {
    $("healthInfo").textContent = "監視待機中";
    return;
  }

  const lines = [
    "監視状態: 稼働中",
    "自動復旧: 有効",
    "切断判定: " +
      (DISCONNECT_TIMEOUT / 1000) +
      "秒",
    "再接続間隔: 最低" +
      (RESTART_COOLDOWN / 1000) +
      "秒"
  ];

  if (mode === "sender") {
    lines.push(
      "送信接続数: " + peers.size
    );
  }

  if (mode === "receiver") {
    lines.push(
      "WebRTC状態: " +
      (receiverPeer?.connectionState || "待機中")
    );

    if (
      lastFrameChange &&
      receiverPeer?.connectionState === "connected"
    ) {
      const seconds =
        (Date.now() - lastFrameChange) / 1000;

      if (seconds > 5) {
        lines.push(
          "注意: " +
          fmt(seconds) +
          "秒間フレーム更新なし"
        );
      }
    }
  }

  $("healthInfo").textContent = lines.join("\n");
}

// ==================================================
// TIMER
// ==================================================

setInterval(async () => {
  if (!running || statsBusy) return;

  statsBusy = true;

  try {
    if (mode === "sender") {
      await updateSenderStats();
    }

    if (mode === "receiver") {
      await updateReceiverStats();
    }

  } catch (err) {
    console.warn("Stats:", err);
  } finally {
    statsBusy = false;
  }
}, 1000);

let watchdogBusy = false;

setInterval(async () => {
  if (watchdogBusy) return;

  watchdogBusy = true;

  try {
    await watchdog();
    updateHealthInfo();
  } catch (err) {
    console.warn("Watchdog:", err);
  } finally {
    watchdogBusy = false;
  }
}, 2000);

updateSettingsInfo();
