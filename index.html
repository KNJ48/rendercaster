<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WebRTC Caster v23</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101114;
  color: #eee;
  font-family: system-ui, sans-serif;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

section {
  background: #1b1d22;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
  margin: 16px 0;
}

h2 {
  margin-top: 0;
  font-size: 19px;
}

label {
  display: block;
  margin: 12px 0;
}

input,
select,
textarea {
  display: block;
  width: 100%;
  background: #111318;
  color: white;
  border: 1px solid #444;
  border-radius: 7px;
  padding: 10px;
  margin-top: 6px;
  font: inherit;
}

textarea {
  min-height: 60px;
  resize: vertical;
}

button {
  border: none;
  border-radius: 8px;
  padding: 11px 16px;
  margin: 5px 5px 5px 0;
  background: #35598a;
  color: white;
  font: inherit;
  cursor: pointer;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

#sendButton,
.watchButton {
  background: #16834b;
}

#stopButton,
#leaveButton {
  background: #b83232;
}

#applyButton {
  background: #a36a18;
}

#fullscreen {
  background: #7544c7;
}

video,
#remoteImage {
  display: block;
  width: 100%;
  max-height: 70vh;
  object-fit: contain;
  background: black;
  border-radius: 8px;
}

#localVideo {
  max-height: 300px;
}

#remoteImage {
  min-height: 200px;
}

pre {
  background: #101114;
  padding: 14px;
  border: 1px solid #333;
  border-radius: 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

.row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.row > label {
  flex: 1;
  min-width: 180px;
}

.status {
  background: #252a31;
  padding: 12px;
  border-radius: 8px;
  margin: 12px 0;
}

.roomCard {
  background: #111318;
  border: 1px solid #383b43;
  border-radius: 10px;
  padding: 15px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.roomTitle {
  font-size: 20px;
  font-weight: bold;
}

.small {
  color: #aaa;
  font-size: 13px;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<main>

<h1>📡 WebRTC Caster v23</h1>
<p class="small">WebRTC + WebSocket Hybrid Edition</p>

<div id="status" class="status">接続中...</div>

<section>
  <h2>🖥 画面を送信</h2>

  <label>
    ルームID
    <input id="roomId" maxlength="100" value="I">
  </label>

  <label>
    配信者名
    <input id="senderName" maxlength="80" value="ゲスト">
  </label>

  <label>
    メモ
    <textarea id="roomMemo" maxlength="300"></textarea>
  </label>

  <label>
    通信方式
    <select id="mode">
      <option value="webrtc">WebRTC（高速・P2P）</option>
      <option value="websocket">WebSocket（学校向け）</option>
    </select>
  </label>

  <button id="sendButton">🖥 画面を送信</button>
  <button id="stopButton" disabled>■ 停止</button>
</section>

<section>
  <h2>⚙ 配信設定</h2>

  <div class="row">
    <label>
      画質
      <select id="resolution">
        <option value="360">360p</option>
        <option value="480">480p</option>
        <option value="720" selected>720p</option>
        <option value="1080">1080p</option>
        <option value="native">元画質</option>
      </select>
    </label>

    <label>
      FPS
      <select id="fps">
        <option value="10">10</option>
        <option value="15" selected>15</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="60">60</option>
        <option value="120">120（実験）</option>
        <option value="auto">自動</option>
        <option value="browser">制限なし</option>
      </select>
    </label>
  </div>

  <div class="row">
    <label>
      コーデック（WebRTC）
      <select id="codec">
        <option value="h264" selected>H.264優先</option>
        <option value="vp8">VP8優先</option>
        <option value="auto">ブラウザ自動</option>
      </select>
    </label>

    <label>
      品質優先度（WebRTC）
      <select id="priority">
        <option value="maintain-resolution" selected>解像度優先</option>
        <option value="maintain-framerate">FPS優先</option>
        <option value="balanced">バランス</option>
      </select>
    </label>
  </div>

  <label>
    映像の種類（WebRTC）
    <select id="hint">
      <option value="motion" selected>動き重視</option>
      <option value="text">文字重視</option>
      <option value="detail">細部重視</option>
    </select>
  </label>

  <label>
    JPEG品質（WebSocket）
    <select id="jpegQuality">
      <option value="0.45">低画質・軽量</option>
      <option value="0.65">標準</option>
      <option value="0.8" selected>高画質</option>
      <option value="0.92">最高画質</option>
    </select>
  </label>

  <label>
    WebRTCビットレート
    <select id="bitrate">
      <option value="20000000" selected>最大20Mbps</option>
      <option value="auto">ブラウザ自動</option>
    </select>
  </label>

  <label>
    <input type="checkbox" id="audioShare" checked>
    音声共有（WebRTC）
  </label>

  <label>
    <input type="checkbox" id="preview">
    プレビュー表示
  </label>

  <button id="applyButton" disabled>
    🔄 設定を適用
  </button>

  <p class="small">
    WebSocket方式ではJPEG画像を転送します。
    音声には対応していません。
    通信方式の変更は配信停止後に行ってください。
  </p>
</section>

<section>
  <h2>👁 送信プレビュー</h2>
  <video id="localVideo" autoplay muted playsinline></video>
</section>

<section>
  <h2>📊 送信統計</h2>
  <pre id="senderStats">未配信</pre>
</section>

<section>
  <h2>📺 画面を受信</h2>

  <button id="receiveButton">📺 画面を受信</button>
  <button id="leaveButton" disabled>■ 受信停止</button>
  <button id="fullscreen">⛶ 全画面</button>
  <button id="muteButton">🔇 ミュート中</button>

  <video id="remoteVideo" autoplay playsinline muted></video>
  <img id="remoteImage" class="hidden" alt="受信映像">
</section>

<section>
  <h2>📊 受信統計</h2>
  <pre id="receiverStats">未接続</pre>
</section>

<section>
  <h2>🔧 接続監視</h2>
  <pre id="connectionStats">準備中</pre>
</section>

<section>
  <h2>📡 配信中のルーム一覧</h2>
  <p id="roomCount" class="small">読み込み中...</p>
  <div id="roomList"></div>
</section>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ]
};

const MAX_BITRATE = 20_000_000;

let ws;
let role = null;
let roomId = null;
let mode = null;

let stream = null;
let settings = null;

let senderTimer = null;
let senderBusy = false;

let canvas = document.createElement("canvas");
let ctx = canvas.getContext("2d", { alpha: false });

let senderFrames = 0;
let senderBytes = 0;
let receiverFrames = 0;
let receiverBytes = 0;

let senderStartTime = 0;
let receiverStartTime = 0;

let lastFrameTime = 0;
let lastReceivedFrameTime = 0;

let activeRooms = [];

const peers = new Map();
const senderStatsHistory = new Map();

let receiverPeer = null;
let receiverGeneration = null;
let receiverStatsHistory = {};

let generationCounter = 0;

const pendingReceiverICE = new Map();

let frameURL = null;
let latestFrame = null;
let imageBusy = false;

let senderSession = 0;
let receiverSession = 0;

function status(text) {
  $("status").textContent = text;
}

function send(data) {
  if (ws?.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

function readSettings() {
  return {
    resolution: $("resolution").value,
    fps: $("fps").value,
    codec: $("codec").value,
    priority: $("priority").value,
    hint: $("hint").value,
    bitrate: $("bitrate").value,
    jpegQuality: Number($("jpegQuality").value),
    audio: $("audioShare").checked
  };
}

function requestedFPS(s) {
  return ["auto", "browser"].includes(s.fps)
    ? null
    : Number(s.fps);
}

function targetHeight(s) {
  return s.resolution === "native"
    ? null
    : Number(s.resolution);
}

function updateButtons() {
  const sending = role === "sender";
  const receiving = role === "receiver";

  $("sendButton").disabled = !!role;
  $("stopButton").disabled = !sending;
  $("receiveButton").disabled = !!role;
  $("leaveButton").disabled = !receiving;
  $("applyButton").disabled = !sending;

  $("roomId").disabled = !!role;
  $("mode").disabled = !!role;
}

function updatePreview() {
  const enabled = $("preview").checked;

  $("localVideo").style.display =
    enabled ? "block" : "none";

  $("localVideo").srcObject =
    enabled ? stream : null;
}

function connectWS() {
  const protocol =
    location.protocol === "https:" ? "wss:" : "ws:";

  const socket = new WebSocket(
    `${protocol}//${location.host}/signal`
  );

  ws = socket;
  socket.binaryType = "blob";

  socket.onopen = () => {
    if (ws !== socket) return;
    status("サーバー接続完了");
  };

  socket.onclose = () => {
    if (ws !== socket) return;

    stopSender(false);
    stopReceiver(false);

    status("サーバーとの接続が切断されました");

    setTimeout(connectWS, 3000);
  };

  socket.onmessage = event => {
    if (ws !== socket) return;

    if (event.data instanceof Blob) {
      if (role === "receiver" && mode === "websocket") {
        receiveImage(event.data);
      }
      return;
    }

    try {
      handleSignal(JSON.parse(event.data)).catch(console.error);
    } catch (error) {
      console.error(error);
    }
  };
}

/* =====================================
   キャプチャ
===================================== */

function captureConstraints(s) {
  const video = {};

  const height = targetHeight(s);
  const fps = requestedFPS(s);

  if (height) {
    video.width = { ideal: Math.round(height * 16 / 9) };
    video.height = { ideal: height };
  }

  if (fps) {
    video.frameRate = { ideal: fps };
  }

  return Object.keys(video).length ? video : true;
}

async function applyCapture(s) {
  const track = stream?.getVideoTracks()[0];
  if (!track) return;

  const constraints = {};
  const height = targetHeight(s);
  const fps = requestedFPS(s);

  if (height) {
    constraints.width = {
      ideal: Math.round(height * 16 / 9)
    };
    constraints.height = { ideal: height };
  } else {
    const caps = track.getCapabilities?.();

    if (caps?.width?.max && caps?.height?.max) {
      constraints.width = { ideal: caps.width.max };
      constraints.height = { ideal: caps.height.max };
    }
  }

  if (fps) constraints.frameRate = { ideal: fps };

  track.contentHint = s.hint;

  try {
    await track.applyConstraints(constraints);
  } catch (error) {
    console.warn("Capture constraints:", error);
  }
}

/* =====================================
   WebSocket映像送信
===================================== */

function websocketFPS() {
  const fps = requestedFPS(settings);

  // WebSocket方式は最大30FPSに制限
  return Math.min(fps || 20, 30);
}

function websocketSize(width, height) {
  const target = targetHeight(settings);

  if (!target || height <= target) {
    return { width, height };
  }

  const scale = target / height;

  return {
    width: Math.max(1, Math.round(width * scale)),
    height: target
  };
}

async function captureAndSend() {
  if (
    role !== "sender" ||
    mode !== "websocket" ||
    senderBusy ||
    !stream ||
    ws?.readyState !== WebSocket.OPEN
  ) {
    return;
  }

  // 送信キューが増えて遅延するのを防ぐ
  if (ws.bufferedAmount > 1024 * 1024) return;

  const video = $("captureVideo");

  if (!video || video.readyState < 2) return;

  senderBusy = true;

  const session = senderSession;

  try {
    const size = websocketSize(
      video.videoWidth,
      video.videoHeight
    );

    if (
      canvas.width !== size.width ||
      canvas.height !== size.height
    ) {
      canvas.width = size.width;
      canvas.height = size.height;
    }

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const blob = await new Promise(resolve => {
      canvas.toBlob(
        resolve,
        "image/jpeg",
        settings.jpegQuality
      );
    });

    if (
      !blob ||
      role !== "sender" ||
      mode !== "websocket" ||
      session !== senderSession
    ) {
      return;
    }

    // サーバー側のフレームサイズ制限と一致
    if (blob.size > 1024 * 1024) {
      return;
    }

    if (
      ws.readyState === WebSocket.OPEN &&
      ws.bufferedAmount < 1024 * 1024
    ) {
      ws.send(blob);

      senderFrames++;
      senderBytes += blob.size;
      lastFrameTime = performance.now();
    }
  } catch (error) {
    console.warn("JPEG capture:", error);
  } finally {
    senderBusy = false;
  }
}

function startWebsocketSender() {
  const video = $("captureVideo");

  video.srcObject = stream;
  video.play().catch(console.warn);

  senderStartTime = performance.now();
  senderFrames = 0;
  senderBytes = 0;

  const interval = 1000 / websocketFPS();

  clearInterval(senderTimer);

  senderTimer = setInterval(
    captureAndSend,
    interval
  );
}

/* =====================================
   WebSocket映像受信
===================================== */

function receiveImage(blob) {
  receiverBytes += blob.size;

  // 古い未表示フレームは破棄
  if (latestFrame) {
    // 最新フレームで上書きする
  }

  latestFrame = blob;

  if (!imageBusy) {
    displayNextImage();
  }
}

function displayNextImage() {
  if (
    imageBusy ||
    !latestFrame ||
    role !== "receiver" ||
    mode !== "websocket"
  ) {
    return;
  }

  imageBusy = true;

  const blob = latestFrame;
  latestFrame = null;

  const url = URL.createObjectURL(blob);
  const image = $("remoteImage");
  const session = receiverSession;

  const decoder = new Image();

  decoder.onload = () => {
    if (
      role === "receiver" &&
      mode === "websocket" &&
      session === receiverSession
    ) {
      const oldURL = frameURL;

      frameURL = url;
      image.src = url;

      if (oldURL) {
        // imgへの切り替え後に解放
        setTimeout(() => URL.revokeObjectURL(oldURL), 1000);
      }

      receiverFrames++;
      lastReceivedFrameTime = performance.now();
    } else {
      URL.revokeObjectURL(url);
    }

    imageBusy = false;

    if (latestFrame) displayNextImage();
  };

  decoder.onerror = () => {
    URL.revokeObjectURL(url);

    imageBusy = false;

    if (latestFrame) displayNextImage();
  };

  decoder.src = url;
}

/* =====================================
   WebRTC
===================================== */

function preferCodec(transceiver, codec) {
  if (codec === "auto") return;

  const capabilities =
    RTCRtpSender.getCapabilities?.("video");

  if (!capabilities) return;

  const preferred = capabilities.codecs.filter(c =>
    c.mimeType.toLowerCase() ===
    (codec === "h264" ? "video/h264" : "video/vp8")
  );

  if (!preferred.length) return;

  const others = capabilities.codecs.filter(
    c => !preferred.includes(c)
  );

  try {
    transceiver.setCodecPreferences([
      ...preferred,
      ...others
    ]);
  } catch (error) {
    console.warn(error);
  }
}

function closePeer(id) {
  const entry = peers.get(id);

  if (!entry) return;

  entry.pc.close();
  peers.delete(id);
  senderStatsHistory.delete(id);
}

async function makeOffer(id) {
  if (role !== "sender" || mode !== "webrtc") return;

  closePeer(id);

  const pc = new RTCPeerConnection(rtcConfig);
  const generation = ++generationCounter;

  const entry = {
    pc,
    generation,
    pendingICE: [],
    disconnectedAt: 0,
    lastRestart: Date.now()
  };

  peers.set(id, entry);

  const current = () =>
    peers.get(id) === entry &&
    role === "sender";

  pc.onicecandidate = event => {
    if (!event.candidate || !current()) return;

    send({
      type: "ice",
      receiverId: id,
      generation,
      candidate: event.candidate
    });
  };

  for (const track of stream.getTracks()) {
    if (track.kind === "video") {
      const transceiver = pc.addTransceiver(track, {
        direction: "sendonly",
        streams: [stream]
      });

      preferCodec(transceiver, settings.codec);

      const sender = transceiver.sender;
      const params = sender.getParameters();

      if (!params.encodings?.length) {
        params.encodings = [{}];
      }

      const encoding = params.encodings[0];
      const fps = requestedFPS(settings);
      const height = targetHeight(settings);
      const capture = track.getSettings();

      encoding.scaleResolutionDownBy =
        height && capture.height > height
          ? capture.height / height
          : 1;

      if (fps) encoding.maxFramerate = fps;

      if (settings.bitrate !== "auto") {
        encoding.maxBitrate = MAX_BITRATE;
      }

      params.degradationPreference = settings.priority;

      try {
        await sender.setParameters(params);
      } catch (error) {
        console.warn(error);
      }
    } else {
      pc.addTrack(track, stream);
    }
  }

  if (!current()) return;

  const offer = await pc.createOffer();

  if (!current()) return;

  await pc.setLocalDescription(offer);

  if (!current()) return;

  send({
    type: "offer",
    receiverId: id,
    generation,
    sdp: pc.localDescription
  });
}

async function handleOffer(data) {
  if (role !== "receiver" || mode !== "webrtc") return;

  if (
    receiverGeneration !== null &&
    data.generation <= receiverGeneration
  ) {
    return;
  }

  if (receiverPeer) receiverPeer.close();

  const pc = new RTCPeerConnection(rtcConfig);
  const session = receiverSession;

  receiverPeer = pc;
  receiverGeneration = data.generation;
  receiverStatsHistory = {};

  const current = () =>
    role === "receiver" &&
    receiverSession === session &&
    receiverPeer === pc;

  pc.ontrack = event => {
    if (!current()) return;

    $("remoteVideo").srcObject =
      event.streams[0] ||
      new MediaStream([event.track]);

    $("remoteVideo").play().catch(() => {});
  };

  pc.onicecandidate = event => {
    if (!event.candidate || !current()) return;

    send({
      type: "ice",
      generation: data.generation,
      candidate: event.candidate
    });
  };

  await pc.setRemoteDescription(data.sdp);

  if (!current()) return;

  const answer = await pc.createAnswer();

  await pc.setLocalDescription(answer);

  if (!current()) return;

  send({
    type: "answer",
    generation: data.generation,
    sdp: pc.localDescription
  });

  const pending =
    pendingReceiverICE.get(data.generation) || [];

  pendingReceiverICE.delete(data.generation);

  for (const candidate of pending) {
    if (!current()) break;

    try {
      await pc.addIceCandidate(candidate);
    } catch (error) {
      console.warn(error);
    }
  }
}

/* =====================================
   送信開始・停止
===================================== */

async function startSender() {
  if (role || ws?.readyState !== WebSocket.OPEN) return;

  const room = $("roomId").value;

  if (!room.trim()) {
    status("ルームIDを入力してください");
    return;
  }

  const selectedMode = $("mode").value;
  const selectedSettings = readSettings();

  $("sendButton").disabled = true;

  let captured = null;

  try {
    captured = await navigator.mediaDevices.getDisplayMedia({
      video: captureConstraints(selectedSettings),
      audio:
        selectedMode === "webrtc" &&
        selectedSettings.audio
    });

    stream = captured;
    settings = selectedSettings;

    role = "sender";
    mode = selectedMode;
    roomId = room;

    senderSession++;

    stream.getVideoTracks()[0].onended = () => {
      stopSender(true);
    };

    await applyCapture(settings);

    updatePreview();

    if (mode === "websocket") {
      startWebsocketSender();
    }

    send({
      type: "join",
      role: "sender",
      room,
      mode,
      name: $("senderName").value,
      memo: $("roomMemo").value
    });

    renderRooms();
    updateButtons();

    status(`配信開始: ${room} / ${mode}`);
  } catch (error) {
    if (captured) {
      captured.getTracks().forEach(t => t.stop());
    }

    stream = null;
    role = null;
    mode = null;

    updateButtons();

    status(`画面共有エラー: ${error.message}`);
  }
}

function stopSender(notify = true) {
  if (role !== "sender") return;

  senderSession++;

  clearInterval(senderTimer);
  senderTimer = null;

  for (const id of [...peers.keys()]) {
    closePeer(id);
  }

  if (stream) {
    stream.getTracks().forEach(track => {
      track.onended = null;
      track.stop();
    });
  }

  stream = null;

  $("localVideo").srcObject = null;
  $("captureVideo").srcObject = null;

  if (notify) send({ type: "leave" });

  role = null;
  mode = null;
  roomId = null;

  $("senderStats").textContent = "未配信";

  renderRooms();
  updateButtons();

  status("配信停止");
}

/* =====================================
   設定変更
===================================== */

async function applySettings() {
  if (role !== "sender" || !stream) return;

  $("applyButton").disabled = true;

  settings = readSettings();

  try {
    await applyCapture(settings);

    updatePreview();

    if (mode === "websocket") {
      startWebsocketSender();
    } else {
      for (const id of [...peers.keys()]) {
        await makeOffer(id);
      }
    }

    status("設定を適用しました");
  } catch (error) {
    status(`設定変更エラー: ${error.message}`);
  } finally {
    updateButtons();
  }
}

/* =====================================
   受信
===================================== */

function startReceiver(room) {
  if (
    role === "sender" ||
    ws?.readyState !== WebSocket.OPEN
  ) {
    return;
  }

  if (role === "receiver") {
    stopReceiver(true);
  }

  role = "receiver";
  mode = null;
  roomId = room;

  receiverSession++;

  $("roomId").value = room;

  send({
    type: "join",
    role: "receiver",
    room
  });

  updateButtons();

  status(`受信待機中: ${room}`);
}

function stopReceiver(notify = true) {
  if (role !== "receiver") return;

  receiverSession++;

  if (receiverPeer) {
    receiverPeer.close();
    receiverPeer = null;
  }

  receiverGeneration = null;
  receiverStatsHistory = {};

  pendingReceiverICE.clear();

  latestFrame = null;

  if (frameURL) {
    URL.revokeObjectURL(frameURL);
    frameURL = null;
  }

  $("remoteVideo").srcObject = null;
  $("remoteImage").removeAttribute("src");

  if (notify) send({ type: "leave" });

  role = null;
  mode = null;
  roomId = null;

  $("receiverStats").textContent = "未接続";

  updateButtons();

  status("受信停止");
}

function updateReceiverDisplay() {
  const websocket = mode === "websocket";

  $("remoteImage").classList.toggle(
    "hidden",
    !websocket
  );

  $("remoteVideo").classList.toggle(
    "hidden",
    websocket
  );
}

/* =====================================
   シグナリング
===================================== */

async function handleSignal(data) {
  switch (data.type) {

    case "room-list":
      activeRooms = data.rooms || [];

      renderRooms();

      if (
        !role &&
        !$("roomId").dataset.edited
      ) {
        $("roomId").value =
          data.suggestedRoom || "I";
      }
      break;

    case "joined":
      if (
        data.role === "receiver" &&
        role === "receiver" &&
        data.room === roomId
      ) {
        mode = data.mode;

        receiverStartTime = performance.now();
        receiverFrames = 0;
        receiverBytes = 0;

        updateReceiverDisplay();

        status(
          `受信開始: ${roomId} / ${mode}`
        );
      }
      break;

    case "receiver-joined":
      if (role === "sender" && mode === "webrtc") {
        await makeOffer(data.receiverId);
      }
      break;

    case "receiver-left":
      closePeer(data.receiverId);
      break;

    case "sender-left":
      if (role === "receiver") {
        stopReceiver(false);
        status("配信が終了しました");
      }
      break;

    case "offer":
      await handleOffer(data);
      break;

    case "answer": {
      const entry = peers.get(data.receiverId);

      if (
        entry &&
        entry.generation === data.generation
      ) {
        await entry.pc.setRemoteDescription(data.sdp);

        if (peers.get(data.receiverId) !== entry) break;

        for (const candidate of entry.pendingICE.splice(0)) {
          try {
            await entry.pc.addIceCandidate(candidate);
          } catch (error) {
            console.warn(error);
          }
        }
      }
      break;
    }

    case "ice":
      if (role === "sender") {
        const entry = peers.get(data.receiverId);

        if (
          entry &&
          entry.generation === data.generation
        ) {
          if (entry.pc.remoteDescription) {
            await entry.pc.addIceCandidate(
              data.candidate
            ).catch(console.warn);
          } else {
            entry.pendingICE.push(data.candidate);
          }
        }
      } else if (role === "receiver") {
        if (
          receiverGeneration !== null &&
          data.generation < receiverGeneration
        ) {
          break;
        }

        if (
          receiverGeneration === data.generation &&
          receiverPeer?.remoteDescription
        ) {
          await receiverPeer.addIceCandidate(
            data.candidate
          ).catch(console.warn);
        } else {
          if (!pendingReceiverICE.has(data.generation)) {
            pendingReceiverICE.set(data.generation, []);
          }

          pendingReceiverICE
            .get(data.generation)
            .push(data.candidate);
        }
      }
      break;

    case "restart-request": {
      const entry = peers.get(data.receiverId);

      if (
        entry &&
        entry.generation === data.generation
      ) {
        await makeOffer(data.receiverId);
      }
      break;
    }

    case "error":
      if (role === "sender") {
        stopSender(false);
      }

      status(`エラー: ${data.message}`);
      break;
  }
}

/* =====================================
   ルーム一覧
===================================== */

function renderRooms() {
  const container = $("roomList");
  container.replaceChildren();

  const visible = activeRooms.filter(room =>
    !(
      role === "sender" &&
      room.id === roomId
    )
  );

  $("roomCount").textContent =
    `現在 ${visible.length} 件の配信があります`;

  if (!visible.length) {
    container.textContent =
      "現在、ほかに配信中のルームはありません。";
    return;
  }

  for (const room of visible) {
    const card = document.createElement("div");
    card.className = "roomCard";

    const title = document.createElement("div");
    title.className = "roomTitle";
    title.textContent = `🟢 ${room.id}`;

    const name = document.createElement("p");
    name.textContent = `配信者：${room.name}`;

    const type = document.createElement("p");
    type.className = "small";
    type.textContent =
      room.mode === "websocket"
        ? "通信：WebSocket"
        : "通信：WebRTC";

    card.append(title, name, type);

    if (room.memo) {
      const memo = document.createElement("p");
      memo.textContent = room.memo;
      memo.style.whiteSpace = "pre-wrap";
      card.appendChild(memo);
    }

    const button = document.createElement("button");
    button.className = "watchButton";
    button.textContent = "📺 視聴";

    button.disabled = role === "sender";

    button.onclick = () => {
      startReceiver(room.id);

      $("remoteVideo").parentElement.scrollIntoView({
        behavior: "smooth"
      });
    };

    card.appendChild(button);
    container.appendChild(card);
  }
}

/* =====================================
   統計
===================================== */

function rate(count, start) {
  const seconds =
    (performance.now() - start) / 1000;

  if (seconds <= 0) return "0.0";

  return (count / seconds).toFixed(1);
}

function mbps(bytes, start) {
  const seconds =
    (performance.now() - start) / 1000;

  if (seconds <= 0) return "0.00";

  return (
    bytes * 8 / seconds / 1e6
  ).toFixed(2);
}

function delta(report, history, key, multiplier = 1) {
  const value = report[key];

  if (typeof value !== "number") return "?";

  const previous = history[key];

  history[key] = {
    value,
    time: report.timestamp
  };

  if (!previous) return "?";

  const seconds =
    (report.timestamp - previous.time) / 1000;

  if (seconds <= 0) return "?";

  return (
    (value - previous.value) *
    multiplier / seconds
  ).toFixed(1);
}

async function updateStats() {
  if (role === "sender" && stream) {
    const capture = stream.getVideoTracks()[0]?.getSettings();

    if (mode === "websocket") {
      $("senderStats").textContent =
`【WebSocket送信】

キャプチャ:
${capture?.width}×${capture?.height}

設定FPS: ${capture?.frameRate ?? "?"}
目標FPS: ${websocketFPS()}

送信平均FPS: ${rate(senderFrames, senderStartTime)}
送信平均速度: ${mbps(senderBytes, senderStartTime)} Mbps

送信フレーム累計: ${senderFrames}
送信データ累計: ${(senderBytes / 1048576).toFixed(1)} MB

WebSocket送信待ち:
${ws?.bufferedAmount || 0} bytes

※FPSとMbpsは配信開始からの平均値`;
    } else {
      let text =
`【WebRTC送信】

キャプチャ: ${capture?.width}×${capture?.height}
設定FPS: ${capture?.frameRate ?? "?"}

`;

      for (const [id, entry] of peers) {
        try {
          const reports = await entry.pc.getStats();

          const out = [...reports.values()].find(r =>
            r.type === "outbound-rtp" &&
            r.kind === "video"
          );

          if (!out || peers.get(id) !== entry) continue;

          let history = senderStatsHistory.get(id);

          if (!history) {
            history = {};
            senderStatsHistory.set(id, history);
          }

          const codec = reports.get(out.codecId);

          text +=
`【送信先 ${id.slice(0, 8)}】
状態: ${entry.pc.connectionState}
解像度: ${out.frameWidth}×${out.frameHeight}
Codec: ${codec?.mimeType || "?"}
WebRTC FPS: ${out.framesPerSecond ?? "?"}
エンコードFPS: ${delta(out, history, "framesEncoded")}
送出FPS: ${delta(out, history, "framesSent")}
通信速度: ${delta(out, history, "bytesSent", 8 / 1e6)} Mbps

`;
        } catch (error) {
          console.warn(error);
        }
      }

      $("senderStats").textContent = text;
    }
  }

  if (role === "receiver") {
    if (mode === "websocket") {
      $("receiverStats").textContent =
`【WebSocket受信】

表示平均FPS:
${rate(receiverFrames, receiverStartTime)}

受信平均速度:
${mbps(receiverBytes, receiverStartTime)} Mbps

表示フレーム累計:
${receiverFrames}

受信データ累計:
${(receiverBytes / 1048576).toFixed(1)} MB

最終映像更新:
${lastReceivedFrameTime
  ? ((performance.now() - lastReceivedFrameTime) / 1000).toFixed(1)
  : "?"} 秒前

※FPSとMbpsは受信開始からの平均値`;
    } else if (receiverPeer) {
      try {
        const pc = receiverPeer;
        const reports = await pc.getStats();

        if (pc !== receiverPeer) return;

        const inbound = [...reports.values()].find(r =>
          r.type === "inbound-rtp" &&
          r.kind === "video"
        );

        if (!inbound) return;

        const codec = reports.get(inbound.codecId);

        $("receiverStats").textContent =
`【WebRTC受信】

状態: ${pc.connectionState}
Codec: ${codec?.mimeType || "?"}
解像度: ${inbound.frameWidth}×${inbound.frameHeight}

WebRTC FPS: ${inbound.framesPerSecond ?? "?"}
実測受信FPS: ${delta(inbound, receiverStatsHistory, "framesReceived")}
実測デコードFPS: ${delta(inbound, receiverStatsHistory, "framesDecoded")}

通信速度: ${delta(inbound, receiverStatsHistory, "bytesReceived", 8 / 1e6)} Mbps
パケットロス: ${inbound.packetsLost ?? "?"}
破棄フレーム: ${inbound.framesDropped ?? "?"}`;
      } catch (error) {
        console.warn(error);
      }
    }
  }

  $("connectionStats").textContent =
`WebSocket: ${ws?.readyState === WebSocket.OPEN ? "connected" : "disconnected"}
モード: ${mode || "待機"}
ルーム: ${roomId || "-"}
WebRTC送信接続数: ${peers.size}
WebRTC受信状態: ${receiverPeer?.connectionState || "-"}
`;
}

/* =====================================
   自動復旧
===================================== */

function watchdog() {
  if (mode !== "webrtc") return;

  const now = Date.now();

  if (role === "sender") {
    for (const [id, entry] of peers) {
      const state = entry.pc.connectionState;

      if (state === "connected") {
        entry.disconnectedAt = 0;
        continue;
      }

      if (state === "failed" || state === "disconnected") {
        if (!entry.disconnectedAt) {
          entry.disconnectedAt = now;
        }

        if (
          now - entry.disconnectedAt > 8000 &&
          now - entry.lastRestart > 15000
        ) {
          entry.lastRestart = now;
          makeOffer(id).catch(console.error);
        }
      }
    }
  }
}

/* =====================================
   イベント
===================================== */

$("roomId").oninput = () => {
  $("roomId").dataset.edited = "1";
};

$("sendButton").onclick = startSender;

$("stopButton").onclick = () => stopSender(true);

$("receiveButton").onclick = () => {
  startReceiver($("roomId").value);
};

$("leaveButton").onclick = () => stopReceiver(true);

$("applyButton").onclick = applySettings;

$("preview").onchange = updatePreview;

$("senderName").oninput =
$("roomMemo").oninput = () => {
  if (role !== "sender") return;

  send({
    type: "update-room",
    name: $("senderName").value,
    memo: $("roomMemo").value
  });
};

$("fullscreen").onclick = () => {
  const element =
    mode === "websocket"
      ? $("remoteImage")
      : $("remoteVideo");

  element.requestFullscreen?.();
};

$("muteButton").onclick = () => {
  const video = $("remoteVideo");

  video.muted = !video.muted;

  $("muteButton").textContent =
    video.muted ? "🔇 ミュート中" : "🔊 音声ON";
};

/* =====================================
   非表示キャプチャ用Video
===================================== */

const captureVideo = document.createElement("video");

captureVideo.id = "captureVideo";
captureVideo.autoplay = true;
captureVideo.muted = true;
captureVideo.playsInline = true;

captureVideo.style.display = "none";

document.body.appendChild(captureVideo);

/* =====================================
   初期化
===================================== */

connectWS();
updateButtons();
updatePreview();

setInterval(updateStats, 1000);
setInterval(watchdog, 1000);

</script>
