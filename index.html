<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>WebRTC Caster v12</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #101114;
  color: #eee;
  font-family: system-ui, sans-serif;
}

main {
  max-width: 900px;
  margin: auto;
}

section {
  background: #1b1d22;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
  margin: 16px 0;
}

input, select, button {
  font: inherit;
  padding: 11px;
  border-radius: 8px;
}

input, select {
  background: #292c33;
  color: white;
  border: 1px solid #555;
  width: 100%;
}

select {
  margin: 8px 0 16px;
}

button {
  border: 0;
  background: #2868d8;
  color: white;
  cursor: pointer;
  margin: 4px;
}

button:hover {
  filter: brightness(1.15);
}

button:disabled {
  opacity: 0.5;
}

#sendButton {
  background: #16834b;
}

#stopButton {
  background: #b83232;
}

#fullscreen {
  background: #7544c7;
}

#status, .info {
  white-space: pre-wrap;
  background: #20232a;
  border-radius: 8px;
  padding: 14px;
  margin-top: 12px;
  font-family: monospace;
  line-height: 1.6;
}

#status {
  color: #90d8ff;
}

.info {
  color: #ccc;
  font-size: 13px;
}

video {
  width: 100%;
  max-height: 75vh;
  background: black;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 8px;
}

video:fullscreen {
  width: 100vw;
  height: 100vh;
  max-height: none;
  margin: 0;
  border-radius: 0;
}

small {
  color: #aaa;
}
</style>
</head>

<body>

<main>

<h1>WebRTC Caster v12</h1>

<p>VideoFrame Worker Edition</p>

<div id="status">準備完了</div>

<section>

<h2>ルーム</h2>

<input
  id="room"
  value="1111"
  maxlength="32"
>

</section>

<section>

<h2>映像処理方式</h2>

<select id="renderMode">

  <option value="standard">
    標準WebRTC（安定）
  </option>

  <option value="worker" selected>
    VideoFrame Worker（実験）
  </option>

</select>

<h3>画質</h3>

<select id="quality">

  <option value="360">360p</option>
  <option value="480">480p</option>
  <option value="720" selected>720p</option>
  <option value="1080">1080p</option>

</select>

<p>
  <small>
    Workerモードの画質は送信開始時に決定します。
    標準モードでは元のキャプチャ解像度を使用します。
  </small>
</p>

</section>

<section>

<h2>送信</h2>

<button id="sendButton">
  🖥 画面を送信
</button>

<button id="stopButton">
  ■ 停止
</button>

<div id="senderInfo" class="info">
  未送信
</div>

<div id="senderStats" class="info">
  送信統計：未接続
</div>

</section>

<section>

<h2>受信</h2>

<button id="receiveButton">
  📺 画面を受信
</button>

<button id="fullscreen">
  ⛶ 全画面
</button>

<button id="muteButton">
  🔊 音声ON
</button>

<video
  id="video"
  autoplay
  playsinline>
</video>

<div id="receiverStats" class="info">
  未接続
</div>

</section>

</main>

<script>

// ============================================================
// BASIC
// ============================================================

const $ = id => document.getElementById(id);

const video = $("video");

function status(text) {
  $("status").textContent = text;
  console.log(text);
}

function getRoom() {

  const value = $("room").value.trim();

  if (!/^[A-Za-z0-9_-]{1,32}$/.test(value)) {
    throw new Error("ルームIDが不正です");
  }

  return value;
}


// ============================================================
// STATE
// ============================================================

let socket = null;
let role = null;

let sourceStream = null;
let sendStream = null;

let workerController = null;
let receiverPeer = null;

const senderPeers = new Map();

const senderICE = new Map();

let receiverICE = [];

let lastReceiver = null;

const lastSender = new Map();

let statsBusy = false;


// ============================================================
// PEER
// ============================================================

function createPeer() {

  return new RTCPeerConnection({

    iceServers: [

      {
        urls: "stun:stun.l.google.com:19302"
      },

      {
        urls: "stun:stun1.l.google.com:19302"
      }

    ]

  });

}


// ============================================================
// VIDEOFRAME WORKER
// ============================================================

async function createWorkerStream(source) {

  const sourceTrack = source.getVideoTracks()[0];

  if (!sourceTrack) {
    throw new Error("映像トラックがありません");
  }

  if (
    typeof MediaStreamTrackProcessor === "undefined" ||
    typeof MediaStreamTrackGenerator === "undefined" ||
    typeof VideoFrame === "undefined" ||
    typeof Worker === "undefined"
  ) {
    throw new Error(
      "このブラウザはVideoFrame処理に対応していません"
    );
  }

  const height = Number($("quality").value);
  const width = Math.round(height * 16 / 9);

  const worker = new Worker("/video-worker.js");

  const processor = new MediaStreamTrackProcessor({
    track: sourceTrack
  });

  const generator = new MediaStreamTrackGenerator({
    kind: "video"
  });

  const reader = processor.readable.getReader();
  const writer = generator.writable.getWriter();

  let running = true;
  let busy = false;

  let processedFPS = 0;
  let droppedFrames = 0;

  let started = false;

  let resolveReady;
  let rejectReady;

  const readyPromise = new Promise((resolve, reject) => {
    resolveReady = resolve;
    rejectReady = reject;
  });

  const timeout = setTimeout(() => {
    if (!started) {
      rejectReady(
        new Error("Worker起動タイムアウト")
      );
    }
  }, 10000);

  const controller = {

    stream: null,

    worker,

    async stop() {

      if (!running) return;

      running = false;

      try {
        await reader.cancel();
      } catch {}

      try {
        await writer.abort();
      } catch {}

      try {
        reader.releaseLock();
      } catch {}

      try {
        writer.releaseLock();
      } catch {}

      generator.stop();

      worker.terminate();
    },

    getStats() {
      return {
        fps: processedFPS,
        droppedFrames
      };
    }

  };


  // ==========================================================
  // WORKER MESSAGE
  // ==========================================================

  worker.onmessage = async event => {

    const msg = event.data;

    if (msg.type === "ready") {

      started = true;

      clearTimeout(timeout);

      resolveReady();

      return;
    }

    if (msg.type === "stats") {

      processedFPS = msg.fps;

      return;
    }

    if (msg.type === "frame-done") {

      busy = false;

      if (msg.dropped) {
        droppedFrames++;
      }

      return;
    }

    if (msg.type === "frame-error") {

      console.warn(
        "Worker frame error:",
        msg.message
      );

      return;
    }

    if (msg.type === "error") {

      console.error(
        "Worker error:",
        msg.message
      );

      if (!started) {
        clearTimeout(timeout);
        rejectReady(new Error(msg.message));
      }

      return;
    }

    if (msg.type === "frame") {

      const frame = msg.frame;

      try {

        if (running) {

          await writer.write(frame);

        }

      } catch (error) {

        if (running) {
          console.warn("Video writer:", error);
        }

      } finally {

        frame.close();

        busy = false;

      }

    }

  };


  worker.onerror = error => {

    console.error("Worker exception:", error);

    if (!started) {

      clearTimeout(timeout);

      rejectReady(
        new Error(error.message || "Worker error")
      );

    }

  };


  // ==========================================================
  // INITIALIZE
  // ==========================================================

  worker.postMessage({
    type: "init",
    width,
    height
  });

  try {
    await readyPromise;
  } catch (error) {
    await controller.stop();
    throw error;
  }


  // ==========================================================
  // PROCESS LOOP
  // ==========================================================

  async function processLoop() {

    try {

      while (running) {

        const {
          value: frame,
          done
        } = await reader.read();

        if (done) break;

        if (!running) {
          frame.close();
          break;
        }

        // Workerが処理中ならフレームを破棄
        // 古いフレームが溜まって遅延するのを防ぐ

        if (busy) {

          frame.close();

          droppedFrames++;

          continue;
        }

        busy = true;

        try {

          worker.postMessage(
            {
              type: "frame",
              frame
            },
            [frame]
          );

        } catch (error) {

          busy = false;

          frame.close();

          throw error;
        }

      }

    } catch (error) {

      if (running) {
        console.error(
          "Frame processing stopped:",
          error
        );

        status(
          "Worker映像処理エラー: " + error.message
        );
      }

    }

  }


  // ==========================================================
  // OUTPUT
  // ==========================================================

  const output = new MediaStream([
    generator
  ]);

  for (const track of source.getAudioTracks()) {
    output.addTrack(track);
  }

  controller.stream = output;

  processLoop();

  return controller;

}


// ============================================================
// SOCKET
// ============================================================

function connectSocket() {

  return new Promise((resolve, reject) => {

    const protocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    socket = new WebSocket(
      protocol + "//" + location.host + "/signal"
    );

    socket.onopen = resolve;

    socket.onerror = () => {
      reject(
        new Error("WebSocket接続失敗")
      );
    };

    socket.onmessage = async event => {

      try {

        const msg = JSON.parse(event.data);

        await handleSignal(msg);

      } catch (error) {

        console.error(error);

        status(
          "通信エラー: " + error.message
        );

      }

    };

    socket.onclose = () => {
      console.log("WebSocket closed");
    };

  });

}


function signal(data) {

  if (socket?.readyState !== WebSocket.OPEN) {
    throw new Error("WebSocket未接続");
  }

  socket.send(JSON.stringify(data));

}


// ============================================================
// SENDER PEER
// ============================================================

async function createSenderPeer(id) {

  if (senderPeers.has(id) || !sendStream) {
    return;
  }

  const pc = createPeer();

  senderPeers.set(id, pc);

  pc.onicecandidate = event => {

    if (
      event.candidate &&
      socket?.readyState === WebSocket.OPEN
    ) {

      signal({
        type: "ice",
        receiverId: id,
        candidate: event.candidate
      });

    }

  };

  pc.onconnectionstatechange = () => {
    console.log(
      "Sender Peer:",
      id,
      pc.connectionState
    );
  };

  try {

    for (const track of sendStream.getTracks()) {
      pc.addTrack(track, sendStream);
    }

    const offer = await pc.createOffer();

    await pc.setLocalDescription(offer);

    signal({
      type: "offer",
      receiverId: id,
      sdp: pc.localDescription
    });

  } catch (error) {

    pc.close();

    senderPeers.delete(id);

    throw error;
  }

}


// ============================================================
// SIGNALING
// ============================================================

async function handleSignal(msg) {

  if (msg.type === "error") {

    status(
      "サーバーエラー: " + msg.message
    );

    return;
  }

  if (msg.type === "sender-ready") {

    status(
      "送信準備完了。受信者を待っています"
    );

    return;
  }

  if (msg.type === "receiver-ready") {

    status(
      msg.senderOnline
        ? "送信者を発見。接続しています..."
        : "送信者を待っています..."
    );

    return;
  }

  if (
    msg.type === "receiver-joined" &&
    role === "sender"
  ) {

    await createSenderPeer(msg.receiverId);

    return;
  }

  if (
    msg.type === "receiver-left" &&
    role === "sender"
  ) {

    senderPeers.get(msg.receiverId)?.close();

    senderPeers.delete(msg.receiverId);

    senderICE.delete(msg.receiverId);

    lastSender.delete(msg.receiverId);

    return;
  }

  if (msg.type === "sender-left") {

    receiverPeer?.close();

    receiverPeer = null;

    video.srcObject = null;

    receiverICE = [];

    lastReceiver = null;

    status("送信者が退出しました");

    return;
  }

  if (
    msg.type === "answer" &&
    role === "sender"
  ) {

    const pc = senderPeers.get(msg.receiverId);

    if (!pc) return;

    if (pc.signalingState !== "have-local-offer") {
      return;
    }

    await pc.setRemoteDescription(msg.sdp);

    for (const candidate of senderICE.get(msg.receiverId) || []) {

      await pc.addIceCandidate(candidate);

    }

    senderICE.delete(msg.receiverId);

    return;
  }

  if (
    msg.type === "offer" &&
    role === "receiver"
  ) {

    receiverPeer?.close();

    const pc = createPeer();

    receiverPeer = pc;

    lastReceiver = null;

    pc.ontrack = event => {

      if (event.streams[0]) {

        video.srcObject = event.streams[0];

      } else {

        const stream =
          video.srcObject || new MediaStream();

        stream.addTrack(event.track);

        video.srcObject = stream;
      }

      video.play().catch(console.warn);

    };

    pc.onicecandidate = event => {

      if (
        event.candidate &&
        socket?.readyState === WebSocket.OPEN
      ) {

        signal({
          type: "ice",
          candidate: event.candidate
        });

      }

    };

    pc.onconnectionstatechange = () => {

      if (pc !== receiverPeer) return;

      if (pc.connectionState === "connected") {

        status(
          "接続成功！ 映像受信中"
        );

      }

      if (pc.connectionState === "failed") {

        status(
          "WebRTC接続失敗"
        );

      }

    };

    await pc.setRemoteDescription(msg.sdp);

    for (const candidate of receiverICE) {

      await pc.addIceCandidate(candidate);

    }

    receiverICE = [];

    const answer = await pc.createAnswer();

    await pc.setLocalDescription(answer);

    signal({
      type: "answer",
      sdp: pc.localDescription
    });

    return;
  }

  if (msg.type === "ice") {

    if (role === "sender") {

      const pc = senderPeers.get(msg.receiverId);

      if (!pc) return;

      if (pc.remoteDescription) {

        await pc.addIceCandidate(msg.candidate);

      } else {

        if (!senderICE.has(msg.receiverId)) {
          senderICE.set(msg.receiverId, []);
        }

        senderICE.get(msg.receiverId).push(
          msg.candidate
        );

      }

    } else if (role === "receiver") {

      if (receiverPeer?.remoteDescription) {

        await receiverPeer.addIceCandidate(
          msg.candidate
        );

      } else {

        receiverICE.push(msg.candidate);

      }

    }

  }

}


// ============================================================
// START
// ============================================================

$("sendButton").onclick = async () => {

  if (role) return;

  try {

    const room = getRoom();

    status("共有する画面を選択してください...");

    sourceStream =
      await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: true
      });

    // ======================================
    // WORKER MODE
    // ======================================

    if ($("renderMode").value === "worker") {

      status("VideoFrame Workerを起動中...");

      try {

        workerController =
          await createWorkerStream(sourceStream);

        sendStream = workerController.stream;

        status(
          "Worker映像処理を開始しました"
        );

      } catch (error) {

        console.warn(
          "Worker unavailable, fallback:",
          error
        );

        // 非対応・初期化失敗時は標準モードへ
        workerController = null;

        sendStream = sourceStream;

        status(
          "Worker非対応のため標準WebRTCへ切り替えました\n" +
          error.message
        );

      }

    } else {

      sendStream = sourceStream;

    }

    role = "sender";

    const sourceTrack =
      sourceStream.getVideoTracks()[0];

    if (sourceTrack) {

      sourceTrack.onended = () => stop();

    }

    await connectSocket();

    signal({
      type: "sender-join",
      room
    });

  } catch (error) {

    status(
      "送信エラー: " + error.message
    );

    stop(false);

  }

};


// ============================================================
// RECEIVE
// ============================================================

$("receiveButton").onclick = async () => {

  if (role) return;

  try {

    const room = getRoom();

    role = "receiver";

    status("受信準備中...");

    await connectSocket();

    signal({
      type: "receiver-join",
      room
    });

  } catch (error) {

    status(
      "受信エラー: " + error.message
    );

    stop(false);

  }

};


// ============================================================
// STOP
// ============================================================

let stopping = false;

async function stop(show = true) {

  if (stopping) return;

  stopping = true;

  for (const pc of senderPeers.values()) {
    pc.close();
  }

  senderPeers.clear();
  senderICE.clear();
  lastSender.clear();

  receiverPeer?.close();
  receiverPeer = null;

  receiverICE = [];
  lastReceiver = null;

  socket?.close();
  socket = null;

  if (workerController) {

    await workerController.stop();

    workerController = null;

  }

  sourceStream?.getTracks().forEach(track => {

    track.onended = null;

    track.stop();

  });

  sourceStream = null;
  sendStream = null;

  role = null;

  video.srcObject = null;

  if (show) {
    status("停止しました");
  }

  stopping = false;

}

$("stopButton").onclick = () => {
  stop();
};


// ============================================================
// FULLSCREEN
// ============================================================

$("fullscreen").onclick = async () => {

  try {

    if (!video.srcObject) {
      throw new Error("まだ映像がありません");
    }

    if (video.requestFullscreen) {

      await video.requestFullscreen();

    } else if (video.webkitEnterFullscreen) {

      video.webkitEnterFullscreen();

    }

  } catch (error) {

    status(
      "全画面エラー: " + error.message
    );

  }

};


// ============================================================
// AUDIO
// ============================================================

$("muteButton").onclick = () => {

  video.muted = !video.muted;

  $("muteButton").textContent =
    video.muted
      ? "🔇 ミュート中"
      : "🔊 音声ON";

};


// ============================================================
// STATS
// ============================================================

function findVideoStats(stats, type) {

  for (const report of stats.values()) {

    if (
      report.type === type &&
      (
        report.kind === "video" ||
        report.mediaType === "video"
      )
    ) {
      return report;
    }

  }

  return null;

}


function calculateBitrate(report, previous, direction) {

  if (!previous) return null;

  const bytes =
    direction === "send"
      ? report.bytesSent
      : report.bytesReceived;

  const seconds =
    (report.timestamp - previous.time) / 1000;

  if (!bytes || seconds <= 0) return null;

  return Math.max(
    0,
    (bytes - previous.bytes) * 8 / seconds / 1e6
  );

}


async function updateStats() {

  const senderLines = [];

  let number = 1;

  for (const [id, pc] of senderPeers) {

    if (pc.signalingState === "closed") continue;

    try {

      const stats = await pc.getStats();

      const report = findVideoStats(
        stats,
        "outbound-rtp"
      );

      if (!report) continue;

      const previous = lastSender.get(id);

      const mbps = calculateBitrate(
        report,
        previous,
        "send"
      );

      lastSender.set(id, {
        bytes: report.bytesSent || 0,
        time: report.timestamp
      });

      const codec = stats.get(report.codecId);

      senderLines.push(
        "受信者 " + number +
        "\n解像度: " +
        (report.frameWidth ?? "?") +
        "×" +
        (report.frameHeight ?? "?") +
        "\nFPS: " +
        (report.framesPerSecond ?? "?") +
        "\n速度: " +
        (mbps === null
          ? "計測中"
          : mbps.toFixed(2) + " Mbps") +
        "\nCodec: " +
        (codec?.mimeType || "?") +
        "\n状態: " +
        pc.connectionState
      );

      number++;

    } catch (error) {

      console.warn(
        "Sender stats error:",
        error
      );

    }

  }

  $("senderStats").textContent =
    senderLines.join("\n\n") ||
    "送信統計：未接続";


  // ======================================
  // WORKER STATS
  // ======================================

  if (role === "sender") {

    let info =
      "方式: " +
      (workerController
        ? "VideoFrame Worker"
        : "標準WebRTC");

    if (workerController) {

      const workerStats =
        workerController.getStats();

      info +=
        "\nWorker処理FPS: " +
        workerStats.fps +
        "\n破棄フレーム累計: " +
        workerStats.droppedFrames;

    }

    info +=
      "\n接続中: " +
      [...senderPeers.values()].filter(
        pc => pc.connectionState === "connected"
      ).length +
      "台";

    $("senderInfo").textContent = info;

  }


  // ======================================
  // RECEIVER STATS
  // ======================================

  if (!receiverPeer ||
      receiverPeer.signalingState === "closed") {

    $("receiverStats").textContent = "未接続";

    return;
  }

  try {

    const stats =
      await receiverPeer.getStats();

    const report =
      findVideoStats(stats, "inbound-rtp");

    if (!report) return;

    const mbps = calculateBitrate(
      report,
      lastReceiver,
      "receive"
    );

    lastReceiver = {
      bytes: report.bytesReceived || 0,
      time: report.timestamp
    };

    const codec = stats.get(report.codecId);

    $("receiverStats").textContent =
      "実測受信" +
      "\n解像度: " +
      (report.frameWidth ?? video.videoWidth ?? "?") +
      "×" +
      (report.frameHeight ?? video.videoHeight ?? "?") +
      "\nFPS: " +
      (report.framesPerSecond ?? "?") +
      "\n速度: " +
      (mbps === null
        ? "計測中"
        : mbps.toFixed(2) + " Mbps") +
      "\nCodec: " +
      (codec?.mimeType || "?") +
      "\nパケットロス累計: " +
      (report.packetsLost ?? "?");

  } catch (error) {

    console.warn(
      "Receiver stats error:",
      error
    );

  }

}


let statsBusy = false;

setInterval(async () => {

  if (statsBusy) return;

  statsBusy = true;

  try {

    await updateStats();

  } finally {

    statsBusy = false;

  }

}, 1000);

  document.getElementById("sendButton")
  .addEventListener("click", async () => {
    console.log("送信ボタンが押されました");

    try {
      const room = getRoom();

      status("共有する画面を選択してください...");

      sourceStream =
        await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

      status("画面取得成功！");

      if ($("renderMode").value === "worker") {
        try {
          workerController =
            await createWorkerStream(sourceStream);

          sendStream = workerController.stream;
        } catch (error) {
          console.warn("Worker失敗:", error);
          sendStream = sourceStream;
        }
      } else {
        sendStream = sourceStream;
      }

      role = "sender";

      await connectSocket();

      signal({
        type: "sender-join",
        room
      });

      status("送信準備完了");

    } catch (error) {
      console.error(error);
      status("送信エラー: " + error.message);
    }
  });
</script>

</body>
</html>
